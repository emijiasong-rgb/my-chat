<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>API 设置</title>
    <style>
        body {
            background: #1a1a1a !important;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #phone-shell {
            width: 393px !important;
            height: 852px !important;
            background: #f2f2f7;
            border-radius: 47px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        #viewport {
            flex: 1;
            overflow-y: auto;
            background: #f2f2f7;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }
        #viewport::-webkit-scrollbar { display: none; }

        /* 灵动岛 */
        #phone-shell::before {
            content: "";
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 1001;
        }

        /* Home 条 */
        #phone-shell::after {
            content: "";
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 100px;
            z-index: 1001;
        }

        /* ===== 标题栏 ===== */
        .header-bar {
            background: #f2f2f7;
            padding: 60px 15px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: #007aff;
            cursor: pointer;
            font-size: 16px;
        }

        .header-title {
            font-weight: bold;
            font-size: 17px;
            color: #000;
        }

        /* ✅ 加号按钮 */
        .add-btn {
            color: #007aff;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            padding: 0 5px;
            transition: transform 0.2s ease;
        }

        .add-btn:active {
            transform: scale(1.2);
        }

        /* ===== API 列表卡片 ===== */
        .api-list {
            padding: 10px 15px;
        }

        .api-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            position: relative;
        }

        .api-card:active {
            transform: scale(0.98);
            background: rgba(0,0,0,0.03);
        }

        .api-card-name {
            font-weight: 600;
            font-size: 17px;
            color: #000;
            margin-bottom: 6px;
        }

        .api-card-url {
            font-size: 13px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .api-card-status {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .status-connected {
            background: #d4edda;
            color: #28a745;
        }

        .status-disconnected {
            background: #f8d7da;
            color: #dc3545;
        }

        /* 删除按钮 */
        .delete-api-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff3b30;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
            opacity: 0.7;
        }

        .delete-api-btn:hover {
            opacity: 1;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state-sub {
            font-size: 13px;
            color: #bbb;
        }

        /* ===== 弹窗遮罩 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* ===== 弹窗内容（玻璃效果） ===== */
        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 25px 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #000;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #007aff;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cancel {
            background: rgba(0,0,0,0.05);
            color: #333;
        }

        .btn-save {
            background: #007aff;
            color: white;
        }

        .btn-save:hover {
            background: #0056cc;
        }

        /* 设置按钮（齿轮图标） */
        .settings-hint {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <!-- 标题栏 -->
            <div class="header-bar">
                <span class="back-btn" onclick="window.location.href='settings.html'">〈 返回</span>
                <span class="header-title">API 管理</span>
                <span class="add-btn" onclick="openAddModal()" title="添加 API">+</span>
            </div>

            <!-- API 列表 -->
            <div class="api-list" id="api-list">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- 添加/编辑 API 弹窗 -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">添加 API</div>
            
            <div class="input-group">
                <label>API 名称</label>
                <input type="text" id="api-name-input" placeholder="例如：OpenAI、DeepSeek...">
            </div>
            
            <div class="input-group">
                <label>API 地址</label>
                <input type="text" id="api-url-input" placeholder="https://api.openai.com">
            </div>
            
            <div class="input-group">
                <label>API 密钥</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
            </div>
            
            <div class="input-group">
                <label>模型名称（可选）</label>
                <input type="text" id="api-model-input" placeholder="gpt-3.5-turbo">
            </div>

            <div class="btn-group">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-save" onclick="saveApi()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // API 数据存储
        const STORAGE_KEY = 'saved_apis';
        let editingIndex = -1; // -1 表示新增，其他表示编辑的索引

        document.addEventListener('DOMContentLoaded', () => {
            renderApiList();
        });

        // 获取所有 API
        function getApis() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 保存所有 API
        function saveApis(apis) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(apis));
        }

        // 渲染 API 列表
        function renderApiList() {
            const apis = getApis();
            const container = document.getElementById('api-list');

            if (apis.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📡</div>
                        <div class="empty-state-text">还没有添加 API</div>
                        <div class="empty-state-sub">点击右上角 + 添加</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = apis.map((api, index) => `
                <div class="api-card" onclick="useApi(${index})">
                    <span class="delete-api-btn" onclick="deleteApi(event, ${index})">🗑️</span>
                    <div class="api-card-name">${escapeHtml(api.name) || '未命名'}</div>
                    <div class="api-card-url">${escapeHtml(api.url) || '未设置地址'}</div>
                    <span class="api-card-status status-connected">● 已保存</span>
                </div>
            `).join('');
        }

        // 打开添加弹窗
        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modal-title').innerText = '添加 API';
            document.getElementById('api-name-input').value = '';
            document.getElementById('api-url-input').value = '';
            document.getElementById('api-key-input').value = '';
            document.getElementById('api-model-input').value = '';
            document.getElementById('modal-overlay').classList.add('active');
        }

        // 打开编辑弹窗
        function openEditModal(index) {
            const apis = getApis();
            const api = apis[index];
            editingIndex = index;
            
            document.getElementById('modal-title').innerText = '编辑 API';
            document.getElementById('api-name-input').value = api.name || '';
            document.getElementById('api-url-input').value = api.url || '';
            document.getElementById('api-key-input').value = api.key || '';
            document.getElementById('api-model-input').value = api.model || '';
            document.getElementById('modal-overlay').classList.add('active');
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            editingIndex = -1;
        }

        // 保存 API
        function saveApi() {
            const name = document.getElementById('api-name-input').value.trim();
            const url = document.getElementById('api-url-input').value.trim();
            const key = document.getElementById('api-key-input').value.trim();
            const model = document.getElementById('api-model-input').value.trim();

            if (!name) {
                alert('请输入 API 名称');
                return;
            }

            if (!url) {
                alert('请输入 API 地址');
                return;
            }

            if (!key) {
                alert('请输入 API 密钥');
                return;
            }

            const newApi = { name, url, key, model };
            const apis = getApis();

            if (editingIndex >= 0) {
                // 编辑模式
                apis[editingIndex] = newApi;
            } else {
                // 新增模式
                apis.push(newApi);
            }

            saveApis(apis);
            
            // 同时更新当前使用的 API
            localStorage.setItem('api_url', url);
            localStorage.setItem('api_key', key);
            if (model) localStorage.setItem('api_model', model);
            
            closeModal();
            renderApiList();
        }

        // 使用 API
        function useApi(index) {
            const apis = getApis();
            const api = apis[index];
            
            localStorage.setItem('api_url', api.url);
            localStorage.setItem('api_key', api.key);
            if (api.model) localStorage.setItem('api_model', api.model);
            
            alert(`已选择 API: ${api.name}`);
        }

        // 删除 API
        function deleteApi(event, index) {
            event.stopPropagation(); // 阻止冒泡
            
            if (!confirm('确定要删除这个 API 吗？')) return;
            
            const apis = getApis();
            apis.splice(index, 1);
            saveApis(apis);
            renderApiList();
        }

        // 转义 HTML 防止 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // 点击遮罩关闭弹窗
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>

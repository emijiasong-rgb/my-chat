<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>API 设置</title>
    <style>
        body {
            background: #1a1a1a !important;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #phone-shell {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            background: #f2f2f7;
            border-radius: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
            flex-shrink: 0;
        }

        #viewport {
            flex: 1;
            overflow-y: auto;
            background: #f2f2f7;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            padding-top: env(safe-area-inset-top);
        }
        #viewport::-webkit-scrollbar { display: none; }

        /* ===== 标题栏 ===== */
        .header-bar {
            background: #f2f2f7;
            padding: 15px 15px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: #007aff;
            cursor: pointer;
            font-size: 16px;
        }

        .header-title {
            font-weight: bold;
            font-size: 17px;
            color: #000;
        }

        .add-btn {
            color: #007aff;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            padding: 0 5px;
        }

        .add-btn:active {
            transform: scale(1.2);
        }

        /* ===== API 列表卡片 ===== */
        .api-list {
            padding: 10px 15px;
        }

        .api-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            position: relative;
        }

        .api-card:active {
            transform: scale(0.98);
        }

        .api-card-name {
            font-weight: 600;
            font-size: 17px;
            color: #000;
            margin-bottom: 6px;
        }

        .api-card-url {
            font-size: 13px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .api-card-status {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .status-connected {
            background: #d4edda;
            color: #28a745;
        }

        .delete-api-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff3b30;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state-sub {
            font-size: 13px;
            color: #bbb;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 25px 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #000;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #007aff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cancel {
            background: rgba(0,0,0,0.05);
            color: #333;
        }

        .btn-save {
            background: #007aff;
            color: white;
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="header-bar">
                <span class="back-btn" onclick="window.location.href='settings.html'">〈 返回</span>
                <span class="header-title">API 管理</span>
                <span class="add-btn" onclick="openAddModal()">+</span>
            </div>

            <div class="api-list" id="api-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">添加 API</div>
            
            <div class="input-group">
                <label>API 名称</label>
                <input type="text" id="api-name-input" placeholder="例如：OpenAI、DeepSeek...">
            </div>
            
            <div class="input-group">
                <label>API 地址</label>
                <input type="text" id="api-url-input" placeholder="https://api.openai.com">
            </div>
            
            <div class="input-group">
                <label>API 密钥</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
            </div>
            
            <div class="input-group">
                <label>模型名称（可选）</label>
                <input type="text" id="api-model-input" placeholder="gpt-3.5-turbo">
            </div>

            <div class="btn-group">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-save" onclick="saveApi()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var STORAGE_KEY = 'saved_apis';
        var editingIndex = -1;

        document.addEventListener('DOMContentLoaded', function() {
            renderApiList();
        });

        function getApis() {
            var data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveApis(apis) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(apis));
        }

        function renderApiList() {
            var apis = getApis();
            var container = document.getElementById('api-list');

            if (apis.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📡</div><div class="empty-state-text">还没有添加 API</div><div class="empty-state-sub">点击右上角 + 添加</div></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < apis.length; i++) {
                var api = apis[i];
                html += '<div class="api-card" onclick="useApi(' + i + ')">' +
                    '<span class="delete-api-btn" onclick="deleteApi(event, ' + i + ')">🗑️</span>' +
                    '<div class="api-card-name">' + escapeHtml(api.name || '未命名') + '</div>' +
                    '<div class="api-card-url">' + escapeHtml(api.url || '未设置地址') + '</div>' +
                    '<span class="api-card-status status-connected">● 已保存</span></div>';
            }
            container.innerHTML = html;
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modal-title').innerText = '添加 API';
            document.getElementById('api-name-input').value = '';
            document.getElementById('api-url-input').value = '';
            document.getElementById('api-key-input').value = '';
            document.getElementById('api-model-input').value = '';
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            editingIndex = -1;
        }

        function saveApi() {
            var name = document.getElementById('api-name-input').value.trim();
            var url = document.getElementById('api-url-input').value.trim();
            var key = document.getElementById('api-key-input').value.trim();
            var model = document.getElementById('api-model-input').value.trim();

            if (!name) { alert('请输入 API 名称'); return; }
            if (!url) { alert('请输入 API 地址'); return; }
            if (!key) { alert('请输入 API 密钥'); return; }

            var newApi = { name: name, url: url, key: key, model: model };
            var apis = getApis();

            if (editingIndex >= 0) {
                apis[editingIndex] = newApi;
            } else {
                apis.push(newApi);
            }

            saveApis(apis);
            localStorage.setItem('api_url', url);
            localStorage.setItem('api_key', key);
            if (model) localStorage.setItem('api_model', model);
            
            closeModal();
            renderApiList();
        }

        function useApi(index) {
            var apis = getApis();
            var api = apis[index];
            localStorage.setItem('api_url', api.url);
            localStorage.setItem('api_key', api.key);
            if (api.model) localStorage.setItem('api_model', api.model);
            alert('已选择 API: ' + api.name);
        }

        function deleteApi(event, index) {
            event.stopPropagation();
            if (!confirm('确定要删除这个 API 吗？')) return;
            var apis = getApis();
            apis.splice(index, 1);
            saveApis(apis);
            renderApiList();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }

        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>

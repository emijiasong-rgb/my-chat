<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>创建角色</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:#f2f2f7; border-radius:0; display:flex; flex-direction:column; overflow:hidden;
        }
        #viewport { flex:1; overflow-y:auto; padding:16px; padding-top:env(safe-area-inset-top); }
        #viewport::-webkit-scrollbar { display:none; }

        .header {
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 0; margin-bottom:16px;
        }
        .header a { color:#5b6abf; font-size:16px; text-decoration:none; }
        .header span { font-weight:700; font-size:17px; }

        .card {
            background:rgba(255,255,255,0.7); backdrop-filter:blur(20px);
            border-radius:18px; padding:20px 16px; margin-bottom:14px;
            border:1px solid rgba(255,255,255,0.7);
        }
        .card-title { font-size:13px; color:#8e8e93; margin-bottom:14px; }

        .field { margin-bottom:12px; }
        .field:last-child { margin-bottom:0; }
        .field label { display:block; font-size:13px; color:#636366; margin-bottom:4px; }
        .field input, .field textarea {
            width:100%; padding:10px 14px; border:1px solid #ddd;
            border-radius:10px; font-size:15px; outline:none; background:#f9f9f9;
        }
        .field textarea { min-height:60px; resize:vertical; }

        .tags { display:flex; flex-wrap:wrap; gap:8px; }
        .tag {
            padding:7px 14px; border:1px solid #ddd; border-radius:20px;
            font-size:13px; cursor:pointer; background:#fff;
        }
        .tag.on { background:#5b6abf; color:#fff; border-color:#5b6abf; }

        .nickname-box { display:none; margin-top:12px; }
        .nickname-box.show { display:block; }

        .save-link {
            display:block; width:100%; padding:14px; background:#5b6abf;
            color:#fff; text-align:center; border-radius:14px;
            font-size:17px; font-weight:600; text-decoration:none; margin-top:8px;
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="header">
                <a href="chat.html">〈 返回</a>
                <span>创建角色</span>
                <a href="chat.html" style="opacity:0;">完成</a>
            </div>

            <div class="card">
                <div class="card-title">基本信息</div>
                <div class="field">
                    <label>角色名字 *</label>
                    <input type="text" id="role-name" placeholder="给角色起个名字">
                </div>
                <div class="field">
                    <label>性格特点</label>
                    <textarea id="role-personality" placeholder="温柔体贴、幽默风趣..."></textarea>
                </div>
                <div class="field">
                    <label>口头禅</label>
                    <input type="text" id="role-catchphrase" placeholder="角色常说的话">
                </div>
            </div>

            <div class="card">
                <div class="card-title">关系设置</div>
                <div class="field">
                    <label>你的名字</label>
                    <input type="text" id="user-name" placeholder="你的名字">
                </div>
                <div class="field">
                    <label>角色所在地区</label>
                    <input type="text" id="role-location" placeholder="角色在哪个城市">
                </div>
                <div class="field">
                    <label>关系 *（点击选择）</label>
                    <div class="tags" id="relation-tags">
                        <span class="tag" data-r="朋友" onclick="pick(this)">朋友</span>
                        <span class="tag" data-r="同学" onclick="pick(this)">同学</span>
                        <span class="tag" data-r="老师" onclick="pick(this)">老师</span>
                        <span class="tag" data-r="哥哥" onclick="pick(this)">哥哥</span>
                        <span class="tag" data-r="弟弟" onclick="pick(this)">弟弟</span>
                        <span class="tag" data-r="姐姐" onclick="pick(this)">姐姐</span>
                        <span class="tag" data-r="暧昧对象" onclick="pick(this)">暧昧对象</span>
                        <span class="tag" data-r="crush" onclick="pick(this)">crush</span>
                        <span class="tag" data-r="老公" onclick="pick(this)">老公</span>
                        <span class="tag" data-r="老婆" onclick="pick(this)">老婆</span>
                    </div>
                </div>
                <div class="nickname-box" id="nick-box">
                    <div class="field">
                        <label>角色对你的称呼 *</label>
                        <input type="text" id="user-nickname" placeholder="必填，角色叫你什么">
                    </div>
                    <div class="field">
                        <label>备选称呼1（选填）</label>
                        <input type="text" id="user-nickname2" placeholder="其他称呼">
                    </div>
                    <div class="field">
                        <label>备选称呼2（选填）</label>
                        <input type="text" id="user-nickname3" placeholder="其他称呼">
                    </div>
                </div>
            </div>

            <a href="#" class="save-link" id="save-btn" onclick="save();return false;">💾 保存角色</a>
        </div>
    </div>

    <script>
        var rel = '';

        function pick(tag) {
            var tags = document.querySelectorAll('#relation-tags .tag');
            for (var i = 0; i < tags.length; i++) { tags[i].classList.remove('on'); }
            tag.classList.add('on');
            rel = tag.getAttribute('data-r');
            document.getElementById('nick-box').classList.add('show');
        }

        function save() {
            var name = document.getElementById('role-name').value.trim();
            if (!name) return;
            if (!rel) return;
            var nick = document.getElementById('user-nickname').value.trim();
            if (!nick) return;

            var phone = '1' + Math.floor(Math.random() * 9000000000 + 1000000000);
            var wx = 'wxid_' + Math.random().toString(36).substring(2, 10);

            var role = {
                id: Date.now(),
                avatar: '',
                name: name,
                gender: '',
                personality: document.getElementById('role-personality').value.trim(),
                background: '',
                catchphrase: document.getElementById('role-catchphrase').value.trim(),
                userName: document.getElementById('user-name').value.trim(),
                userLocation: document.getElementById('role-location').value.trim(),
                userPreference: '',
                relation: rel,
                userNickname: nick,
                userNickname2: document.getElementById('user-nickname2').value.trim(),
                userNickname3: document.getElementById('user-nickname3').value.trim(),
                phone: phone,
                wechatId: wx,
                messages: []
            };

            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            roles.push(role);
            localStorage.setItem('chat_roles', JSON.stringify(roles));

            document.getElementById('save-btn').innerText = '✅ 已保存！点击返回';
            document.getElementById('save-btn').href = 'chat.html';
            document.getElementById('save-btn').onclick = null;
            
            setTimeout(function() {
                window.open('chat.html', '_self');
            }, 500);
        }
    </script>
</body>
</html>

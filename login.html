<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page { background: #fff; padding: 40px 20px; text-align: center; }
        /* 头像和名字的黑色细框 */
        .profile-box { 
            border: 1px solid #000; display: inline-block; 
            padding: 20px 40px; border-radius: 15px; margin-bottom: 30px;
        }
        .login-avatar { width: 80px; height: 80px; background: #c7c7cc; border-radius: 50%; margin: 0 auto 10px; }
        .profile-box span { font-weight: bold; font-size: 18px; }

        /* 输入框样式 */
        .input-group { text-align: left; margin-bottom: 15px; width: 100%; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .ios-input { 
            width: 100%; height: 45px; border: 1px solid #ddd; 
            border-radius: 8px; padding: 0 12px; font-size: 16px; color: #000;
        }
        .ios-input::placeholder { color: #8e8e93; }

        .forgot-link { color: #007aff; font-size: 13px; cursor: pointer; display: block; text-align: left; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="header-title">
            <span style="position:absolute; left:15px; cursor:pointer" onclick="window.location.href='settings.html'">〈 取消</span>
            <span>Apple 账户</span>
        </div>
        
        <div class="login-page">
            <div class="profile-box">
                <div class="login-avatar"></div>
                <span>请注册</span>
            </div>

            <div class="input-group">
                <label>QQ邮箱/用户名</label>
                <input type="text" class="ios-input" placeholder="输入qq邮箱/用户名">
            </div>

            <div class="input-group">
                <input type="password" class="ios-input" placeholder="输入密码">
                <span class="forgot-link" onclick="window.location.href='forgot.html'">忘记密码</span>
            </div>
            
            <button class="btn-save" style="background:#000; margin-top:30px;">登录</button>
        </div>
    </div>
</body>
</html>

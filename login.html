<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 保持你的原有的样式不变 */
        .login-page { background: #fff; padding: 40px 20px; text-align: center; }
        .profile-box { 
            border: 1px solid #000; display: inline-block; 
            padding: 20px 40px; border-radius: 15px; margin-bottom: 30px;
        }
        .login-avatar { width: 80px; height: 80px; background: #c7c7cc; border-radius: 50%; margin: 0 auto 10px; }
        .profile-box span { font-weight: bold; font-size: 18px; }
    </style>
</head>

<body>
    <div id="phone-shell">
        <a href="settings.html" class="back-link">〈 返回</a>

        <div class="page-flex-container">
            <div style="border: 1px solid #000; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 40px;">
                <div class="login-avatar"></div>
                <b style="font-size: 18px;">请注册</b>
            </div>

            <div style="width: 100%; max-width: 300px; text-align: left;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">QQ邮箱/用户名</label>
                <input type="text" id="login-username" class="ios-input-large" placeholder="输入qq邮箱/用户名">
                <input type="password" id="login-password" class="ios-input-large" placeholder="输入密码">
            </div>

            <div style="width: 100%; max-width: 300px; display: flex; justify-content: space-between; margin-bottom: 30px;">
                <span style="color: #007aff; cursor: pointer; font-size: 13px;" onclick="window.location.href='forgot.html'">忘记密码</span>
                <span style="color: #007aff; cursor: pointer; font-size: 13px;" onclick="window.location.href='register.html'">还没有账号</span>
            </div>

            <button class="black-square-btn" id="login-submit-btn" onclick="handleLogin()">登录</button>
        </div>
    </div>

    <script>
function handleLogin() {
    const emailInput = document.getElementById('login-username').value.trim();
    const passwordInput = document.getElementById('login-password').value.trim();

    if (!emailInput || !passwordInput) {
        alert("请输入账号和密码");
        return;
    }

    const savedPassword = localStorage.getItem('user_' + emailInput);

    if (savedPassword === null) {
        alert("该账号尚未注册，请先点击‘还没有账号’进行注册");
    } else if (savedPassword === passwordInput) {
        // 登录成功：保存状态
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', emailInput);
        alert("登录成功！");
        
        // 留在登录页，并显示已登录的UI
        showLoggedInUI(emailInput);
    } else {
        alert("密码错误，请重新输入");
    }
}

// 新增函数：登录成功后显示用户信息
function showLoggedInUI(username) {
    // 获取页面容器
    const container = document.querySelector('.page-flex-container');
    
    // 隐藏登录表单相关的元素
    const loginBox = container.querySelector('div[style*="border: 1px solid #000; padding: 20px;"]');
    const usernameInput = document.getElementById('login-username');
    const passwordInput = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-submit-btn');
    const linksDiv = container.querySelector('div[style*="display: flex; justify-content: space-between;"]');
    
    if (loginBox) loginBox.style.display = 'none';
    if (usernameInput) usernameInput.style.display = 'none';
    if (passwordInput) passwordInput.style.display = 'none';
    if (loginBtn) loginBtn.style.display = 'none';
    if (linksDiv) linksDiv.style.display = 'none';
    
    // 显示已登录状态
    const loggedInDiv = document.createElement('div');
    loggedInDiv.id = 'loggedin-panel';
    loggedInDiv.style.cssText = 'text-align: center; padding: 20px; width: 100%; max-width: 300px;';
    loggedInDiv.innerHTML = `
        <div style="border: 1px solid #000; padding: 30px 20px; border-radius: 15px; margin-bottom: 30px;">
            <div class="login-avatar" style="background: #07c160; margin-bottom: 15px;"></div>
            <b style="font-size: 20px;">${username}</b>
            <p style="color: #666; margin-top: 10px;">已登录</p>
        </div>
        <button class="black-square-btn" id="logout-btn" style="background: #ff3b30; border: none;">退出登录</button>
        <button class="black-square-btn" id="go-home-btn" style="margin-top: 15px; background: #000;" onclick="goToHome()">进入主页面</button>
    `;
    container.appendChild(loggedInDiv);
    
    // 退出登录按钮事件
    document.getElementById('logout-btn').addEventListener('click', function() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('currentUser');
        window.location.reload();
    });
}

// 进入主页面
function goToHome() {
    window.location.href = 'index.html';
}
</script>
</body>
</html>

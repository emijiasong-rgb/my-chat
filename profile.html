<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>个人信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #phone-shell {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            background: #f2f2f7;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
        }

        #viewport {
            flex: 1;
            overflow-y: auto;
            background: #f2f2f7;
        }
        #viewport::-webkit-scrollbar { display: none; }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #fff;
            border-bottom: 0.5px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-bar span {
            cursor: pointer;
        }

        .profile-list {
            margin-top: 15px;
            background: white;
            border-top: 0.5px solid #ddd;
            border-bottom: 0.5px solid #ddd;
        }

        .profile-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 0.5px solid #eee; font-size: 16px;
            cursor: pointer;
        }
        .profile-item:last-child { border-bottom: none; }

        .profile-item input { 
            border: none; text-align: right; font-size: 16px; 
            outline: none; width: 60%; background: none; color: #000;
        }
        .profile-item input::placeholder { color: #888; }
        
        .avatar-edit { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }

        .logout-container { margin-top: 30px; padding: 0 15px 30px; }

        .logout-btn {
            width: 100%; background: white; color: #ff3b30;
            border: none; border-radius: 12px; height: 50px;
            font-weight: bold; font-size: 17px; cursor: pointer;
        }
        .logout-btn:active { background: #f0f0f0; }

        .arrow { color: #ccc; margin-left: 10px; font-size: 16px; }
    </style>
</head>
<body>

<div id="phone-shell">
    <div id="viewport">
        <div class="header-bar">
            <span onclick="history.back()" style="color:#007aff;">〈 返回</span>
            <span style="font-weight:bold;font-size:17px;">个人信息</span>
            <span onclick="saveProfile()" style="color:#007aff;font-weight:bold;">完成</span>
        </div>

        <div class="profile-list">
            <div class="profile-item" onclick="document.getElementById('avatar-input').click()">
                <span>头像</span>
                <div style="display:flex;align-items:center;">
                    <img src="默认头像.jpg" id="edit-avatar-preview" class="avatar-edit" alt="头像">
                    <span class="arrow">〉</span>
                </div>
                <input type="file" id="avatar-input" accept="image/*" style="display:none;">
            </div>

            <div class="profile-item">
                <span>昵称</span>
                <input type="text" id="edit-username" placeholder="请输入昵称">
            </div>

            <div class="profile-item">
                <span>个性签名</span>
                <input type="text" id="edit-bio" placeholder="请输入个性签名">
            </div>

            <div class="profile-item">
                <span>地区</span>
                <input type="text" id="edit-location" placeholder="请输入地区">
            </div>

            <div class="profile-item">
                <span>生日</span>
                <input type="date" id="edit-birthday">
            </div>

            <div class="profile-item" onclick="document.getElementById('bg-input').click()">
                <span>更换桌面壁纸</span>
                <div style="display:flex;align-items:center;">
                    <span id="bg-status" style="color:#888;font-size:14px;">点击上传</span>
                    <span class="arrow">〉</span>
                </div>
                <input type="file" id="bg-input" accept="image/*" style="display:none;">
            </div>

            <div class="profile-item" onclick="document.getElementById('header-bg-input').click()">
                <span>个人主页背景</span>
                <div style="display:flex;align-items:center;">
                    <span id="header-bg-status" style="color:#888;font-size:14px;">点击上传</span>
                    <span class="arrow">〉</span>
                </div>
                <input type="file" id="header-bg-input" accept="image/*" style="display:none;">
            </div>
        </div>

        <div class="logout-container">
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('edit-username').value = localStorage.getItem('currentUser') || "";
        document.getElementById('edit-avatar-preview').src = localStorage.getItem('savedAvatar') || "默认头像.jpg";
        document.getElementById('edit-birthday').value = localStorage.getItem('userBirthday') || "";
        document.getElementById('edit-bio').value = localStorage.getItem('userBio') || "";
        document.getElementById('edit-location').value = localStorage.getItem('userLocation') || "";
        
        if (localStorage.getItem('userWallpaper')) {
            document.getElementById('bg-status').textContent = '已设置';
            document.getElementById('bg-status').style.color = '#34c759';
        }
        
        if (localStorage.getItem('headerBackground')) {
            document.getElementById('header-bg-status').textContent = '已设置';
            document.getElementById('header-bg-status').style.color = '#34c759';
        }
    });

    document.getElementById('avatar-input').addEventListener('change', function(e) {
        if (e.target.files[0]) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('edit-avatar-preview').src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    document.getElementById('bg-input').addEventListener('change', function(e) {
        if (e.target.files[0]) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                localStorage.setItem('userWallpaper', ev.target.result);
                document.getElementById('bg-status').textContent = '已选择';
                document.getElementById('bg-status').style.color = '#ff9500';
                alert("壁纸已选择，点击完成后生效");
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    document.getElementById('header-bg-input').addEventListener('change', function(e) {
        if (e.target.files[0]) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                localStorage.setItem('headerBackground', ev.target.result);
                document.getElementById('header-bg-status').textContent = '已选择';
                document.getElementById('header-bg-status').style.color = '#ff9500';
                alert("个人主页背景已选择，点击完成后生效");
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    function saveProfile() {
        var name = document.getElementById('edit-username').value;
        if (!name.trim()) { alert("昵称不能为空"); return; }

        localStorage.setItem('currentUser', name);
        localStorage.setItem('savedAvatar', document.getElementById('edit-avatar-preview').src);
        localStorage.setItem('userBirthday', document.getElementById('edit-birthday').value);
        localStorage.setItem('userBio', document.getElementById('edit-bio').value);
        localStorage.setItem('userLocation', document.getElementById('edit-location').value);
        
        alert("修改成功");
        location.href = 'index.html'; 
    }

    function logout() {
        if(confirm("确定要退出登录吗？")) {
            localStorage.clear();
            location.href = 'login.html'; 
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>日历</title>
    <style>
        :root {
            --bg: #FDF8F2;
            --card-bg: #fff;
            --text: #3A3A3A;
            --green: #7CB87C;
            --purple: #E0D4F5;
            --pink: #F7A1C4;
            --grey: #B0B0B0;
            --red: #F5D4D4;
            --light-green: #D4F0D4;
            --separator: #f0ede8;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:var(--text);
            background:var(--bg);
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        .nav-bar {
            display:flex; align-items:center; padding:10px 16px;
            background:var(--bg); border-bottom:0.5px solid var(--separator);
            position:relative;
        }
        .nav-back { font-size:17px; color:#007aff; cursor:pointer; text-decoration:none; }
        .nav-title { font-size:17px; font-weight:600; position:absolute; left:50%; transform:translateX(-50%); color:var(--text); }
        .nav-add {
            position:absolute; right:16px; font-size:22px; color:var(--text);
            cursor:pointer; width:32px; height:32px; display:flex;
            align-items:center; justify-content:center; border-radius:50%;
        }
        .nav-add:active { background:#f0f0f0; }

        #viewport { flex:1; overflow-y:auto; padding:10px 10px; }
        #viewport::-webkit-scrollbar { display:none; }

        .month-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:8px 4px 12px;
        }
        .month-header .arrow { font-size:18px; cursor:pointer; padding:8px; color:var(--text); }
        .month-header .month-label { font-size:18px; font-weight:700; color:var(--text); }

        .weekday-row {
            display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
            font-size:11px; color:var(--grey); padding-bottom:4px;
        }

        .calendar-grid {
            display:grid; grid-template-columns:repeat(7,1fr);
            border-left:0.5px solid #eee; border-top:0.5px solid #eee;
        }
        .cal-cell {
            border-right:0.5px solid #eee; border-bottom:0.5px solid #eee;
            min-height:80px; padding:6px 4px 4px; cursor:pointer;
            position:relative; background:var(--card-bg);
            display:flex; flex-direction:column;
        }
        .cal-cell.other-month { background:#fafafa; }
        .cal-cell.other-month .day-num { color:#ddd; }
        .cal-cell.period { background:var(--purple); }

        .day-num {
            font-size:14px; font-weight:600; color:var(--text);
            text-align:right; margin-bottom:2px;
        }
        .day-num.today-circle {
            display:inline-block; width:24px; height:24px; line-height:24px;
            text-align:center; border-radius:50%; background:var(--pink);
            color:#fff; font-size:13px; float:right;
        }

        .cell-events {
            flex:1; display:flex; flex-direction:column; gap:2px;
            overflow:hidden;
        }
        .cell-event {
            font-size:9px; padding:3px 6px; border-radius:10px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            font-weight:500; cursor:pointer;
        }
        .cell-event.period-tag { background:rgba(196,168,224,0.6); color:#4A3070; }
        .cell-event.important-tag { background:var(--red); color:#6B2020; }
        .cell-event.reminder-tag { background:var(--light-green); color:#205020; }

        .legend { display:flex; gap:16px; padding:10px 4px; font-size:11px; color:var(--grey); }
        .legend-item { display:flex; align-items:center; gap:4px; }
        .legend-dot { width:10px; height:10px; border-radius:10px; }
        .legend-dot.period-dot { background:var(--purple); }
        .legend-dot.important-dot { background:var(--red); }
        .legend-dot.reminder-dot { background:var(--light-green); }

        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.4); z-index:2000; justify-content:center; align-items:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-card {
            background:var(--card-bg); border-radius:20px; padding:20px;
            width:85%; max-width:340px; text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,0.15);
        }
        .modal-card h4 { font-size:16px; margin-bottom:12px; color:var(--text); }

        .modal-option {
            padding:14px; font-size:15px; cursor:pointer; border-radius:12px;
            margin:4px 0; color:var(--text);
            display:flex; align-items:center; justify-content:space-between;
        }
        .modal-option:active { background:#f5f5f5; }
        .modal-option .option-label { font-weight:500; }
        .modal-option .option-value {
            font-size:13px; color:var(--grey); display:flex; align-items:center; gap:6px;
        }
        .date-pill {
            display:inline-block; padding:6px 14px; background:#f5f5f5;
            border-radius:20px; font-size:13px; color:var(--text); cursor:pointer;
            border:1px solid #e0e0e0;
        }
        .date-pill:active { background:#e8e8e8; }
        .date-pill-row { display:flex; gap:6px; align-items:center; }
        .date-pill-sep { font-size:12px; color:var(--grey); }

        .modal-input {
            width:100%; padding:10px; border:1px solid #e0e0e0;
            border-radius:10px; font-size:14px; margin-bottom:8px; outline:none;
        }
        .modal-btn { padding:10px 20px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin:4px; }
        .modal-btn.save { background:var(--green); color:#fff; }
        .modal-btn.cancel { background:#f0f0f0; color:#888; }
        .modal-btn.delete { background:#fff0f0; color:#D48383; }

        .date-input-row {
            display:flex; gap:8px; align-items:center; justify-content:center; margin-bottom:8px;
        }
        .date-input-row input[type="date"] {
            padding:8px 12px; border:1px solid #e0e0e0; border-radius:20px;
            font-size:14px; text-align:center; flex:1; max-width:140px;
            background:#f8f8f8; color:var(--text); outline:none;
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="25" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>
        <div class="nav-bar">
            <a href="javascript:history.back()" class="nav-back">← 返回</a>
            <span class="nav-title" id="cal-title">日历</span>
            <div class="nav-add" onclick="showAddModal()">+</div>
        </div>

        <div id="viewport">
            <div class="month-header">
                <span class="arrow" onclick="changeMonth(-1)">‹</span>
                <span class="month-label" id="month-label"></span>
                <span class="arrow" onclick="changeMonth(1)">›</span>
            </div>
            <div class="weekday-row"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <div class="legend">
                <span class="legend-item"><span class="legend-dot period-dot"></span> 经期</span>
                <span class="legend-item"><span class="legend-dot important-dot"></span> 重要日程</span>
                <span class="legend-item"><span class="legend-dot reminder-dot"></span> 提醒事项</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal-card">
            <h4>添加标记</h4>
            <div class="modal-option" onclick="showPeriodForm()">
                <span class="option-label">标记经期</span>
                <span class="option-value">
                    <span class="date-pill-row">
                        <span class="date-pill" id="period-start-pill" onclick="event.stopPropagation();document.getElementById('period-start-date').showPicker()">开始</span>
                        <span class="date-pill-sep">—</span>
                        <span class="date-pill" id="period-end-pill" onclick="event.stopPropagation();document.getElementById('period-end-date').showPicker()">结束</span>
                    </span>
                </span>
            </div>
            <div class="modal-option" onclick="showReminderForm()">
                <span class="option-label">提醒事项</span>
                <span class="option-value"><span class="date-pill" id="reminder-date-pill" onclick="event.stopPropagation();document.getElementById('reminder-date').showPicker()">日期</span></span>
            </div>
            <div class="modal-option" onclick="showImportantForm()">
                <span class="option-label">重要日程</span>
                <span class="option-value"><span class="date-pill" id="important-date-pill" onclick="event.stopPropagation();document.getElementById('important-date').showPicker()">日期</span></span>
            </div>
            <div class="modal-option" onclick="closeAddModal()" style="justify-content:center;color:#888;">取消</div>
        </div>
    </div>

    <input type="date" id="period-start-date" style="display:none;" onchange="updatePill('period-start-pill', this)">
    <input type="date" id="period-end-date" style="display:none;" onchange="updatePill('period-end-pill', this)">
    <input type="date" id="reminder-date" style="display:none;" onchange="updatePill('reminder-date-pill', this)">
    <input type="date" id="important-date" style="display:none;" onchange="updatePill('important-date-pill', this)">

    <div class="modal-overlay" id="detail-modal">
        <div class="modal-card">
            <h4 id="detail-modal-title">编辑</h4>
            <input type="text" class="modal-input" id="detail-title" placeholder="标题">
            <input type="text" class="modal-input" id="detail-note" placeholder="备注（可选）">
            <div class="date-input-row" id="detail-date-row">
                <input type="date" id="detail-start-date-input">
                <span id="detail-date-sep" style="display:none;">—</span>
                <input type="date" id="detail-end-date-input" style="display:none;">
            </div>
            <div>
                <button class="modal-btn delete" id="detail-delete-btn" onclick="deleteEvent()">删除</button>
                <button class="modal-btn cancel" onclick="closeDetailModal()">取消</button>
                <button class="modal-btn save" onclick="saveDetail()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var currentYear, currentMonth, eventsKey = 'daily_events_self';
        var pendingEventType = '';
        var editingEventIndex = -1;
        var editingEvent = null;

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000); updateClock();

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    document.getElementById('battery-percent').textContent = lvl + '%';
                    var lel = document.getElementById('battery-level');
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }
        updateBattery();

        function updatePill(pillId, input) {
            if (input.value) {
                var parts = input.value.split('-');
                document.getElementById(pillId).innerText = parts[1] + '月' + parts[2] + '日';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            if (id) { eventsKey = 'daily_events_role_' + id; document.getElementById('cal-title').innerText = '角色日程'; }
            var now = new Date(); currentYear = now.getFullYear(); currentMonth = now.getMonth();
            renderCalendar();
        });

        function changeMonth(d) {
            currentMonth += d;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function getEvents() {
            return JSON.parse(localStorage.getItem(eventsKey) || '[]');
        }

        function saveEvents(events) {
            localStorage.setItem(eventsKey, JSON.stringify(events));
        }

        function renderCalendar() {
            document.getElementById('month-label').innerText = currentYear + '年 ' + (currentMonth + 1) + '月';
            var today = new Date();
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            var firstDay = new Date(currentYear, currentMonth, 1).getDay();
            var events = getEvents();

            var html = '';
            for (var i = 0; i < firstDay; i++) { html += '<div class="cal-cell other-month"><div class="day-num"></div></div>'; }

            for (var d = 1; d <= daysInMonth; d++) {
                var cls = 'cal-cell';
                var isToday = (currentYear === today.getFullYear() && currentMonth === today.getMonth() && d === today.getDate());
                var dayEvents = getEventsForDay(events, currentYear, currentMonth + 1, d);

                // 只有经期改变整个格子背景
                var isPeriodDay = false;
                for (var j = 0; j < dayEvents.length; j++) {
                    if (dayEvents[j].type === 'period') { isPeriodDay = true; break; }
                }
                if (isPeriodDay) cls += ' period';

                var numHtml = isToday ? '<span class="day-num today-circle">' + d + '</span>' : '<span class="day-num">' + d + '</span>';

                var eventsHtml = '';
                if (dayEvents.length > 0) {
                    eventsHtml = '<div class="cell-events">';
                    var shown = [];
                    for (var k = 0; k < dayEvents.length; k++) {
                        var e = dayEvents[k];
                        var label = e.title || e.note || (e.type === 'period' ? '经期' : '');
                        if (label && shown.indexOf(label) === -1) {
                            shown.push(label);
                            var origIndex = events.indexOf(e);
                            eventsHtml += '<div class="cell-event ' + e.type + '-tag" onclick="event.stopPropagation();editEvent(' + origIndex + ')">' + escapeHtml(label) + '</div>';
                        }
                    }
                    eventsHtml += '</div>';
                }

                html += '<div class="' + cls + '">' + numHtml + eventsHtml + '</div>';
            }
            document.getElementById('calendar-grid').innerHTML = html;
        }

        function getEventsForDay(events, y, m, d) {
            return events.filter(function(e) {
                if (e.type === 'period' && e.endDate) {
                    var start = new Date(e.year, e.month - 1, e.day);
                    var end = new Date(e.endYear, e.endMonth - 1, e.endDay);
                    var cur = new Date(y, m - 1, d);
                    return cur >= start && cur <= end;
                }
                return e.year === y && e.month === m && e.day === d;
            });
        }

        // ========== 编辑事件 ==========
        function editEvent(index) {
            var events = getEvents();
            editingEvent = events[index];
            editingEventIndex = index;
            if (!editingEvent) return;

            pendingEventType = editingEvent.type;
            document.getElementById('detail-modal-title').innerText = '编辑';
            document.getElementById('detail-delete-btn').style.display = 'inline-block';

            if (editingEvent.type === 'period') {
                document.getElementById('detail-title').style.display = 'none';
                document.getElementById('detail-title').value = '';
                document.getElementById('detail-date-sep').style.display = 'inline';
                document.getElementById('detail-end-date-input').style.display = 'inline-block';
                document.getElementById('detail-start-date-input').value = formatDateStr(editingEvent.year, editingEvent.month, editingEvent.day);
                document.getElementById('detail-end-date-input').value = editingEvent.endDate ? formatDateStr(editingEvent.endYear, editingEvent.endMonth, editingEvent.endDay) : '';
            } else {
                document.getElementById('detail-title').style.display = 'block';
                document.getElementById('detail-title').value = editingEvent.title || '';
                document.getElementById('detail-date-sep').style.display = 'none';
                document.getElementById('detail-end-date-input').style.display = 'none';
                document.getElementById('detail-start-date-input').value = formatDateStr(editingEvent.year, editingEvent.month, editingEvent.day);
            }
            document.getElementById('detail-note').value = editingEvent.note || '';
            document.getElementById('detail-modal').classList.add('active');
        }

        function deleteEvent() {
            if (editingEventIndex < 0) return;
            if (!confirm('确定删除？')) return;
            var events = getEvents();
            events.splice(editingEventIndex, 1);
            saveEvents(events);
            closeDetailModal();
            renderCalendar();
        }

        function formatDateStr(y, m, d) {
            return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        }

        // ========== 新增 ==========
        function showAddModal() { document.getElementById('add-modal').classList.add('active'); }
        function closeAddModal() { document.getElementById('add-modal').classList.remove('active'); }

        function showPeriodForm() {
            editingEventIndex = -1; editingEvent = null;
            pendingEventType = 'period';
            document.getElementById('detail-modal-title').innerText = '标记经期';
            document.getElementById('detail-delete-btn').style.display = 'none';
            document.getElementById('detail-title').style.display = 'none';
            document.getElementById('detail-title').value = '';
            document.getElementById('detail-note').value = '';
            document.getElementById('detail-date-sep').style.display = 'inline';
            document.getElementById('detail-end-date-input').style.display = 'inline-block';
            document.getElementById('detail-start-date-input').value = document.getElementById('period-start-date').value;
            document.getElementById('detail-end-date-input').value = document.getElementById('period-end-date').value;
            closeAddModal();
            document.getElementById('detail-modal').classList.add('active');
        }

        function showReminderForm() {
            editingEventIndex = -1; editingEvent = null;
            pendingEventType = 'reminder';
            document.getElementById('detail-modal-title').innerText = '提醒事项';
            document.getElementById('detail-delete-btn').style.display = 'none';
            document.getElementById('detail-title').style.display = 'block';
            document.getElementById('detail-title').value = '';
            document.getElementById('detail-note').value = '';
            document.getElementById('detail-date-sep').style.display = 'none';
            document.getElementById('detail-end-date-input').style.display = 'none';
            document.getElementById('detail-start-date-input').value = document.getElementById('reminder-date').value;
            closeAddModal();
            document.getElementById('detail-modal').classList.add('active');
        }

        function showImportantForm() {
            editingEventIndex = -1; editingEvent = null;
            pendingEventType = 'important';
            document.getElementById('detail-modal-title').innerText = '重要日程';
            document.getElementById('detail-delete-btn').style.display = 'none';
            document.getElementById('detail-title').style.display = 'block';
            document.getElementById('detail-title').value = '';
            document.getElementById('detail-note').value = '';
            document.getElementById('detail-date-sep').style.display = 'none';
            document.getElementById('detail-end-date-input').style.display = 'none';
            document.getElementById('detail-start-date-input').value = document.getElementById('important-date').value;
            closeAddModal();
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); }

        function saveDetail() {
            var dateStr = document.getElementById('detail-start-date-input').value;
            if (!dateStr) { alert('请选择日期'); return; }
            var parts = dateStr.split('-');
            var title = pendingEventType === 'period' ? '' : (document.getElementById('detail-title').value.trim() || '');
            var note = document.getElementById('detail-note').value.trim();
            var displayTitle = pendingEventType === 'period' ? (note || '经期') : (title || note || '未命名');

            var ev = {
                type: pendingEventType,
                title: title,
                note: note,
                displayTitle: displayTitle,
                year: parseInt(parts[0]), month: parseInt(parts[1]), day: parseInt(parts[2])
            };
            if (pendingEventType === 'period') {
                var endStr = document.getElementById('detail-end-date-input').value;
                if (endStr) {
                    var ep = endStr.split('-');
                    ev.endYear = parseInt(ep[0]); ev.endMonth = parseInt(ep[1]); ev.endDay = parseInt(ep[2]);
                }
            }

            var events = getEvents();
            if (editingEventIndex >= 0) {
                events[editingEventIndex] = ev;
            } else {
                events.push(ev);
            }
            saveEvents(events);
            closeDetailModal();
            renderCalendar();
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.innerText = text || '';
            return d.innerHTML;
        }

        document.getElementById('add-modal').addEventListener('click', function(e) { if (e.target === this) closeAddModal(); });
        document.getElementById('detail-modal').addEventListener('click', function(e) { if (e.target === this) closeDetailModal(); });
    </script>
</body>
</html>

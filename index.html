<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>lulu chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Dancing+Script:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600&family=Roboto+Mono:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #main-app {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #phone-shell {
            width: 100%;
            height: 100%;
            background: #f2f2f7;
            border-radius: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
        }

        #viewport {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #viewport::-webkit-scrollbar { display: none; }

        .upload-hint, .upload-hint-banner { display: none !important; }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 6px;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
        }

        /* 字体样式 */
        body.font-default, body.font-default * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif !important; }
        body.font-noto-sans, body.font-noto-sans * { font-family: 'Noto Sans SC', -apple-system, sans-serif !important; }
        body.font-noto-serif, body.font-noto-serif * { font-family: 'Noto Serif SC', 'Times New Roman', serif !important; }
        body.font-kuaile, body.font-kuaile * { font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive !important; }
        body.font-nailao, body.font-nailao * { font-family: 'ZCOOL QingKe HuangYou', 'Comic Sans MS', cursive !important; }
        body.font-mashan, body.font-mashan * { font-family: 'Ma Shan Zheng', 'STKaiti', cursive !important; }
        body.font-longcang, body.font-longcang * { font-family: 'Long Cang', 'STKaiti', cursive !important; }
        body.font-zhimang, body.font-zhimang * { font-family: 'Zhi Mang Xing', cursive !important; }
        body.font-liujian, body.font-liujian * { font-family: 'Liu Jian Mao Cao', cursive !important; }
        body.font-dancing, body.font-dancing * { font-family: 'Dancing Script', 'Georgia', cursive !important; }
        body.font-pacifico, body.font-pacifico * { font-family: 'Pacifico', 'Georgia', cursive !important; }
        body.font-caveat, body.font-caveat * { font-family: 'Caveat', 'Comic Sans MS', cursive !important; }
        body.font-playfair, body.font-playfair * { font-family: 'Playfair Display', 'Georgia', serif !important; }
        body.font-montserrat, body.font-montserrat * { font-family: 'Montserrat', 'Helvetica Neue', sans-serif !important; }
        body.font-raleway, body.font-raleway * { font-family: 'Raleway', 'Helvetica Neue', sans-serif !important; }
        body.font-roboto-mono, body.font-roboto-mono * { font-family: 'Roboto Mono', 'SF Mono', 'Courier New', monospace !important; }
        body.font-monospace, body.font-monospace * { font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace !important; }
    </style>
</head>
<body>

<script>
function updateClocks() {
    var now = new Date();
    var hours = String(now.getHours()).padStart(2, '0');
    var minutes = String(now.getMinutes()).padStart(2, '0');
    
    if(document.getElementById('clock')) 
        document.getElementById('clock').innerText = hours + ':' + minutes;
    
    if(document.getElementById('big-time')) 
        document.getElementById('big-time').innerText = hours + ':' + minutes;
    
    var options = { month: 'long', day: 'numeric', weekday: 'short' };
    if(document.getElementById('big-date'))
        document.getElementById('big-date').innerText = now.toLocaleDateString('zh-CN', options);
}
setInterval(updateClocks, 1000);
document.addEventListener('DOMContentLoaded', updateClocks);
</script>

<div id="welcome-container" class="welcome-container">
    <div class="welcome-content">
        <h1 class="welcome-title">欢迎来到 lulu chat</h1>
        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="progress-text">页面加载中... <span class="progress-percentage">0</span>%</p>
        </div>
    </div>
</div>

<div id="main-app">
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span id="network-icon">
                    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                        <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                        <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                        <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                        <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                    </svg>
                </span>
                <span id="battery-container">
                    <svg id="battery-icon" width="25" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div id="viewport">
            <section id="page-home" class="page active">
                <div class="profile-card">
                    <div class="profile-banner" id="profile-banner" onclick="location.href='profile.html'"></div>
                    <div class="profile-content-wrapper">
                        <div class="profile-info">
                            <div class="profile-avatar-wrapper" onclick="location.href='profile.html'">
                                <img src="默认头像.jpg" id="user-avatar">
                            </div>
                            <h2 id="user-name">未登录用户</h2>
                            <p id="user-signature">请输入个性签名</p>
                            <span id="user-location">📍 请输入地区</span>
                        </div>
                        <div class="profile-clock-box">
                            <div id="big-time">--:--</div>
                            <div id="big-date">加载中...</div>
                        </div>
                    </div>
                </div>

                <div class="app-grid">
                    <div class="app-icon" onclick="window.location.href='chat.html'">
                        <div class="icon-box">💬</div>
                        <span>Chat</span>
                    </div>
                    <div class="app-icon gray-scale" onclick="alert('纪念日功能开发中...')">
                        <div class="icon-box">🤍</div>
                        <span>Ourtale</span>
                    </div>
                    <div class="app-icon" onclick="window.location.href='settings.html'">
                        <div class="icon-box">⚙️</div>
                        <span>Settings</span>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script>
function applyFont(fontKey) {
    var fontClasses = [
        'font-default', 'font-noto-sans', 'font-noto-serif', 
        'font-kuaile', 'font-nailao', 'font-mashan', 
        'font-longcang', 'font-zhimang', 'font-liujian',
        'font-dancing', 'font-pacifico', 'font-caveat',
        'font-playfair', 'font-montserrat', 'font-raleway',
        'font-roboto-mono', 'font-monospace'
    ];
    for (var i = 0; i < fontClasses.length; i++) {
        document.body.classList.remove(fontClasses[i]);
    }
    if (fontKey && fontKey !== 'default') {
        document.body.classList.add('font-' + fontKey);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    var savedFont = localStorage.getItem('user-font');
    if (savedFont) applyFont(savedFont);
    
    refreshUserUI(); 

    var urlParams = new URLSearchParams(window.location.search);
    var isFromSettings = urlParams.get('from') === 'settings';

    if (isFromSettings) {
        document.getElementById('welcome-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
    } else {
        startLoading(); 
    }
});

function startLoading() {
    var fill = document.querySelector('.progress-fill');
    var percentText = document.querySelector('.progress-percentage');
    var welcome = document.getElementById('welcome-container');
    var mainApp = document.getElementById('main-app');
    var progress = 0;

    var interval = setInterval(function() {
        progress += Math.floor(Math.random() * 15) + 5;
        if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            setTimeout(function() {
                welcome.style.display = 'none';
                mainApp.style.display = 'flex';
            }, 500);
        }
        if(fill) fill.style.width = progress + '%';
        if(percentText) percentText.innerText = progress;
    }, 150);
}

function refreshUserUI() {
    var currentUser = localStorage.getItem('currentUser') || "未登录用户";
    var avatar = localStorage.getItem('savedAvatar');
    var bio = localStorage.getItem('userBio') || '请输入个性签名';
    var location = localStorage.getItem('userLocation') || '请输入地区';
    var wallpaper = localStorage.getItem('userWallpaper'); 
    var headerBg = localStorage.getItem('headerBackgroundImage') || localStorage.getItem('headerBackground'); 

    if (document.getElementById('user-name')) document.getElementById('user-name').innerText = currentUser;
    if (document.getElementById('user-avatar') && avatar) document.getElementById('user-avatar').src = avatar;
    if (document.getElementById('user-signature')) document.getElementById('user-signature').innerText = bio;
    if (document.getElementById('user-location')) document.getElementById('user-location').innerText = '📍 ' + location;

    var homePage = document.getElementById('page-home');
    if (homePage && wallpaper) {
        homePage.style.backgroundImage = 'url(' + wallpaper + ')';
        homePage.style.backgroundSize = 'cover';
        homePage.style.backgroundPosition = 'center';
    }
    
    var profileBanner = document.getElementById('profile-banner');
    if (profileBanner && headerBg) {
        profileBanner.style.backgroundImage = 'url(' + headerBg + ')';
        profileBanner.style.backgroundSize = 'cover';
        profileBanner.style.backgroundPosition = 'center';
    }
}
</script>
    
</body>
</html>

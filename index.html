<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>lulu chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Dancing+Script:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600&family=Roboto+Mono:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a; height: 100dvh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #main-app {
            width: 100vw; max-width: 430px; height: 100dvh; max-height: 932px;
            display: none; justify-content: center; align-items: center;
        }
        #phone-shell {
            width: 100%; height: 100%; background: #f2f2f7;
            display: flex; flex-direction: column; overflow: hidden;
        }
        #viewport { flex: 1; overflow-y: auto; }
        #viewport::-webkit-scrollbar { display: none; }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px 6px; font-size: 13px; font-weight: 500;
        }
        .app-grid {
            display: flex; justify-content: space-around;
            padding: 20px 10px; gap: 8px;
        }
        .app-icon {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; cursor: pointer; transition: transform 0.2s;
        }
        .app-icon:active { transform: scale(0.92); }
        .app-icon span { font-size: 12px; font-weight: 500; color: #3A3A3A; }
        .icon-box {
            width: 56px; height: 56px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-box.chat { background: #E8F5E9; }
        .icon-box.chat svg { stroke: #4CAF50; }
        .icon-box.daily { background: #F3E5F5; }
        .icon-box.daily svg { stroke: #9C27B0; }
        .icon-box.ourtale { background: #FCE4EC; }
        .icon-box.ourtale svg { stroke: #E91E63; }
        .icon-box.settings { background: #E3F2FD; }
        .icon-box.settings svg { stroke: #2196F3; }

        body.font-default, body.font-default * { font-family: -apple-system, sans-serif !important; }
        body.font-noto-sans, body.font-noto-sans * { font-family: 'Noto Sans SC', sans-serif !important; }
        body.font-noto-serif, body.font-noto-serif * { font-family: 'Noto Serif SC', serif !important; }
        body.font-kuaile, body.font-kuaile * { font-family: 'ZCOOL KuaiLe', cursive !important; }
        body.font-nailao, body.font-nailao * { font-family: 'ZCOOL QingKe HuangYou', cursive !important; }
        body.font-mashan, body.font-mashan * { font-family: 'Ma Shan Zheng', cursive !important; }
        body.font-longcang, body.font-longcang * { font-family: 'Long Cang', cursive !important; }
        body.font-zhimang, body.font-zhimang * { font-family: 'Zhi Mang Xing', cursive !important; }
        body.font-liujian, body.font-liujian * { font-family: 'Liu Jian Mao Cao', cursive !important; }
        body.font-dancing, body.font-dancing * { font-family: 'Dancing Script', cursive !important; }
        body.font-pacifico, body.font-pacifico * { font-family: 'Pacifico', cursive !important; }
        body.font-caveat, body.font-caveat * { font-family: 'Caveat', cursive !important; }
        body.font-playfair, body.font-playfair * { font-family: 'Playfair Display', serif !important; }
        body.font-montserrat, body.font-montserrat * { font-family: 'Montserrat', sans-serif !important; }
        body.font-raleway, body.font-raleway * { font-family: 'Raleway', sans-serif !important; }
        body.font-roboto-mono, body.font-roboto-mono * { font-family: 'Roboto Mono', monospace !important; }
        body.font-monospace, body.font-monospace * { font-family: 'SF Mono', monospace !important; }
    </style>
</head>
<body>

<script>
function updateClocks() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2,'0'), m = String(now.getMinutes()).padStart(2,'0');
    if(document.getElementById('clock')) document.getElementById('clock').innerText = h + ':' + m;
    if(document.getElementById('big-time')) document.getElementById('big-time').innerText = h + ':' + m;
}
setInterval(updateClocks, 1000);
document.addEventListener('DOMContentLoaded', updateClocks);
</script>

<div id="welcome-container" class="welcome-container">
    <div class="welcome-content">
        <h1 class="welcome-title">欢迎来到 lulu chat</h1>
        <div class="progress-bar-container">
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <p class="progress-text">页面加载中... <span class="progress-percentage">0</span>%</p>
        </div>
    </div>
</div>

<div id="main-app">
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-percent">--%</span>
            </div>
        </div>

        <div id="viewport">
            <section id="page-home" class="page active">
                <div class="profile-card">
                    <div class="profile-banner" id="profile-banner" onclick="location.href='profile.html'"></div>
                    <div class="profile-content-wrapper">
                        <div class="profile-info">
                            <div class="profile-avatar-wrapper" onclick="location.href='profile.html'">
                                <img src="默认头像.jpg" id="user-avatar">
                            </div>
                            <h2 id="user-name">未登录用户</h2>
                            <p id="user-signature">请输入个性签名</p>
                            <span id="user-location">📍 请输入地区</span>
                        </div>
                        <div class="profile-clock-box">
                            <div id="big-time">--:--</div>
                            <div id="big-date">加载中...</div>
                        </div>
                    </div>
                </div>

                <div class="app-grid">
                    <div class="app-icon" onclick="window.location.href='chat.html'">
                        <div class="icon-box chat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
                        </div>
                        <span>Chat</span>
                    </div>
                    <div class="app-icon" onclick="window.location.href='daily.html'">
                        <div class="icon-box daily">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
                        </div>
                        <span>Daily</span>
                    </div>
                    <div class="app-icon" onclick="alert('纪念日功能开发中...')">
                        <div class="icon-box ourtale">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                        </div>
                        <span>Ourtale</span>
                    </div>
                    <div class="app-icon" onclick="window.location.href='settings.html'">
                        <div class="icon-box settings">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        </div>
                        <span>Settings</span>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script>
function applyFont(k) {
    var list = ['font-default','font-noto-sans','font-noto-serif','font-kuaile','font-nailao','font-mashan','font-longcang','font-zhimang','font-liujian','font-dancing','font-pacifico','font-caveat','font-playfair','font-montserrat','font-raleway','font-roboto-mono','font-monospace'];
    list.forEach(function(c){ document.body.classList.remove(c); });
    if (k && k !== 'default') document.body.classList.add('font-' + k);
}

document.addEventListener('DOMContentLoaded', function() {
    var f = localStorage.getItem('user-font'); if (f) applyFont(f);
    refreshUserUI();
    var p = new URLSearchParams(window.location.search);
    var from = p.get('from');
    if (from === 'settings' || from === 'lockscreen' || from === 'chat') {
        document.getElementById('welcome-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
    } else { startLoading(); }
});

function startLoading() {
    var fill = document.querySelector('.progress-fill');
    var txt = document.querySelector('.progress-percentage');
    var w = document.getElementById('welcome-container');
    var progress = 0;
    var t = setInterval(function() {
        progress += Math.floor(Math.random() * 15) + 5;
        if (progress >= 100) { progress = 100; clearInterval(t);
            setTimeout(function() { w.style.display = 'none'; window.location.href = 'lockscreen.html'; }, 500); }
        if(fill) fill.style.width = progress + '%';
        if(txt) txt.innerText = progress;
    }, 150);
}

function refreshUserUI() {
    var u = localStorage.getItem('currentUser') || "未登录用户";
    var a = localStorage.getItem('savedAvatar');
    var b = localStorage.getItem('userBio') || '请输入个性签名';
    var l = localStorage.getItem('userLocation') || '请输入地区';
    var wp = localStorage.getItem('userWallpaper');
    var hb = localStorage.getItem('headerBackgroundImage') || localStorage.getItem('headerBackground');
    if (document.getElementById('user-name')) document.getElementById('user-name').innerText = u;
    if (document.getElementById('user-avatar') && a) document.getElementById('user-avatar').src = a;
    if (document.getElementById('user-signature')) document.getElementById('user-signature').innerText = b;
    if (document.getElementById('user-location')) document.getElementById('user-location').innerText = '📍 ' + l;
    var home = document.getElementById('page-home');
    if (home && wp) { home.style.backgroundImage = 'url(' + wp + ')'; home.style.backgroundSize = 'cover'; home.style.backgroundPosition = 'center'; }
    var banner = document.getElementById('profile-banner');
    if (banner && hb) { banner.style.backgroundImage = 'url(' + hb + ')'; banner.style.backgroundSize = 'cover'; banner.style.backgroundPosition = 'center'; }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lulu chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- ✅ 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Dancing+Script:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600&family=Roboto+Mono:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 确保背景占满全屏 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0; 
        }
        #main-app {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .profile-header-bg {
            width: 100%;
            height: 120px;
            background-size: cover;
            background-position: center;
            background-color: #e0e0e0;
            position: relative;
        }

        /* 隐藏上传提示文字 */
        .upload-hint, .upload-hint-banner {
            display: none !important;
        }

        /* ===== ✅ 字体样式定义 ===== */
        body.font-default,
        body.font-default * {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif !important;
        }
        
        body.font-noto-sans,
        body.font-noto-sans * {
            font-family: 'Noto Sans SC', -apple-system, sans-serif !important;
        }
        
        body.font-noto-serif,
        body.font-noto-serif * {
            font-family: 'Noto Serif SC', 'Times New Roman', serif !important;
        }
        
        body.font-kuaile,
        body.font-kuaile * {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive !important;
        }
        
        body.font-nailao,
        body.font-nailao * {
            font-family: 'ZCOOL QingKe HuangYou', 'Comic Sans MS', cursive !important;
        }
        
        body.font-mashan,
        body.font-mashan * {
            font-family: 'Ma Shan Zheng', 'STKaiti', cursive !important;
        }
        
        body.font-longcang,
        body.font-longcang * {
            font-family: 'Long Cang', 'STKaiti', cursive !important;
        }
        
        body.font-zhimang,
        body.font-zhimang * {
            font-family: 'Zhi Mang Xing', cursive !important;
        }
        
        body.font-liujian,
        body.font-liujian * {
            font-family: 'Liu Jian Mao Cao', cursive !important;
        }
        
        body.font-dancing,
        body.font-dancing * {
            font-family: 'Dancing Script', 'Georgia', cursive !important;
        }
        
        body.font-pacifico,
        body.font-pacifico * {
            font-family: 'Pacifico', 'Georgia', cursive !important;
        }
        
        body.font-caveat,
        body.font-caveat * {
            font-family: 'Caveat', 'Comic Sans MS', cursive !important;
        }
        
        body.font-playfair,
        body.font-playfair * {
            font-family: 'Playfair Display', 'Georgia', serif !important;
        }
        
        body.font-montserrat,
        body.font-montserrat * {
            font-family: 'Montserrat', 'Helvetica Neue', sans-serif !important;
        }
        
        body.font-raleway,
        body.font-raleway * {
            font-family: 'Raleway', 'Helvetica Neue', sans-serif !important;
        }
        
        body.font-roboto-mono,
        body.font-roboto-mono * {
            font-family: 'Roboto Mono', 'SF Mono', 'Courier New', monospace !important;
        }
        
        body.font-monospace,
        body.font-monospace * {
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace !important;
        }
    </style>
</head>
<body>

<script>
function updateClocks() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    if(document.getElementById('clock')) 
        document.getElementById('clock').innerText = `${hours}:${minutes}`;
    
    if(document.getElementById('big-time')) 
        document.getElementById('big-time').innerText = `${hours}:${minutes}`;
    
    const options = { month: 'long', day: 'numeric', weekday: 'short' };
    if(document.getElementById('big-date'))
        document.getElementById('big-date').innerText = now.toLocaleDateString('zh-CN', options);
}
setInterval(updateClocks, 1000);
document.addEventListener('DOMContentLoaded', updateClocks);
</script>

<div id="welcome-container" class="welcome-container">
    <div class="welcome-content">
        <h1 class="welcome-title">欢迎来到 lulu chat</h1>
        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="progress-text">页面加载中... <span class="progress-percentage">0</span>%</p>
        </div>
    </div>
</div>

<div id="main-app">
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span id="network-icon">
                    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                        <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                        <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                        <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                        <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                    </svg>
                </span>
                <span id="battery-container">
                    <svg id="battery-icon" width="25" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div id="viewport">
            <section id="page-home" class="page active">
                <div class="profile-card">
                    <div class="profile-banner" id="profile-banner" onclick="location.href='profile.html'">
                        </div>
                    <div class="profile-content-wrapper">
                        <div class="profile-info">
                            <div class="profile-avatar-wrapper" onclick="location.href='profile.html'">
                                <img src="默认头像.jpg" id="user-avatar">
                            </div>
                            <h2 id="user-name">未登录用户</h2>
                            <p id="user-signature">请输入个性签名</p>
                            <span id="user-location">📍 请输入地区</span>
                        </div>
                        <div class="profile-clock-box">
                            <div id="big-time">--:--</div>
                            <div id="big-date">加载中...</div>
                        </div>
                    </div>
                </div>

                <div class="app-grid">
                    <div class="app-icon" onclick="switchTab('message')">
                        <div class="icon-box">💬</div>
                        <span>Chat</span>
                    </div>
                    <div class="app-icon gray-scale" onclick="alert('纪念日功能开发中...')">
                        <div class="icon-box">🤍</div>
                        <span>Ourtale</span>
                    </div>
                    <div class="app-icon" onclick="window.location.href='settings.html'">
                        <div class="icon-box">⚙️</div>
                        <span>Settings</span>
                    </div>
                </div>
            </section>

            <section id="page-message" class="page">
                <div class="header-title">微信</div>
                <div class="list-item" onclick="openChat('张三')">
                    <div class="avatar" style="background: #ff9500; width:40px; height:40px; border-radius:5px; margin:10px;"></div>
                    <div style="flex:1; padding-top:10px;">
                        <b>张三</b>
                        <p style="color:#888; font-size:13px;">今晚出来吃火锅吗？</p>
                    </div>
                </div>
            </section>
        </div>

        <nav id="nav-bar" style="display: none;">
            <div class="nav-item" onclick="switchTab('message')">💬<br>消息</div>
            <div class="nav-item" onclick="goHome()">🏠<br>桌面</div>
        </nav>
    </div>
</div>

<script src="script.js"></script>

<script>
// ✅ 应用已保存的字体
function applyFont(fontKey) {
    // 移除所有字体类
    const fontClasses = [
        'font-default', 'font-noto-sans', 'font-noto-serif', 
        'font-kuaile', 'font-nailao', 'font-mashan', 
        'font-longcang', 'font-zhimang', 'font-liujian',
        'font-dancing', 'font-pacifico', 'font-caveat',
        'font-playfair', 'font-montserrat', 'font-raleway',
        'font-roboto-mono', 'font-monospace'
    ];
    
    document.body.classList.remove(...fontClasses);
    
    // 添加新字体类
    if (fontKey && fontKey !== 'default') {
        document.body.classList.add('font-' + fontKey);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    // ✅ 先应用字体
    const savedFont = localStorage.getItem('user-font');
    console.log('读取到的字体设置:', savedFont);
    if (savedFont) {
        applyFont(savedFont);
        console.log('已应用字体:', savedFont);
    }
    
    refreshUserUI(); 

    const urlParams = new URLSearchParams(window.location.search);
    const isFromSettings = urlParams.get('from') === 'settings';

    if (isFromSettings) {
        document.getElementById('welcome-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
    } else {
        startLoading(); 
    }
});

function startLoading() {
    const fill = document.querySelector('.progress-fill');
    const percentText = document.querySelector('.progress-percentage');
    const welcome = document.getElementById('welcome-container');
    const mainApp = document.getElementById('main-app');
    let progress = 0;

    const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 15) + 5;
        if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            setTimeout(() => {
                welcome.style.display = 'none';
                mainApp.style.display = 'flex';
            }, 500);
        }
        if(fill) fill.style.width = progress + '%';
        if(percentText) percentText.innerText = progress;
    }, 150);
}

// 核心函数：刷新主页显示
function refreshUserUI() {
    const currentUser = localStorage.getItem('currentUser') || "未登录用户";
    const avatar = localStorage.getItem('savedAvatar');
    const bio = localStorage.getItem('userBio') || '请输入个性签名';
    const location = localStorage.getItem('userLocation') || '请输入地区';
    const wallpaper = localStorage.getItem('userWallpaper'); 
    const headerBg = localStorage.getItem('headerBackgroundImage') || localStorage.getItem('headerBackground'); 

    if (document.getElementById('user-name')) document.getElementById('user-name').innerText = currentUser;
    if (document.getElementById('user-avatar') && avatar) document.getElementById('user-avatar').src = avatar;
    if (document.getElementById('user-signature')) document.getElementById('user-signature').innerText = bio;
    if (document.getElementById('user-location')) document.getElementById('user-location').innerText = '📍 ' + location;

    // 桌面壁纸
    const homePage = document.getElementById('page-home');
    if (homePage && wallpaper) {
        homePage.style.backgroundImage = `url(${wallpaper})`;
        homePage.style.backgroundSize = 'cover';
        homePage.style.backgroundPosition = 'center';
    }
    
    // 个人主页背景图应用
    const profileBanner = document.getElementById('profile-banner');
    if (profileBanner && headerBg) {
        profileBanner.style.backgroundImage = `url(${headerBg})`;
        profileBanner.style.backgroundSize = 'cover';
        profileBanner.style.backgroundPosition = 'center';
    }
}
</script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lulu chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="user-header">
    <div id="guest-tools">
        <button onclick="window.location.href='login.html'">登录 / 注册</button>
    </div>
    <div id="user-tools" style="display: none;">
        <span>欢迎回来，<b id="username-display"></b></span>
        <button onclick="logout()">退出登录</button>
    </div>
</div>
    
<div id="welcome-container" class="welcome-container">
    <div class="welcome-content">
        <h1 class="welcome-title">欢迎来到 lulu chat</h1>
        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="progress-text">页面加载中... <span class="progress-percentage">0</span>%</p>
        </div>
    </div>
</div>

<div id="main-app" style="display: none;">
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span id="network-icon">
                    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                        <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                        <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                        <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                        <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                    </svg>
                </span>
                <span id="battery-container">
                    <svg id="battery-icon" width="25" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div id="viewport">
            <section id="page-home" class="page active">
                <div class="profile-card">
                    <div class="profile-banner" id="profile-banner" onclick="document.getElementById('banner-upload').click()">
                        <div class="upload-hint-banner">更换背景图片</div>
                    </div>
                    <div class="profile-content-wrapper">
                        <div class="profile-info">
                            <div class="profile-avatar-wrapper" onclick="document.getElementById('avatar-upload').click()">
                                <img src="默认头像.jpg" id="user-avatar">
                                <div class="upload-hint">更换图片</div>
                            </div>
                            <h2 contenteditable="true" id="user-name">请输入名字</h2>
                            <p contenteditable="true" id="user-signature">请输入个性签名</p>
                            <span contenteditable="true" id="user-location">📍 请输入地区</span>
                        </div>
                        <div class="profile-clock-box">
                            <div id="big-time">--:--</div>
                            <div id="big-date">加载中...</div>
                        </div>
                    </div>
                </div>

                <div class="app-grid">
                    <div class="app-icon" onclick="switchTab('message')">
                        <div class="icon-box">💬</div>
                        <span>Chat</span>
                    </div>
                    <div class="app-icon gray-scale" onclick="alert('纪念日功能开发中...')">
                        <div class="icon-box">🤍</div>
                        <span>Ourtale</span>
                    </div>
                    <div class="app-icon" onclick="window.location.href='settings.html'">
                        <div class="icon-box">⚙️</div>
                        <span>Settings</span>
                    </div>
                </div>
            </section>

            <section id="page-message" class="page">
                <div class="header-title">微信</div>
                <div class="list-item" onclick="openChat('张三')">
                    <div class="avatar" style="background: #ff9500; width:40px; height:40px; border-radius:5px; margin:10px;"></div>
                    <div style="flex:1; padding-top:10px;">
                        <b>张三</b>
                        <p style="color:#888; font-size:13px;">今晚出来吃火锅吗？</p>
                    </div>
                </div>
            </section>

            </div>

        <nav id="nav-bar" style="display: none;">
            <div class="nav-item" onclick="switchTab('message')">💬<br>消息</div>
            <div class="nav-item" onclick="goHome()">🏠<br>桌面</div>
        </nav>

        <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
        <input type="file" id="banner-upload" accept="image/*" style="display: none;">
    </div>
</div>

<script src="script.js"></script>

<script>
    // 登录状态检查 - 页面加载时执行
    (function() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const currentUser = localStorage.getItem('currentUser');
        
        if (!isLoggedIn || !currentUser) {
            // 未登录，跳转到登录页
            window.location.href = 'login.html';
            return;
        }
        
        // 已登录，显示用户名
        const userNameElement = document.getElementById('user-name');
        if (userNameElement && currentUser) {
            userNameElement.innerText = currentUser;
        }
    })();
</script>

  <script>
document.addEventListener('DOMContentLoaded', function() {
    // 1. 从本地存储获取状态
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    const currentUser = localStorage.getItem('currentUser');

    // 2. 获取页面上所有的相关元素
    const guestTools = document.getElementById('guest-tools');
    const userTools = document.getElementById('user-tools');
    const usernameDisplay = document.getElementById('username-display'); // 顶部欢迎语
    const userNameCard = document.getElementById('user-name'); // 个人卡片中心的名字

    // 3. 执行显示逻辑
    if (isLoggedIn === 'true' && currentUser) {
        // 已登录状态
        if (guestTools) guestTools.style.display = 'none';
        if (userTools) userTools.style.display = 'block';
        
        // 将用户名同步到页面所有显示位置
        if (usernameDisplay) usernameDisplay.innerText = currentUser;
        if (userNameCard) userNameCard.innerText = currentUser;
    } else {
        // 未登录状态
        if (guestTools) guestTools.style.display = 'block';
        if (userTools) userTools.style.display = 'none';
        if (userNameCard) userNameCard.innerText = "未登录";
        
        // 如果你希望未登录强制跳回登录页，请取消下面这行的注释：
        // window.location.href = 'login.html';
    }
});

// 退出登录函数
function logout() {
    if(confirm("确定要退出登录吗？")) {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('currentUser');
        window.location.reload(); // 刷新页面以恢复初始状态
    }
}
</script>

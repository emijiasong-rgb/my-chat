<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微信</title>
    <style>
        :root {
            --bg: #ededed;
            --white: #fff;
            --text: #191919;
            --text-tertiary: #b0b0b0;
            --red-dot: #f44;
            --separator: #e5e5e5;
            --active: #000;
            --inactive: #b0b0b0;
            --pinned-bg: #f7f7f7;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }

        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:#000;
            background:var(--white);
        }
        .status-icons { display:flex; align-items:center; gap:5px; }

        .top-nav {
            display:flex; align-items:center; justify-content:center;
            padding:10px 16px; background:var(--white); position:relative;
            border-bottom:0.5px solid var(--separator);
        }
        .top-nav .back-arrow {
            position:absolute; left:16px; font-size:18px; color:#000;
            cursor:pointer; text-decoration:none; padding:4px;
        }
        .nav-title { font-size:17px; font-weight:700; color:#000; }
        .add-circle {
            position:absolute; right:16px; width:28px; height:28px;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
            font-size:22px; color:#000;
        }

        .popup-menu {
            display:none; position:absolute; top:90px; right:10px;
            background:var(--white); border-radius:8px;
            box-shadow:0 4px 20px rgba(0,0,0,0.15); z-index:200;
            min-width:140px; overflow:hidden;
        }
        .popup-menu.show { display:block; }
        .popup-menu .menu-item {
            display:flex; align-items:center; gap:10px; padding:13px 16px;
            font-size:15px; color:var(--text); cursor:pointer;
            border-bottom:0.5px solid var(--separator); text-decoration:none;
        }
        .popup-menu .menu-item:last-child { border-bottom:none; }
        .overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:150;
        }
        .overlay.show { display:block; }

        /* ========== 状态栏 - 方框容器 ========== */
        .status-box {
            background:#fff; margin:10px 14px; padding:12px 0;
            border:1px solid #e8e8e8; border-radius:12px;
            overflow:hidden;
        }
        .status-box-inner {
            display:flex; gap:16px; padding:0 14px;
            overflow-x:auto; white-space:nowrap;
            -webkit-overflow-scrolling:touch;
        }
        .status-box-inner::-webkit-scrollbar { display:none; }
        .status-box-item {
            display:flex; flex-direction:column; align-items:center;
            min-width:56px; cursor:pointer; flex-shrink:0;
        }
        .status-box-avatar {
            width:52px; height:52px; border-radius:50%;
            border:2px solid #e0e0e0; object-fit:cover;
            background:#f0f0f0;
        }
        .status-box-dot {
            width:10px; height:10px; border-radius:50%;
            margin-top:-8px; margin-left:30px; z-index:2;
            border:2px solid #fff;
        }
        .status-box-dot.online { background:#44B700; }
        .status-box-dot.offline { background:#ccc; }
        .status-box-name {
            font-size:11px; color:#555; margin-top:3px;
            max-width:56px; overflow:hidden; text-overflow:ellipsis;
            text-align:center;
        }
        /* 小气泡 */
        .status-box-bubble {
            background:#fff; border:1px solid #e8e8e8;
            border-radius:14px; padding:3px 8px;
            font-size:10px; color:#666; white-space:nowrap;
            position:absolute; top:-18px; left:50%;
            transform:translateX(-50%);
            box-shadow:0 1px 4px rgba(0,0,0,0.06);
            pointer-events:none;
        }

        /* ========== 联系人列表 ========== */
        .contact-list { flex:1; overflow-y:auto; background:var(--white); }
        .contact-list::-webkit-scrollbar { display:none; }
        .section-title {
            padding:8px 16px 4px; font-size:12px; color:var(--text-tertiary);
            font-weight:500; background:var(--white);
        }
        .contact-card {
            display:flex; align-items:center; gap:12px; padding:12px 16px;
            cursor:pointer; border-bottom:0.5px solid var(--separator);
            position:relative;
        }
        .contact-card:active { background:#f9f9f9; }
        .contact-card.pinned { background:var(--pinned-bg); }
        .contact-avatar {
            width:48px; height:48px; border-radius:6px; object-fit:cover;
            background:#d0d0d0; flex-shrink:0;
        }
        .unread-badge {
            position:absolute; left:48px; top:8px;
            min-width:18px; height:18px; background:var(--red-dot);
            border-radius:9px; border:2px solid #fff; display:none;
            color:#fff; font-size:10px; font-weight:700;
            align-items:center; justify-content:center;
            z-index:5; padding:0 5px;
        }
        .unread-badge.show { display:flex; }
        .contact-info { flex:1; min-width:0; }
        .contact-top { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
        .contact-name { font-size:16px; font-weight:500; color:var(--text); }
        .contact-time { font-size:12px; color:var(--text-tertiary); margin-left:auto; flex-shrink:0; }
        .contact-preview {
            font-size:13px; color:var(--text-tertiary);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .empty-state { text-align:center; padding:100px 20px; color:#b0b0b0; }
        .empty-icon { font-size:40px; margin-bottom:12px; opacity:0.4; }
        .empty-text { font-size:15px; }

        .bottom-nav {
            display:flex; justify-content:space-around;
            background:var(--white); border-top:0.5px solid var(--separator);
            padding:8px 0 16px;
        }
        .bottom-tab {
            display:flex; flex-direction:column; align-items:center; gap:4px;
            cursor:pointer; flex:1; font-size:10px; color:var(--inactive);
        }
        .bottom-tab.active { color:var(--active); }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span id="battery-percent">--%</span>
            </div>
        </div>

        <div class="top-nav">
            <a href="index.html" class="back-arrow">←</a>
            <span class="nav-title">信息</span>
            <div class="add-circle" onclick="toggleMenu()">+</div>
        </div>

        <div class="overlay" id="overlay" onclick="closeMenu()"></div>
        <div class="popup-menu" id="popup-menu">
            <a href="create-role2.html" class="menu-item">👤 添加好友</a>
            <div class="menu-item" onclick="closeMenu();alert('群聊功能即将上线')">👥 发起群聊</div>
        </div>

        <!-- 状态栏方框 -->
        <div class="status-box" id="status-box" style="display:none;">
            <div class="status-box-inner" id="status-box-inner"></div>
        </div>

        <!-- 联系人列表 -->
        <div class="contact-list" id="contact-list">
            <div class="empty-state">
                <div class="empty-icon">💬</div>
                <div class="empty-text">暂无消息</div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="bottom-tab active">💬 信息</div>
            <div class="bottom-tab" onclick="alert('即将上线')">🔘 朋友圈</div>
            <div class="bottom-tab" onclick="window.location.href='settings.html'">⚙️ 设置</div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('popup-menu').classList.toggle('show'); document.getElementById('overlay').classList.toggle('show'); }
        function closeMenu() { document.getElementById('popup-menu').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000); updateClock();

        // ==================== 状态栏渲染 ====================
        function renderStatusBox() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var box = document.getElementById('status-box');
            var inner = document.getElementById('status-box-inner');
            if (roles.length === 0) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            
            var html = '';
            for (var i = 0; i < roles.length; i++) {
                var r = roles[i];
                var fav = r.favorability || 0;
                var bubble = '';
                if (fav > 80) bubble = '好想你❤️';
                else if (fav > 50) bubble = '在想你';
                else if (fav < 0) bubble = '...';
                
                var online = !r.hasBlockedUser && !r.isBlockedByUser;
                var dotClass = online ? 'online' : 'offline';
                var bubbleHtml = bubble ? '<div class="status-box-bubble">' + bubble + '</div>' : '';
                
                html += '<div class="status-box-item" onclick="window.location.href=\'chat-detail.html?id=' + r.id + '\'" style="position:relative;">' +
                    bubbleHtml +
                    '<img class="status-box-avatar" src="' + (r.avatar || '') + '" onerror="this.style.background=\'#e0e0e0\'">' +
                    '<div class="status-box-dot ' + dotClass + '"></div>' +
                    '<div class="status-box-name">' + escapeHtml(r.remark || r.name) + '</div></div>';
            }
            inner.innerHTML = html;
        }

        // ==================== 联系人列表渲染 ====================
        function renderContactList() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            roles.sort(function(a, b) {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return 0;
            });
            var container = document.getElementById('contact-list');
            if (roles.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">暂无消息</div></div>';
                return;
            }
            var html = '<div class="section-title">联系人</div>';
            for (var i = 0; i < roles.length; i++) {
                var r = roles[i];
                var lastMsg = r.messages && r.messages.length > 0 ? r.messages[r.messages.length-1] : null;
                var preview = lastMsg ? lastMsg.text : '';
                var hasUnread = r.unread && r.unread > 0;
                var time = lastMsg ? formatTime(lastMsg.time) : '';
                html += '<div class="contact-card' + (r.pinned ? ' pinned' : '') + '" onclick="window.location.href=\'chat-detail.html?id=' + r.id + '\'">' +
                    '<img class="contact-avatar" src="' + (r.avatar || '') + '">' +
                    '<div class="unread-badge' + (hasUnread ? ' show' : '') + '">' + (r.unread > 1 ? r.unread : '') + '</div>' +
                    '<div class="contact-info"><div class="contact-top"><span class="contact-name">' + escapeHtml(r.remark || r.name) + '</span>' +
                    '<span class="contact-time">' + time + '</span></div>' +
                    '<div class="contact-preview">' + escapeHtml(preview) + '</div></div></div>';
            }
            container.innerHTML = html;
        }

        function formatTime(ts) {
            var d = new Date(ts), now = new Date();
            var h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0');
            if (d.toDateString() === now.toDateString()) return h + ':' + m;
            var y = new Date(now); y.setDate(now.getDate()-1);
            if (d.toDateString() === y.toDateString()) return '昨天';
            return String(d.getMonth()+1) + '/' + String(d.getDate());
        }

        function escapeHtml(text) { var d = document.createElement('div'); d.innerText = text || ''; return d.innerHTML; }

        document.addEventListener('DOMContentLoaded', function() {
            renderStatusBox();
            renderContactList();
            setInterval(function() { renderStatusBox(); renderContactList(); }, 60000);
        });
    </script>
</body>
</html>

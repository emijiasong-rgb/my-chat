<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.7);
            --blur: blur(24px);
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --accent: #5b6abf;
            --accent-light: #8b95d6;
            --accent-soft: rgba(91, 106, 191, 0.08);
            --text: #1c1c1e;
            --text-secondary: #636366;
            --text-tertiary: #8e8e93;
            --bubble-user: linear-gradient(135deg, #5b6abf 0%, #8b95d6 100%);
            --bubble-ai: rgba(255, 255, 255, 0.55);
            --separator: rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #phone-shell {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            background: #f2f2f7;
            border-radius: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
        }

        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            background: #f2f2f7;
            position: relative;
        }

        .bg-ambient {
            position: absolute;
            top: -60px; left: -40px; right: -40px; height: 280px;
            background: radial-gradient(ellipse at 30% 20%, rgba(139, 149, 214, 0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 40%, rgba(180, 180, 200, 0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        #role-list-page {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; height: 100%;
        }

        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: transparent; z-index: 10;
        }

        .chat-header h1 {
            font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.5px;
        }

        .add-btn {
            width: 40px; height: 40px;
            background: var(--card-bg);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            color: var(--accent);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
        }

        .add-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.85); }

        .role-list {
            flex: 1; overflow-y: auto; padding: 10px 16px 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .role-list::-webkit-scrollbar { display: none; }

        .role-card {
            background: var(--card-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--card-border); border-radius: 18px;
            padding: 14px 16px; display: flex; align-items: center; gap: 14px;
            cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow-sm);
        }

        .role-card:active { transform: scale(0.985); background: rgba(255, 255, 255, 0.8); }

        .role-card-avatar {
            width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8); background: #e8e8ed; flex-shrink: 0;
        }

        .role-card-info { flex: 1; min-width: 0; }
        .role-card-name { font-weight: 600; font-size: 16px; color: var(--text); margin-bottom: 2px; }
        .role-card-desc { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .role-card-relation { font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 10px; display: inline-block; margin-top: 4px; }

        .empty-role { text-align: center; padding: 100px 20px; color: var(--text-tertiary); }
        .empty-role-icon { font-size: 56px; margin-bottom: 12px; opacity: 0.6; }

        #chat-page { display: none; flex-direction: column; height: 100%; position: relative; z-index: 1; }
        #chat-page.active { display: flex; }

        .chat-nav {
            display: flex; align-items: center; padding: 10px 16px;
            background: var(--card-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--separator); gap: 10px; z-index: 10;
        }

        .back-btn { color: var(--accent); font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
        .chat-nav-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); }
        .chat-nav-name { font-weight: 600; font-size: 16px; color: var(--text); }

        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .messages-container::-webkit-scrollbar { display: none; }

        .msg-wrapper { display: flex; gap: 8px; max-width: 82%; animation: msgIn 0.25s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-wrapper.ai { align-self: flex-start; }
        .msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.7); margin-top: 2px; }
        .msg-bubble { padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-break: break-word; }
        .msg-wrapper.ai .msg-bubble { background: var(--bubble-ai); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); border-top-left-radius: 6px; color: var(--text); }
        .msg-wrapper.user .msg-bubble { background: var(--bubble-user); color: white; border-top-right-radius: 6px; }

        .input-area { display: flex; gap: 8px; padding: 10px 14px 14px; align-items: center; z-index: 10; }
        .input-area input { flex: 1; padding: 11px 16px; background: var(--card-bg); backdrop-filter: var(--blur); border: 1px solid var(--card-border); border-radius: 22px; font-size: 15px; outline: none; color: var(--text); }
        .input-area input::placeholder { color: var(--text-tertiary); }
        .send-btn { width: 40px; height: 40px; background: var(--accent); color: white; border: none; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
        .send-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="main-view">
            <div class="bg-ambient"></div>

            <div id="role-list-page">
                <div class="chat-header">
                    <h1>对话</h1>
                    <a href="create-role.html" class="add-btn">+</a>
                </div>
                <div class="role-list" id="role-list">
                    <div class="empty-role">
                        <div class="empty-role-icon">💬</div>
                        <p>还没有对话角色</p>
                        <p style="font-size:13px;margin-top:4px;color:#c7c7cc;">点击右上角 + 创建</p>
                    </div>
                </div>
            </div>

            <div id="chat-page">
                <div class="chat-nav">
                    <span class="back-btn" onclick="goBackToList()">〈 返回</span>
                    <img class="chat-nav-avatar" id="chat-nav-avatar" src="" alt="">
                    <span class="chat-nav-name" id="chat-nav-name"></span>
                </div>
                <div class="messages-container" id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="chat-input" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMsg()">
                    <button class="send-btn" onclick="sendMsg()">↑</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var currentChatRole = null;

        document.addEventListener('DOMContentLoaded', function() {
            renderRoleList();
        });

        function renderRoleList() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var container = document.getElementById('role-list');
            
            if (roles.length === 0) {
                container.innerHTML = '<div class="empty-role"><div class="empty-role-icon">💬</div><p>还没有对话角色</p><p style="font-size:13px;margin-top:4px;color:#c7c7cc;">点击右上角 + 创建</p></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < roles.length; i++) {
                var role = roles[i];
                var avatar = role.avatar || '';
                html += '<div class="role-card" onclick="openChat(' + role.id + ')">' +
                    '<img class="role-card-avatar" src="' + (avatar || '') + '" alt="">' +
                    '<div class="role-card-info">' +
                    '<div class="role-card-name">' + escapeHtml(role.name) + '</div>' +
                    '<div class="role-card-desc">' + escapeHtml(role.personality || '暂无描述') + '</div>' +
                    '<span class="role-card-relation">' + escapeHtml(role.relation) + '</span>' +
                    '</div></div>';
            }
            container.innerHTML = html;
        }

        function openChat(roleId) {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === roleId) {
                    currentChatRole = roles[i];
                    break;
                }
            }
            if (!currentChatRole) return;

            document.getElementById('role-list-page').style.display = 'none';
            document.getElementById('chat-page').classList.add('active');
            document.getElementById('chat-nav-avatar').src = currentChatRole.avatar || '';
            document.getElementById('chat-nav-name').innerText = currentChatRole.name;
            renderMessages();
        }

        function goBackToList() {
            document.getElementById('role-list-page').style.display = 'flex';
            document.getElementById('chat-page').classList.remove('active');
            currentChatRole = null;
            renderRoleList();
        }

        function renderMessages() {
            var container = document.getElementById('messages-container');
            if (!currentChatRole || !currentChatRole.messages) {
                container.innerHTML = '';
                return;
            }
            var html = '';
            for (var i = 0; i < currentChatRole.messages.length; i++) {
                var msg = currentChatRole.messages[i];
                var avatar = msg.type === 'ai' ? (currentChatRole.avatar || '') : '';
                html += '<div class="msg-wrapper ' + msg.type + '">' +
                    '<img class="msg-avatar" src="' + avatar + '" alt="">' +
                    '<div class="msg-bubble">' + escapeHtml(msg.text) + '</div></div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendMsg() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text || !currentChatRole) return;

            currentChatRole.messages.push({ type: 'user', text: text });
            input.value = '';
            updateRoleMessages();
            renderMessages();

            setTimeout(function() {
                var reply = generateReply(text);
                currentChatRole.messages.push({ type: 'ai', text: reply });
                updateRoleMessages();
                renderMessages();
            }, 600 + Math.random() * 1200);
        }

        function generateReply(userMsg) {
            if (!currentChatRole) return "嗯嗯";
            var catchphrase = currentChatRole.catchphrase;
            var nickname = currentChatRole.userNickname || currentChatRole.userName || '你';
            var replies = [
                '嗯嗯，' + nickname + '说得对呢~',
                '哈哈，' + nickname + '真有趣！',
                '让我想想...🤔',
                catchphrase || '有道理！',
                nickname + '，我也这么觉得！',
                '真的吗？说来听听~'
            ];
            return replies[Math.floor(Math.random() * replies.length)];
        }

        function updateRoleMessages() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === currentChatRole.id) {
                    roles[i] = currentChatRole;
                    break;
                }
            }
            localStorage.setItem('chat_roles', JSON.stringify(roles));
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>

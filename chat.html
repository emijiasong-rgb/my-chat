<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微信</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ededed;
            --card-bg: #fff;
            --text: #191919;
            --text-secondary: #888;
            --text-tertiary: #b0b0b0;
            --red-dot: #f44;
            --separator: #e5e5e5;
            --bubble-user: #95ec69;
            --bubble-ai: #fff;
            --nav-bg: #ededed;
            --green: #07c160;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,'Inter','Noto Sans SC',sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }

        /* 状态栏 */
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:#000;
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        #battery-container { display:flex; align-items:center; gap:2px; }
        #battery-percent { font-size:12px; }

        /* 导航栏 - 微信风格 */
        .nav-bar {
            display:flex; align-items:center; justify-content:center;
            padding:10px 16px; background:var(--nav-bg); position:relative;
        }
        .nav-title {
            font-size:17px; font-weight:700; color:#000;
            position:absolute; left:50%; transform:translateX(-50%);
        }
        .nav-right {
            margin-left:auto; display:flex; align-items:center; gap:16px;
        }
        .nav-icon {
            width:28px; height:28px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; opacity:0.8;
        }
        .nav-icon svg { width:22px; height:22px; }

        #main-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }

        /* 列表 */
        .role-list { flex:1; overflow-y:auto; background:#fff; }
        .role-list::-webkit-scrollbar { display:none; }

        .chat-row {
            display:flex; align-items:center; gap:12px; padding:12px 16px;
            cursor:pointer; border-bottom:0.5px solid var(--separator);
            transition:background 0.15s;
        }
        .chat-row:active { background:#ececec; }
        .chat-avatar-wrap { position:relative; flex-shrink:0; }
        .chat-avatar {
            width:48px; height:48px; border-radius:6px; object-fit:cover;
            background:#d0d0d0;
        }
        .unread-dot {
            position:absolute; top:-4px; right:-4px;
            width:10px; height:10px; background:var(--red-dot);
            border-radius:50%; border:2px solid #fff; display:none;
        }
        .unread-dot.show { display:block; }

        .chat-info { flex:1; min-width:0; }
        .chat-top { display:flex; align-items:baseline; gap:6px; margin-bottom:3px; }
        .chat-name { font-size:16px; font-weight:500; color:var(--text); }
        .chat-time { font-size:12px; color:var(--text-tertiary); margin-left:auto; flex-shrink:0; }
        .chat-preview {
            font-size:13px; color:var(--text-tertiary);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .chat-preview.unread { color:var(--text); }

        .empty-state { text-align:center; padding:120px 20px; color:#b0b0b0; }
        .empty-icon { font-size:40px; margin-bottom:12px; opacity:0.4; }
        .empty-text { font-size:15px; }
        .empty-sub { font-size:12px; margin-top:4px; opacity:0.7; }

        /* ===== 聊天页 ===== */
        #chat-page { display:none; flex-direction:column; height:100%; background:var(--bg); }
        #chat-page.active { display:flex; }

        .chat-nav {
            display:flex; align-items:center; padding:8px 12px;
            background:var(--nav-bg); border-bottom:0.5px solid #d9d9d9;
            gap:8px;
        }
        .back-btn { font-size:16px; color:#000; cursor:pointer; text-decoration:none; padding:6px 2px; }
        .chat-nav-name { font-size:17px; font-weight:600; color:#000; flex:1; text-align:center; margin-right:24px; }
        .chat-nav-name.typing { color:#888; }
        .more-btn {
            width:28px; height:28px; border:none; background:none;
            font-size:18px; cursor:pointer; opacity:0.6; padding:0;
            letter-spacing:1px;
        }

        .messages-container {
            flex:1; overflow-y:auto; padding:12px 12px;
            display:flex; flex-direction:column; gap:2px; background:var(--bg);
        }
        .messages-container::-webkit-scrollbar { display:none; }

        .msg-wrapper {
            display:flex; gap:8px; max-width:75%;
            margin-bottom:16px;
        }
        .msg-wrapper.user { align-self:flex-end; flex-direction:row-reverse; }
        .msg-wrapper.ai { align-self:flex-start; }

        .msg-avatar {
            width:36px; height:36px; border-radius:4px; object-fit:cover;
            flex-shrink:0; margin-top:0;
        }

        .msg-bubble {
            padding:9px 12px; border-radius:6px; font-size:15px;
            line-height:1.45; word-break:break-word; position:relative;
        }
        .msg-wrapper.ai .msg-bubble {
            background:var(--bubble-ai); border:0.5px solid #e0e0e0;
            color:#000;
        }
        .msg-wrapper.ai .msg-bubble::before {
            content:""; position:absolute; left:-5px; top:12px;
            width:0; height:0;
            border-top:5px solid transparent;
            border-bottom:5px solid transparent;
            border-right:6px solid #fff;
        }
        .msg-wrapper.user .msg-bubble {
            background:var(--bubble-user); color:#000;
        }
        .msg-wrapper.user .msg-bubble::after {
            content:""; position:absolute; right:-5px; top:12px;
            width:0; height:0;
            border-top:5px solid transparent;
            border-bottom:5px solid transparent;
            border-left:6px solid var(--bubble-user);
        }

        .typing-dots { display:inline-flex; gap:3px; padding:2px 0; }
        .typing-dots span { width:6px; height:6px; background:#b0b0b0; border-radius:50%; animation:bounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.3; } 30% { transform:translateY(-5px); opacity:1; } }

        /* 输入区 */
        .input-area {
            display:flex; gap:8px; padding:8px 10px 12px; align-items:center;
            background:var(--bg); border-top:0.5px solid #d9d9d9;
        }
        .input-area input {
            flex:1; padding:10px 12px;
            background:#fff; border:0.5px solid #ddd; border-radius:6px;
            font-size:15px; outline:none; color:#000;
        }
        .input-area input:focus { border-color:#07c160; }
        .input-area input::placeholder { color:#b0b0b0; }
        .send-btn {
            padding:8px 16px; background:var(--green); color:#fff;
            border:none; border-radius:6px; font-size:14px; cursor:pointer;
            font-weight:500;
        }
        .send-btn:active { background:#06b056; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="15" height="10" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="20" height="10" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <!-- 微信风格导航栏 -->
        <div class="nav-bar">
            <span class="nav-title">微信</span>
            <div class="nav-right">
                <a href="create-role2.html" class="nav-icon" style="text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </a>
            </div>
        </div>

        <div id="main-view">
            <div id="role-list-page">
                <div class="role-list" id="role-list">
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div class="empty-text">暂无消息</div>
                        <div class="empty-sub">点击右上角 + 创建角色</div>
                    </div>
                </div>
            </div>

            <div id="chat-page">
                <div class="chat-nav">
                    <a href="#" class="back-btn" onclick="goBackToList();return false;">〈</a>
                    <span class="chat-nav-name" id="chat-nav-name"></span>
                    <button class="more-btn" onclick="editCurrentRole()">⋯</button>
                </div>
                <div class="messages-container" id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="chat-input" placeholder="" onkeydown="if(event.key==='Enter')sendMsg()">
                    <button class="send-btn" onclick="sendMsg()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var currentChatRole = null;
        var currentApi = null;

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000);

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    var pel = document.getElementById('battery-percent');
                    var lel = document.getElementById('battery-level');
                    if (pel) pel.textContent = lvl + '%';
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() { updateClock(); updateBattery(); renderRoleList(); });

        function getActiveApi() { var apis = JSON.parse(localStorage.getItem('saved_apis') || '[]'); return apis.length > 0 ? apis[apis.length - 1] : null; }

        function renderRoleList() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var container = document.getElementById('role-list');
            if (roles.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">暂无消息</div><div class="empty-sub">点击右上角 + 创建角色</div></div>';
                return;
            }
            var html = '';
            for (var i = 0; i < roles.length; i++) {
                var r = roles[i];
                var lastMsg = r.messages && r.messages.length > 0 ? r.messages[r.messages.length-1] : null;
                var preview = lastMsg ? lastMsg.text : (r.personality || '');
                var hasUnread = r.unread && r.unread > 0;
                var time = lastMsg ? formatTime(lastMsg.time || r.id) : '';
                html += '<div class="chat-row" onclick="openChat(' + r.id + ')">' +
                    '<div class="chat-avatar-wrap"><img class="chat-avatar" src="' + (r.avatar || '') + '" alt=""><div class="unread-dot' + (hasUnread ? ' show' : '') + '"></div></div>' +
                    '<div class="chat-info"><div class="chat-top"><span class="chat-name">' + escapeHtml(r.remark || r.name) + '</span><span class="chat-time">' + time + '</span></div>' +
                    '<div class="chat-preview' + (hasUnread ? ' unread' : '') + '">' + escapeHtml(preview) + '</div></div></div>';
            }
            container.innerHTML = html;
        }

        function formatTime(ts) {
            var d = new Date(ts), now = new Date();
            var h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0');
            if (d.toDateString() === now.toDateString()) return h + ':' + m;
            var y = new Date(now); y.setDate(now.getDate()-1);
            if (d.toDateString() === y.toDateString()) return '昨天';
            return String(d.getMonth()+1) + '/' + String(d.getDate());
        }

        function openChat(roleId) {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === roleId) { currentChatRole = roles[i]; break; } }
            if (!currentChatRole) return;
            currentChatRole.unread = 0; updateRoleMessages();
            currentApi = getActiveApi();
            document.getElementById('role-list-page').style.display = 'none';
            document.getElementById('chat-page').classList.add('active');
            document.getElementById('chat-nav-name').innerText = currentChatRole.remark || currentChatRole.name;
            renderMessages();
        }

        function editCurrentRole() { if (currentChatRole) window.location.href = 'contact-detail.html?id=' + currentChatRole.id; }
        function goBackToList() {
            document.getElementById('role-list-page').style.display = 'block';
            document.getElementById('chat-page').classList.remove('active');
            currentChatRole = null; currentApi = null; renderRoleList();
        }

        function renderMessages() {
            var container = document.getElementById('messages-container');
            if (!currentChatRole || !currentChatRole.messages) { container.innerHTML = ''; return; }
            var html = '';
            for (var i = 0; i < currentChatRole.messages.length; i++) {
                var msg = currentChatRole.messages[i];
                var avatar = msg.type === 'ai' ? (currentChatRole.avatar || '') : '';
                var isTyping = msg.text.indexOf('typing-dots') !== -1;
                var content = isTyping ? msg.text : escapeHtml(msg.text);
                html += '<div class="msg-wrapper ' + msg.type + '">' + (msg.type === 'ai' ? '<img class="msg-avatar" src="' + avatar + '" alt="">' : '') + '<div class="msg-bubble">' + content + '</div>' + (msg.type === 'user' ? '<img class="msg-avatar" src="默认头像.jpg" alt="">' : '') + '</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendMsg() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text || !currentChatRole) return;
            currentChatRole.messages.push({ type: 'user', text: text, time: Date.now() });
            input.value = ''; updateRoleMessages(); renderMessages();
            callApiForReply(text);
        }

        function callApiForReply(userMsg) {
            if (!currentApi) {
                showTyping();
                currentChatRole.messages.push({ type: 'ai', text: '<span class="typing-dots"><span></span><span></span><span></span></span>', time: Date.now() });
                updateRoleMessages(); renderMessages();
                setTimeout(function() {
                    currentChatRole.messages.pop();
                    var reply = generateLocalReply();
                    currentChatRole.messages.push({ type: 'ai', text: reply, time: Date.now() });
                    currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                    updateRoleMessages(); renderMessages(); hideTyping();
                }, 1500);
                return;
            }
            showTyping();
            currentChatRole.messages.push({ type: 'ai', text: '<span class="typing-dots"><span></span><span></span><span></span></span>', time: Date.now() });
            updateRoleMessages(); renderMessages();

            var messages = [{ role: 'system', content: buildPrompt() }];
            var start = Math.max(0, currentChatRole.messages.length - 12);
            for (var i = start; i < currentChatRole.messages.length; i++) {
                var m = currentChatRole.messages[i];
                if (m.text.indexOf('typing-dots') === -1) messages.push({ role: m.type === 'user' ? 'user' : 'assistant', content: m.text });
            }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', currentApi.url + '/v1/chat/completions', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('Authorization', 'Bearer ' + currentApi.key);
            xhr.onload = function() {
                currentChatRole.messages.pop();
                var reply = '...';
                if (xhr.status >= 200 && xhr.status < 300) {
                    var data = JSON.parse(xhr.responseText);
                    reply = data.choices && data.choices[0] ? data.choices[0].message.content : '...';
                } else { reply = '错误 ' + xhr.status; }
                currentChatRole.messages.push({ type: 'ai', text: reply, time: Date.now() });
                currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                updateRoleMessages(); renderMessages(); hideTyping();
            };
            xhr.onerror = function() {
                currentChatRole.messages.pop();
                currentChatRole.messages.push({ type: 'ai', text: '网络错误', time: Date.now() });
                currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                updateRoleMessages(); renderMessages(); hideTyping();
            };
            xhr.send(JSON.stringify({ model: currentApi.model, messages: messages, temperature: 0.8, max_tokens: 500 }));
        }

        function showTyping() { var el = document.getElementById('chat-nav-name'); if (el) { el.innerText = '对方正在输入...'; el.classList.add('typing'); } }
        function hideTyping() { var el = document.getElementById('chat-nav-name'); if (el) { el.innerText = currentChatRole.remark || currentChatRole.name; el.classList.remove('typing'); } }

        function buildPrompt() {
            var r = currentChatRole;
            var nick = r.userNickname || r.userName || '你';
            return '扮演角色，严格按设定回复：\n【名字】' + r.name + '\n【性格】' + (r.personality||'') + '\n【背景】' + (r.background||'') + '\n【口头禅】' + (r.catchphrase||'') + '\n【关系】' + r.relation + '\n【称呼】' + nick + '\n' + (r.userPreference ? '【偏好】' + r.userPreference + '\n' : '') + '要求：保持角色、自然、称呼用户"' + nick + '"';
        }

        function generateLocalReply() { var r = currentChatRole; var nick = r.userNickname || r.userName || '你'; var replies = ['嗯嗯', '哈哈', r.catchphrase || '嗯', nick + '～']; return replies[Math.floor(Math.random() * replies.length)]; }

        function updateRoleMessages() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === currentChatRole.id) { roles[i] = currentChatRole; break; } }
            localStorage.setItem('chat_roles', JSON.stringify(roles));
        }

        function escapeHtml(text) { var d = document.createElement('div'); d.innerText = text || ''; return d.innerHTML; }
    </script>
</body>
</html>

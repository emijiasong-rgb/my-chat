<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>锁屏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(255,255,255,0.85);
            --time-color: #fff;
            --time-font: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            --time-weight: 200;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:'Inter','Noto Sans SC',-apple-system,sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:linear-gradient(145deg, #1a1a2e, #16213e);
            display:flex; flex-direction:column; overflow:hidden; position:relative;
            transition:transform 0.4s, opacity 0.4s;
        }

        /* ✅ 顶部状态栏 - 始终黑色，和主页面统一 */
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 28px 6px; font-size:13px; font-weight:600; color:#000;
            z-index:10; background:transparent;
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        #battery-container { display:flex; align-items:center; gap:2px; }
        #battery-percent { font-size:12px; }

        .lock-time {
            font-size:96px;
            font-weight:var(--time-weight);
            text-align:center;
            margin-top:20px;
            color:var(--time-color);
            font-family:var(--time-font);
            letter-spacing:-2px;
            line-height:1;
        }
        .lock-date {
            font-size:22px;
            text-align:center;
            color:var(--time-color);
            margin-top:4px;
            font-family:var(--time-font);
            font-weight:400;
            opacity:0.9;
            letter-spacing:0.5px;
        }

        .lock-messages { flex:1; margin-top:40px; padding:0 16px; overflow-y:auto; }
        .lock-messages::-webkit-scrollbar { display:none; }

        .lock-msg-card {
            background:rgba(255,255,255,0.18); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border-radius:16px; padding:12px 14px; margin-bottom:8px;
            display:flex; align-items:center; gap:12px; cursor:pointer;
            transition:transform 0.15s; text-decoration:none; color:inherit;
            border:0.5px solid rgba(255,255,255,0.15);
        }
        .lock-msg-card:active { transform:scale(0.98); }
        .lock-msg-icon {
            width:40px; height:40px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; font-size:18px;
            position:relative; flex-shrink:0; overflow:hidden;
            background:rgba(255,255,255,0.2);
        }
        .unread-badge {
            position:absolute; top:-4px; right:-4px;
            min-width:18px; height:18px; background:#ff3b30; color:#fff;
            border-radius:9px; font-size:10px; font-weight:700;
            display:flex; align-items:center; justify-content:center;
            padding:0 4px; border:2px solid rgba(0,0,0,0.3);
        }
        .lock-msg-info { flex:1; min-width:0; }
        .lock-msg-name { font-size:14px; font-weight:600; color:#fff; }
        .lock-msg-preview { font-size:12px; color:rgba(255,255,255,0.7); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .lock-msg-time { font-size:11px; color:rgba(255,255,255,0.5); flex-shrink:0; }

        .swipe-hint {
            position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
            color:var(--time-color); font-size:13px; text-align:center;
            animation:floatUp 2s infinite; cursor:pointer; opacity:0.5;
        }
        @keyframes floatUp {
            0%,100% { opacity:0.3; transform:translateX(-50%) translateY(0); }
            50% { opacity:0.6; transform:translateX(-50%) translateY(-8px); }
        }

        .lock-settings-btn {
            position:absolute; bottom:40px; right:20px;
            width:44px; height:44px; border-radius:50%;
            background:rgba(255,255,255,0.15); backdrop-filter:blur(10px);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; font-size:20px; border:0.5px solid rgba(255,255,255,0.2);
            z-index:10; transition:all 0.2s; color:#fff;
        }
        .lock-settings-btn:active { transform:scale(0.9); background:rgba(255,255,255,0.25); }

        /* 底部弹窗 */
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6); z-index:2000;
            justify-content:center; align-items:flex-end;
        }
        .modal-overlay.active { display:flex; }
        .modal-card {
            background:rgba(30,30,50,0.98); backdrop-filter:blur(30px);
            border-radius:24px 24px 0 0; padding:24px 20px 40px;
            width:100%; max-width:430px; color:#fff; max-height:80vh; overflow-y:auto;
            box-shadow:0 -10px 40px rgba(0,0,0,0.3);
            animation:slideUp 0.3s ease;
        }
        .modal-card::-webkit-scrollbar { display:none; }
        @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
        .modal-card h3 { text-align:center; margin-bottom:20px; font-size:18px; font-weight:600; color:#fff; }

        .section-label {
            font-size:12px; color:rgba(255,255,255,0.5); text-transform:uppercase;
            letter-spacing:1.5px; margin:18px 0 8px; font-weight:600;
        }

        .wall-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
        .wall-item {
            height:68px; border-radius:14px; cursor:pointer;
            border:2.5px solid transparent; transition:all 0.2s;
            position:relative; overflow:hidden;
        }
        .wall-item.selected { border-color:#fff; }
        .wall-item.selected::after {
            content:"✓"; position:absolute; top:4px; right:6px;
            color:#fff; font-size:14px; font-weight:700;
            text-shadow:0 1px 2px rgba(0,0,0,0.5);
        }
        .wall-item:active { transform:scale(0.95); }

        .upload-btn {
            width:100%; margin-top:10px; padding:14px; border-radius:14px;
            border:1.5px dashed rgba(255,255,255,0.2); background:rgba(255,255,255,0.05);
            font-size:15px; cursor:pointer; text-align:center; color:rgba(255,255,255,0.7);
            transition:all 0.2s;
        }
        .upload-btn:active { background:rgba(255,255,255,0.1); }

        /* ✅ 颜色选择：网格形式，很多颜色可选 */
        .color-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:8px; }
        .color-dot {
            width:100%; aspect-ratio:1; border-radius:50%; cursor:pointer;
            border:2.5px solid transparent; transition:all 0.2s;
            position:relative;
        }
        .color-dot.selected { border-color:#fff; transform:scale(1.1); }
        .color-dot.selected::after {
            content:"✓"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            color:#000; font-size:14px; font-weight:700;
        }
        .color-dot:active { transform:scale(0.9); }

        /* 字体选项 */
        .font-options { display:flex; gap:8px; flex-wrap:wrap; }
        .font-opt {
            padding:10px 16px; border-radius:12px;
            border:1.5px solid rgba(255,255,255,0.2);
            font-size:14px; cursor:pointer; color:rgba(255,255,255,0.7);
            background:rgba(255,255,255,0.05); transition:all 0.2s;
        }
        .font-opt.selected { border-color:#fff; background:rgba(255,255,255,0.15); color:#fff; }
        .font-opt:active { transform:scale(0.95); }

        .modal-close-btn {
            width:100%; margin-top:24px; padding:14px; border-radius:14px;
            border:none; background:rgba(255,255,255,0.1); font-size:16px; cursor:pointer;
            font-weight:500; color:#fff; transition:all 0.2s;
        }
        .modal-close-btn:active { background:rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="phone-shell">
        <!-- ✅ 顶部状态栏 - 始终黑色 -->
        <div class="status-bar">
            <span id="status-time">12:00</span>
            <div class="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="25" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div class="lock-time" id="lock-time">09:41</div>
        <div class="lock-date" id="lock-date">6月10日 星期二</div>
        <div class="lock-messages" id="lock-messages"></div>
        <div class="swipe-hint" onclick="goToHome()">从下往上滑</div>
        <div class="lock-settings-btn" onclick="openWallpaperModal()">🎨</div>
    </div>

    <div class="modal-overlay" id="wallpaper-modal">
        <div class="modal-card">
            <h3>自定义锁屏</h3>

            <div class="section-label">壁纸</div>
            <div class="wall-grid" id="wall-grid"></div>
            <button class="upload-btn" onclick="document.getElementById('wallpaper-file').click()">📷 从相册上传</button>
            <input type="file" id="wallpaper-file" accept="image/*" style="display:none" onchange="uploadWallpaper(event)">

            <div class="section-label">字体样式</div>
            <div class="font-options" id="font-options">
                <span class="font-opt selected" data-font="'Inter','Noto Sans SC',-apple-system,sans-serif" data-weight="200" onclick="selectFont(this)">超细 · iOS</span>
                <span class="font-opt" data-font="'Inter','Noto Sans SC',-apple-system,sans-serif" data-weight="300" onclick="selectFont(this)">细体 · Light</span>
                <span class="font-opt" data-font="'Inter','Noto Sans SC',-apple-system,sans-serif" data-weight="500" onclick="selectFont(this)">中等 · Medium</span>
                <span class="font-opt" data-font="'Noto Serif SC','Georgia',serif" data-weight="400" onclick="selectFont(this)">衬线 · 优雅</span>
            </div>

            <div class="section-label">字体颜色（点击选择）</div>
            <div class="color-grid" id="color-grid"></div>

            <button class="modal-close-btn" onclick="closeWallpaperModal()">完成</button>
        </div>
    </div>

    <script>
        // ✅ 大量颜色选择（不受滑动限制）
        var colors = [
            '#FFFFFF','#F5F5F5','#E0E0E0','#CCCCCC','#AAAAAA','#888888','#666666',
            '#1A1A1A','#333333','#555555','#000000',
            '#C5A3D4','#D4A5D4','#E8C5E8','#F0D5F0','#B088C0','#9B72B0',
            '#F7A1C4','#FCCCD2','#FFD1DC','#FFB6C1','#E8788A','#D4687A',
            '#A8D8B9','#B5E8C8','#C5F0D5','#8EC9A0','#7AB890','#6AA880',
            '#FFD700','#FFC107','#FFB300','#FFE082','#FFCC80','#E6C200',
            '#FF6B6B','#FF5252','#FF8A80','#E57373','#D32F2F','#C62828',
            '#4ECDC4','#26C6DA','#00BCD4','#80DEEA','#4DD0E1','#00838F',
            '#FF9800','#FF7043','#FFAB40','#FF6E40','#E64A19','#BF360C',
            '#7CB87C','#66BB6A','#81C784','#4CAF50','#388E3C','#2E7D32',
            '#64B5F6','#42A5F5','#2196F3','#1E88E5','#1565C0','#0D47A1',
            '#BA68C8','#AB47BC','#9C27B0','#8E24AA','#7B1FA2','#6A1B9A',
            '#F06292','#EC407A','#E91E63','#D81B60','#C2185B','#AD1457'
        ];

        var wallpapers = [
            { name:'深邃夜空', css:'linear-gradient(145deg, #1a1a2e, #16213e)' },
            { name:'淡紫梦境', css:'linear-gradient(135deg, #2d1b69, #1a1a2e)' },
            { name:'暗夜森林', css:'linear-gradient(135deg, #0f2027, #203a43)' },
            { name:'日落海岸', css:'linear-gradient(135deg, #1a1a2e, #3d2b1f)' },
            { name:'午夜蓝调', css:'linear-gradient(135deg, #0c0c1d, #1a1a3e)' },
            { name:'墨绿深林', css:'linear-gradient(135deg, #0d1b0d, #1a2e1a)' }
        ];

        function updateClock() {
            var now = new Date();
            var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            document.getElementById('status-time').innerText = timeStr;
            document.getElementById('lock-time').innerText = timeStr;
            var weekDays = ['日','一','二','三','四','五','六'];
            document.getElementById('lock-date').innerText = (now.getMonth()+1) + '月' + now.getDate() + '日 星期' + weekDays[now.getDay()];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    document.getElementById('battery-percent').textContent = lvl + '%';
                    var lel = document.getElementById('battery-level');
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }
        updateBattery();

        function loadLockMessages() {
            var container = document.getElementById('lock-messages');
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var notifications = [];
            for (var i = 0; i < roles.length; i++) {
                var r = roles[i];
                if (r.muted || r.blocked || !r.unread || r.unread <= 0) continue;
                var lastMsg = null;
                if (r.messages && r.messages.length > 0) {
                    for (var j = r.messages.length - 1; j >= 0; j--) {
                        if (r.messages[j].type === 'ai') { lastMsg = r.messages[j]; break; }
                    }
                }
                if (!lastMsg) continue;
                notifications.push({ id:r.id, name:r.remark||r.name, avatar:r.avatar||'', preview:lastMsg.text.substring(0,40), time:lastMsg.time||r.id, unread:r.unread });
            }
            notifications.sort(function(a,b){ return b.time - a.time; });
            if (notifications.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);margin-top:40px;">暂无新消息</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < notifications.length; i++) {
                var n = notifications[i];
                html += '<div class="lock-msg-card" onclick="goToChat(' + n.id + ')">' +
                    '<div class="lock-msg-icon"><img src="' + n.avatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.style.display=\'none\'">' +
                    (n.unread>1?'<div class="unread-badge">'+n.unread+'</div>':'') + '</div>' +
                    '<div class="lock-msg-info"><div class="lock-msg-name">'+escapeHtml(n.name)+'</div>' +
                    '<div class="lock-msg-preview">'+escapeHtml(n.preview)+'</div></div>' +
                    '<div class="lock-msg-time">'+formatTime(n.time)+'</div></div>';
            }
            container.innerHTML = html;
        }

        function goToChat(id) { window.location.href = 'chat-detail.html?id=' + id; }

        var startY = 0;
        document.getElementById('phone-shell').addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; });
        document.getElementById('phone-shell').addEventListener('touchend', function(e) {
            if (startY - e.changedTouches[0].clientY > 80) goToHome();
        });

        function goToHome() {
            var shell = document.getElementById('phone-shell');
            shell.style.transform = 'translateY(-100%)';
            shell.style.opacity = '0';
            setTimeout(function() { window.location.href = 'index.html?from=lockscreen'; }, 400);
        }

        // ✅ 壁纸弹窗
        function openWallpaperModal() {
            var grid = document.getElementById('wall-grid');
            var colorGrid = document.getElementById('color-grid');
            var currentBg = localStorage.getItem('lockWallpaper') || wallpapers[0].css;
            var currentColor = localStorage.getItem('lockTimeColor') || '#FFFFFF';

            var html = '';
            for (var i = 0; i < wallpapers.length; i++) {
                html += '<div class="wall-item' + (wallpapers[i].css===currentBg?' selected':'') + '" style="background:' + wallpapers[i].css + '" onclick="setWallpaper(\'' + wallpapers[i].css + '\')"></div>';
            }
            grid.innerHTML = html;

            // ✅ 颜色网格
            var colorHtml = '';
            for (var j = 0; j < colors.length; j++) {
                colorHtml += '<div class="color-dot' + (colors[j]===currentColor?' selected':'') + '" style="background:' + colors[j] + ';" data-color="' + colors[j] + '" onclick="selectColor(this)"></div>';
            }
            colorGrid.innerHTML = colorHtml;

            highlightCurrentFont();
            document.getElementById('wallpaper-modal').classList.add('active');
        }

        function setWallpaper(css) {
            localStorage.setItem('lockWallpaper', css);
            document.getElementById('phone-shell').style.background = css;
            closeWallpaperModal();
        }

        function uploadWallpaper(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var imgUrl = e.target.result;
                localStorage.setItem('lockWallpaper', imgUrl);
                document.getElementById('phone-shell').style.background = 'url(' + imgUrl + ') center/cover no-repeat';
                closeWallpaperModal();
            };
            reader.readAsDataURL(file);
        }

        function closeWallpaperModal() {
            document.getElementById('wallpaper-modal').classList.remove('active');
        }

        // ✅ 颜色选择（点击色块）
        function selectColor(el) {
            var dots = document.querySelectorAll('.color-dot');
            for (var i = 0; i < dots.length; i++) dots[i].classList.remove('selected');
            el.classList.add('selected');
            var hex = el.getAttribute('data-color');
            localStorage.setItem('lockTimeColor', hex);
            applyTimeColor(hex);
        }

        // ✅ 只改变时间和日期颜色，不改状态栏
        function applyTimeColor(color) {
            document.getElementById('lock-time').style.color = color;
            document.getElementById('lock-date').style.color = color;
            var hint = document.querySelector('.swipe-hint');
            if (hint) hint.style.color = color;
        }

        // ✅ 字体
        function selectFont(el) {
            var opts = document.querySelectorAll('.font-opt');
            for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
            el.classList.add('selected');
            var fontFamily = el.getAttribute('data-font');
            var fontWeight = el.getAttribute('data-weight');
            localStorage.setItem('lockFontFamily', fontFamily);
            localStorage.setItem('lockFontWeight', fontWeight);
            applyFontStyle(fontFamily, fontWeight);
        }

        function highlightCurrentFont() {
            var savedFont = localStorage.getItem('lockFontFamily');
            var savedWeight = localStorage.getItem('lockFontWeight');
            var opts = document.querySelectorAll('.font-opt');
            var found = false;
            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.remove('selected');
                if (opts[i].getAttribute('data-font') === savedFont && opts[i].getAttribute('data-weight') === savedWeight) {
                    opts[i].classList.add('selected'); found = true;
                }
            }
            if (!found) opts[0].classList.add('selected');
        }

        function applyFontStyle(fontFamily, fontWeight) {
            var timeEl = document.getElementById('lock-time');
            var dateEl = document.getElementById('lock-date');
            timeEl.style.fontFamily = fontFamily;
            timeEl.style.fontWeight = fontWeight;
            dateEl.style.fontFamily = fontFamily;
            dateEl.style.fontWeight = '400';
        }

        // ✅ 初始化
        (function() {
            var savedBg = localStorage.getItem('lockWallpaper');
            if (savedBg) {
                if (savedBg.indexOf('linear-gradient') === 0) {
                    document.getElementById('phone-shell').style.background = savedBg;
                } else {
                    document.getElementById('phone-shell').style.background = 'url(' + savedBg + ') center/cover no-repeat';
                }
            }
            var savedFont = localStorage.getItem('lockFontFamily');
            var savedWeight = localStorage.getItem('lockFontWeight');
            if (savedFont) applyFontStyle(savedFont, savedWeight || '200');
            var savedColor = localStorage.getItem('lockTimeColor');
            if (savedColor) applyTimeColor(savedColor);
            loadLockMessages();
        })();

        function formatTime(ts) {
            var d = new Date(ts), now = new Date();
            var h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0');
            if (d.toDateString() === now.toDateString()) return h + ':' + m;
            return String(d.getMonth()+1) + '/' + String(d.getDate());
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.innerText = text || '';
            return d.innerHTML;
        }
    </script>
</body>
</html>

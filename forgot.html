<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>找回密码</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #phone-shell {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            background: #fff;
            border-radius: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
        }

        .back-link {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 15px;
            padding: 15px 5px;
            color: #007aff;
            text-decoration: none;
            font-size: 16px;
            z-index: 10;
        }

        .page-flex-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 30px;
            padding-top: 60px;
        }

        .page-flex-container h2 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #000;
        }

        .ios-input-large {
            width: 100%;
            max-width: 300px;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            background: #f9f9f9;
        }

        .code-row { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            max-width: 300px; 
            margin-bottom: 15px; 
        }

        .code-row input {
            flex: 2;
            margin-bottom: 0;
        }

        .send-btn { 
            flex: 1; 
            border: 1px solid #007aff;
            background: #fff; 
            color: #007aff;
            border-radius: 12px; 
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .black-square-btn {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .black-square-btn:active {
            background: #333;
        }

        .bottom-link {
            margin-top: 20px;
            color: #8e8e93;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <a href="login.html" class="back-link">〈 返回</a>
        
        <div class="page-flex-container">
            <h2>找回密码</h2>
            
            <input type="text" id="forgot-email" class="ios-input-large" placeholder="输入qq邮箱">
            
            <div class="code-row">
                <input type="text" class="ios-input-large" style="margin-bottom:0;" placeholder="输入验证码">
                <button class="send-btn" onclick="alert('验证码已发送（模拟）')">发送验证码</button>
            </div>

            <input type="password" id="new-password" class="ios-input-large" placeholder="设置新密码">

            <button class="black-square-btn" onclick="handleReset()">重置并登录</button>
            
            <p class="bottom-link" onclick="window.location.href='login.html'">返回登录</p>
        </div>
    </div>

    <script>
        function handleReset() {
            var email = document.getElementById('forgot-email').value.trim();
            var newPwd = document.getElementById('new-password').value.trim();

            if (!email || !newPwd) {
                alert("请填写完整信息");
                return;
            }

            var existingUser = localStorage.getItem('user_' + email);
            if (existingUser === null) {
                alert("该邮箱尚未注册");
                return;
            }

            localStorage.setItem('user_' + email, newPwd);
            alert("密码重置成功！请重新登录");
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>

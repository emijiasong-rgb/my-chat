<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>找回密码</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 仅保留必要的局部样式 */
        .code-row { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            max-width: 300px; 
            margin-bottom: 20px; 
        }
        .send-btn { 
            flex: 1; 
            border: 1px solid #000; 
            background: #fff; 
            border-radius: 10px; 
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <a href="login.html" class="back-link">〈 返回</a>
        
        <div class="page-flex-container">
            <h2 style="margin-bottom: 30px;">找回密码</h2>
            
            <input type="text" id="forgot-email" class="ios-input-large" placeholder="输入qq邮箱">
            
            <div class="code-row">
                <input type="text" class="ios-input-large" style="margin-bottom:0; flex: 2;" placeholder="输入验证码">
                <button class="send-btn" onclick="alert('验证码已发送（模拟）')">发送验证码</button>
            </div>

            <input type="password" id="new-password" class="ios-input-large" placeholder="设置新密码">

            <button class="black-square-btn" style="margin-top: 10px;" onclick="handleReset()">重置并登录</button>
            
            <p style="margin-top: 20px; color: #8e8e93; font-size: 14px; cursor: pointer;" onclick="window.location.href='login.html'">返回登录</p>
        </div>
    </div>

    <script>
    function handleReset() {
        const email = document.getElementById('forgot-email').value.trim();
        const newPwd = document.getElementById('new-password').value.trim();

        if (!email || !newPwd) {
            alert("请填写完整信息");
            return;
        }

        // 检查用户是否注册过
        const existingUser = localStorage.getItem('user_' + email);
        if (existingUser === null) {
            alert("该邮箱尚未注册");
            return;
        }

        // 更新本地存储的密码
        localStorage.setItem('user_' + email, newPwd);
        alert("密码重置成功！请重新登录");
        window.location.href = 'login.html';
    }
    </script>
</body>
</html>

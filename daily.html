<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daily</title>
    <style>
        :root {
            --bg: #FDF8F2;
            --card-bg: #fff;
            --text: #3A3A3A;
            --green: #7CB87C;
            --purple: #E0D4F5;
            --pink: #F7A1C4;
            --grey: #B0B0B0;
            --separator: #f0ede8;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:var(--text);
            background:var(--bg);
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        #battery-container { display:flex; align-items:center; gap:2px; }

        .top-nav {
            display:flex; align-items:center; justify-content:center;
            padding:10px 16px; background:var(--bg); position:relative;
            border-bottom:0.5px solid var(--separator);
        }
        .top-nav .back-arrow {
            position:absolute; left:16px; font-size:18px; color:var(--text);
            cursor:pointer; text-decoration:none; padding:4px;
        }
        .top-nav .nav-title { font-size:17px; font-weight:700; color:var(--text); }

        .login-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.3); z-index:1000;
            display:flex; justify-content:center; align-items:center;
        }
        .login-card {
            background:var(--card-bg); border-radius:24px; padding:32px 24px;
            width:80%; max-width:320px; text-align:center;
            box-shadow:0 8px 32px rgba(0,0,0,0.08);
        }
        .login-card h2 { font-size:22px; color:var(--text); margin-bottom:24px; font-weight:700; }
        .login-btn {
            width:100%; padding:14px; border:none; border-radius:14px;
            background:var(--green); color:#fff; font-size:16px; font-weight:600;
            cursor:pointer; transition:transform 0.2s;
        }
        .login-btn:active { transform:scale(0.97); }

        .main-page { flex:1; overflow-y:auto; display:none; }
        .main-page.show { display:block; }
        .main-page::-webkit-scrollbar { display:none; }

        .my-avatar-section {
            display:flex; align-items:center; gap:12px; padding:16px;
            cursor:pointer;
        }
        .my-avatar {
            width:52px; height:52px; border-radius:50%; object-fit:cover;
            border:2px solid var(--purple); background:#e0e0e0;
        }
        .my-avatar-label { font-size:14px; color:var(--text); font-weight:500; }

        .account-info {
            padding:4px 16px 12px; font-size:12px; color:var(--grey);
            display:flex; align-items:center; gap:6px;
        }
        .account-info .switch-link { color:var(--green); cursor:pointer; text-decoration:underline; }

        .section-title { padding:10px 16px 4px; font-size:12px; color:var(--grey); font-weight:500; }
        .contact-card {
            display:flex; align-items:center; gap:12px; padding:14px 16px;
            cursor:pointer; background:var(--card-bg); margin:4px 12px;
            border-radius:16px; transition:transform 0.2s;
        }
        .contact-card:active { transform:scale(0.98); }
        .contact-avatar {
            width:48px; height:48px; border-radius:50%; object-fit:cover;
            background:#e0e0e0; flex-shrink:0;
        }
        .contact-name { font-size:15px; font-weight:600; color:var(--text); }

        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.4); z-index:2000; justify-content:center; align-items:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-card {
            background:var(--card-bg); border-radius:20px; padding:24px 20px;
            width:85%; max-width:340px; text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,0.15);
        }
        .modal-card h3 { font-size:18px; color:var(--text); margin-bottom:16px; }
        .modal-input {
            width:100%; padding:12px; border:1px solid #e0e0e0;
            border-radius:12px; font-size:14px; margin-bottom:10px; outline:none;
        }
        .modal-btn {
            width:100%; padding:12px; border:none; border-radius:12px;
            font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;
        }
        .modal-btn.confirm { background:var(--green); color:#fff; }
        .modal-btn.cancel { background:#f0f0f0; color:#888; }

        .success-toast {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            background:var(--card-bg); border-radius:20px; padding:20px 32px;
            font-size:18px; color:var(--text); z-index:3000;
            box-shadow:0 8px 32px rgba(0,0,0,0.12); display:none;
            text-align:center;
        }
        .success-toast.show { display:block; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="25" height="12" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div class="top-nav">
            <a href="index.html?from=chat" class="back-arrow">←</a>
            <span class="nav-title">Daily</span>
        </div>

        <div class="login-overlay" id="login-overlay">
            <div class="login-card">
                <h2>登录</h2>
                <button class="login-btn" onclick="bindAccount()">与微信绑定</button>
            </div>
        </div>

        <div class="main-page" id="main-page">
            <div class="my-avatar-section" onclick="window.location.href='daily-profile.html'">
                <img class="my-avatar" id="my-avatar" src="" alt="">
                <div>
                    <span class="my-avatar-label" id="my-name-label">我的日常 ›</span>
                    <div class="account-info">
                        <span id="bound-account">未绑定账号</span>
                        <span class="switch-link" onclick="switchAccount()">切换</span>
                    </div>
                </div>
            </div>
            <div class="section-title">联系人</div>
            <div id="contact-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="bind-modal">
        <div class="modal-card">
            <h3>绑定你的账号</h3>
            <p style="font-size:13px;color:#888;margin-bottom:12px;">绑定后将使用你的 Chat 账号信息</p>
            <input type="text" class="modal-input" id="bind-name" placeholder="你的名字">
            <input type="file" id="bind-avatar-file" accept="image/*" style="display:none;" onchange="handleBindAvatar(event)">
            <button class="modal-btn cancel" onclick="document.getElementById('bind-avatar-file').click()">更换头像</button>
            <button class="modal-btn confirm" onclick="confirmBind()">确认绑定</button>
            <button class="modal-btn cancel" onclick="closeBindModal()">取消</button>
        </div>
    </div>

    <div class="success-toast" id="success-toast">登入成功 ✨</div>

    <script>
        var bindAvatarData = '';

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000); updateClock();

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    document.getElementById('battery-percent').textContent = lvl + '%';
                    var lel = document.getElementById('battery-level');
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }
        updateBattery();

        document.addEventListener('DOMContentLoaded', function() { checkBinding(); });

        function checkBinding() {
            var boundUser = localStorage.getItem('daily_bound_user') || localStorage.getItem('currentUser');
            var boundAvatar = localStorage.getItem('daily_avatar') || localStorage.getItem('savedAvatar');
            var bound = localStorage.getItem('daily_bound');
            if (bound && boundUser) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-page').classList.add('show');
                document.getElementById('my-avatar').src = boundAvatar || '';
                document.getElementById('my-name-label').innerText = boundUser + ' 的日常 ›';
                document.getElementById('bound-account').innerText = '已绑定：' + boundUser;
                renderContacts();
            }
        }

        function bindAccount() {
            var currentUser = localStorage.getItem('currentUser');
            var savedAvatar = localStorage.getItem('savedAvatar');
            if (currentUser && currentUser !== '未登录用户') {
                bindAvatarData = savedAvatar || '';
                document.getElementById('bind-name').value = currentUser;
                document.getElementById('bind-modal').classList.add('active');
            } else {
                bindAvatarData = '';
                document.getElementById('bind-name').value = '';
                document.getElementById('bind-modal').classList.add('active');
            }
        }

        function switchAccount() {
            if (confirm('确定要切换绑定的账号吗？切换后需要重新绑定。')) {
                localStorage.removeItem('daily_bound');
                localStorage.removeItem('daily_bound_user');
                localStorage.removeItem('daily_avatar');
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('main-page').classList.remove('show');
            }
        }

        function handleBindAvatar(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) { bindAvatarData = e.target.result; };
            reader.readAsDataURL(file);
        }

        function confirmBind() {
            var name = document.getElementById('bind-name').value.trim();
            if (!name) { alert('请输入名字'); return; }
            var currentUser = localStorage.getItem('currentUser');
            var boundUser = currentUser && currentUser !== '未登录用户' ? currentUser : name;
            localStorage.setItem('daily_bound', 'true');
            localStorage.setItem('daily_bound_user', boundUser);
            localStorage.setItem('daily_avatar', bindAvatarData || localStorage.getItem('savedAvatar') || '');
            closeBindModal();
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-page').classList.add('show');
            document.getElementById('my-avatar').src = bindAvatarData || localStorage.getItem('savedAvatar') || '';
            document.getElementById('my-name-label').innerText = boundUser + ' 的日常 ›';
            document.getElementById('bound-account').innerText = '已绑定：' + boundUser;
            renderContacts();
            var toast = document.getElementById('success-toast');
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 1500);
        }

        function closeBindModal() { document.getElementById('bind-modal').classList.remove('active'); }

        function renderContacts() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var container = document.getElementById('contact-list');
            if (roles.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">暂无联系人</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < roles.length; i++) {
                var r = roles[i];
                html += '<div class="contact-card" onclick="window.location.href=\'daily-character.html?id=' + r.id + '\'">' +
                    '<img class="contact-avatar" src="' + (r.avatar || '') + '" onerror="this.style.background=\'#e0e0e0\'">' +
                    '<span class="contact-name">' + escapeHtml(r.remark || r.name) + '</span></div>';
            }
            container.innerHTML = html;
        }

        function escapeHtml(text) { var d = document.createElement('div'); d.innerText = text || ''; return d.innerHTML; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone-shell">
    <a href="login.html" class="back-link">〈 返回</a>
    <div class="page-flex-container">
        <h1 style="margin-bottom: 40px; font-size: 24px;">注册账号</h1>

        <input type="text" id="reg-email" class="ios-input-large" placeholder="输入qq邮箱">
        <input type="password" id="reg-password" class="ios-input-large" placeholder="输入密码">
        <input type="password" id="reg-confirm" class="ios-input-large" placeholder="再次输入密码">

        <button class="black-square-btn" style="margin-top: 20px;" onclick="handleRegister()">请注册</button>
    </div>
</div>

<script>
function handleRegister() {
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    const confirm = document.getElementById('reg-confirm').value.trim();

    if (!email || !password || !confirm) {
        showMessage("请填写完整信息");
        return;
    }
    if (password !== confirm) {
        showMessage("两次输入的密码不一致");
        return;
    }

    localStorage.setItem('user_' + email, password);
    showMessage("注册成功！即将前往登录页面");
    
    setTimeout(() => {
        window.location.href = 'login.html';
    }, 1500);
}

function showMessage(msg) {
    let msgDiv = document.getElementById('custom-message');
    if (!msgDiv) {
        msgDiv = document.createElement('div');
        msgDiv.id = 'custom-message';
        msgDiv.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 9999;
            text-align: center;
        `;
        document.body.appendChild(msgDiv);
    }
    msgDiv.innerText = msg;
    msgDiv.style.display = 'block';
    setTimeout(() => {
        msgDiv.style.display = 'none';
    }, 2000);
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>注册账号</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #phone-shell {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            background: #fff;
            border-radius: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
        }

        .back-link {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 15px;
            padding: 15px 5px;
            color: #007aff;
            text-decoration: none;
            font-size: 16px;
            z-index: 10;
        }

        .page-flex-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 30px;
            padding-top: 60px;
        }

        .page-flex-container h1 {
            margin-bottom: 40px;
            font-size: 24px;
            color: #000;
        }

        .ios-input-large {
            width: 100%;
            max-width: 300px;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            background: #f9f9f9;
        }

        .black-square-btn {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .black-square-btn:active {
            background: #333;
        }

        #custom-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 9999;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<div id="phone-shell">
    <a href="login.html" class="back-link">〈 返回</a>
    <div class="page-flex-container">
        <h1>注册账号</h1>

        <input type="text" id="reg-email" class="ios-input-large" placeholder="输入qq邮箱">
        <input type="password" id="reg-password" class="ios-input-large" placeholder="输入密码">
        <input type="password" id="reg-confirm" class="ios-input-large" placeholder="再次输入密码">

        <button class="black-square-btn" id="reg-btn">请注册</button>
    </div>
</div>

<div id="custom-message"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('reg-btn');
        if (btn) {
            btn.addEventListener('click', handleRegister);
        }
    });

    function handleRegister() {
        var email = document.getElementById('reg-email').value.trim();
        var password = document.getElementById('reg-password').value.trim();
        var confirm = document.getElementById('reg-confirm').value.trim();

        if (!email || !password || !confirm) {
            showMessage("请填写完整信息");
            return;
        }
        if (password !== confirm) {
            showMessage("两次输入的密码不一致");
            return;
        }

        localStorage.setItem('user_' + email, password);
        showMessage("注册成功！即将前往登录页面");
        
        setTimeout(function() {
            window.location.href = 'login.html';
        }, 1500);
    }

    function showMessage(msg) {
        var msgDiv = document.getElementById('custom-message');
        msgDiv.innerText = msg;
        msgDiv.style.display = 'block';
        setTimeout(function() {
            msgDiv.style.display = 'none';
        }, 2000);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的日常</title>
    <style>
        :root {
            --bg: #FDF8F2;
            --card-bg: #fff;
            --text: #3A3A3A;
            --green: #7CB87C;
            --purple: #E0D4F5;
            --pink: #F7A1C4;
            --grey: #B0B0B0;
            --separator: #f0ede8;
            --red: #F5D4D4;
            --light-green: #D4F0D4;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:var(--text);
            background:var(--bg);
        }
        .nav-bar {
            display:flex; align-items:center; padding:10px 16px;
            background:var(--bg); border-bottom:0.5px solid var(--separator);
        }
        .nav-back { font-size:17px; color:#007aff; cursor:pointer; text-decoration:none; }
        .nav-title { font-size:17px; font-weight:600; position:absolute; left:50%; transform:translateX(-50%); color:var(--text); }

        #viewport { flex:1; overflow-y:auto; padding:12px 14px; }
        #viewport::-webkit-scrollbar { display:none; }

        .card {
            background:var(--card-bg); border-radius:20px; padding:18px;
            margin-bottom:14px; box-shadow:0 2px 12px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size:14px; font-weight:700; color:var(--text); margin-bottom:12px;
            display:flex; align-items:center; gap:6px;
        }
        .card-title svg { width:16px; height:16px; }

        .time-row {
            display:flex; align-items:center; justify-content:space-between;
            padding:8px 0; border-bottom:0.5px solid #f5f5f5;
        }
        .time-row:last-child { border-bottom:none; }
        .time-label { font-size:13px; color:#888; }
        .time-value {
            font-size:14px; color:var(--text); font-weight:600; cursor:pointer;
            padding:4px 10px; border-radius:8px; background:#f8f8f8;
        }
        .time-value:active { background:#eee; }

        .tag-grid {
            display:flex; flex-wrap:wrap; gap:8px;
        }
        .tag {
            padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer;
            border:1.5px solid #e0e0e0; color:#888; background:#fff;
            transition:all 0.2s; font-weight:500;
        }
        .tag.selected {
            border-color:var(--green); background:#F0F7F0; color:var(--green);
        }

        .sub-tag-grid {
            display:none; flex-wrap:wrap; gap:8px; margin-top:8px; padding:10px;
            background:#fafafa; border-radius:12px;
        }
        .sub-tag-grid.show { display:flex; }
        .sub-tag {
            padding:6px 12px; border-radius:16px; font-size:12px; cursor:pointer;
            border:1px solid #e0e0e0; color:#888; background:#fff;
        }
        .sub-tag.selected {
            border-color:var(--purple); background:#F5EEFF; color:#7B5EA7;
        }

        .bottom-links {
            display:flex; gap:12px; margin-top:8px;
        }
        .bottom-link {
            flex:1; padding:14px; text-align:center; border-radius:16px;
            background:var(--card-bg); font-size:14px; font-weight:600;
            color:var(--text); cursor:pointer; text-decoration:none;
            box-shadow:0 2px 8px rgba(0,0,0,0.04);
        }
        .bottom-link:active { opacity:0.7; }

        /* 时间选择器弹窗 */
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.4); z-index:2000; justify-content:center; align-items:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-card {
            background:var(--card-bg); border-radius:20px; padding:20px;
            width:80%; max-width:300px; text-align:center;
        }
        .modal-card h4 { font-size:16px; margin-bottom:12px; color:var(--text); }
        .modal-card input[type="time"] {
            width:100%; padding:10px; border:1px solid #e0e0e0; border-radius:12px;
            font-size:16px; text-align:center; margin-bottom:10px;
        }
        .modal-btn {
            padding:10px 20px; border:none; border-radius:10px; font-size:14px;
            font-weight:600; cursor:pointer; margin:4px;
        }
        .modal-btn.save { background:var(--green); color:#fff; }
        .modal-btn.cancel { background:#f0f0f0; color:#888; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span id="battery-percent">--%</span>
            </div>
        </div>
        <div class="nav-bar">
            <a href="daily.html" class="nav-back">← 返回</a>
            <span class="nav-title">我的日常</span>
        </div>

        <div id="viewport">
            <!-- 睡眠时间 -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    睡眠时间
                </div>
                <div class="time-row">
                    <span class="time-label">周一至周五 睡觉</span>
                    <span class="time-value" id="weekday-sleep" onclick="openTimePicker('weekday-sleep')">22:30</span>
                </div>
                <div class="time-row">
                    <span class="time-label">周一至周五 起床</span>
                    <span class="time-value" id="weekday-wake" onclick="openTimePicker('weekday-wake')">07:30</span>
                </div>
                <div class="time-row">
                    <span class="time-label">周末 睡觉</span>
                    <span class="time-value" id="weekend-sleep" onclick="openTimePicker('weekend-sleep')">22:30</span>
                </div>
                <div class="time-row">
                    <span class="time-label">周末 起床</span>
                    <span class="time-value" id="weekend-wake" onclick="openTimePicker('weekend-wake')">07:30</span>
                </div>
            </div>

            <!-- 兴趣爱好 -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                    兴趣爱好
                </div>
                <div class="tag-grid" id="hobby-tags">
                    <div class="tag" data-tag="看电影" onclick="toggleTag(this)">看电影</div>
                    <div class="tag" data-tag="追剧" onclick="toggleTag(this)">追剧</div>
                    <div class="tag" data-tag="二次元" onclick="toggleTag(this)">二次元</div>
                    <div class="tag" data-tag="Cosplay" onclick="toggleTag(this)">Cosplay</div>
                    <div class="tag" data-tag="看书" onclick="toggleTag(this)">看书</div>
                    <div class="tag" data-tag="打游戏" onclick="toggleGameSub(this)">打游戏</div>
                    <div class="tag" data-tag="音乐" onclick="toggleTag(this)">音乐</div>
                    <div class="tag" data-tag="绘画" onclick="toggleTag(this)">绘画</div>
                    <div class="tag" data-tag="手工" onclick="toggleTag(this)">手工</div>
                    <div class="tag" data-tag="摄影" onclick="toggleTag(this)">摄影</div>
                </div>
                <div class="sub-tag-grid" id="game-sub-tags">
                    <div class="sub-tag" data-tag="王者荣耀" onclick="toggleSubTag(this)">王者荣耀</div>
                    <div class="sub-tag" data-tag="光遇" onclick="toggleSubTag(this)">光遇</div>
                    <div class="sub-tag" data-tag="和平精英" onclick="toggleSubTag(this)">和平精英</div>
                    <div class="sub-tag" data-tag="蛋仔派对" onclick="toggleSubTag(this)">蛋仔派对</div>
                    <div class="sub-tag" data-tag="原神" onclick="toggleSubTag(this)">原神</div>
                    <div class="sub-tag" data-tag="金铲铲之战" onclick="toggleSubTag(this)">金铲铲之战</div>
                </div>
            </div>

            <!-- 体育运动 -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    体育运动
                </div>
                <div class="tag-grid" id="sport-tags">
                    <div class="tag" data-tag="宅家" onclick="toggleTag(this)">宅家</div>
                    <div class="tag" data-tag="打网球" onclick="toggleTag(this)">打网球</div>
                    <div class="tag" data-tag="打羽毛球" onclick="toggleTag(this)">打羽毛球</div>
                    <div class="tag" data-tag="跑步" onclick="toggleTag(this)">跑步</div>
                    <div class="tag" data-tag="游泳" onclick="toggleTag(this)">游泳</div>
                    <div class="tag" data-tag="瑜伽" onclick="toggleTag(this)">瑜伽</div>
                    <div class="tag" data-tag="健身" onclick="toggleTag(this)">健身</div>
                    <div class="tag" data-tag="骑行" onclick="toggleTag(this)">骑行</div>
                    <div class="tag" data-tag="舞蹈" onclick="toggleTag(this)">舞蹈</div>
                </div>
            </div>

            <!-- 底部入口 -->
            <div class="bottom-links">
                <div class="bottom-link" onclick="window.location.href='daily-calendar.html?type=self'">日程</div>
                <div class="bottom-link" onclick="window.location.href='daily-permissions.html'">权限管理</div>
            </div>
        </div>
    </div>

    <!-- 时间选择弹窗 -->
    <div class="modal-overlay" id="time-modal">
        <div class="modal-card">
            <h4 id="time-modal-title">选择时间</h4>
            <input type="time" id="time-input" value="22:30">
            <div>
                <button class="modal-btn cancel" onclick="closeTimeModal()">取消</button>
                <button class="modal-btn save" onclick="saveTime()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var currentTimeKey = '';

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000); updateClock();

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    document.getElementById('battery-percent').textContent = Math.round(b.level * 100) + '%';
                });
            }
        }
        updateBattery();

        // 加载已保存的设置
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
        });

        function loadSettings() {
            var settings = JSON.parse(localStorage.getItem('daily_profile') || '{}');
            // 睡眠时间
            if (settings.weekdaySleep) document.getElementById('weekday-sleep').innerText = settings.weekdaySleep;
            if (settings.weekdayWake) document.getElementById('weekday-wake').innerText = settings.weekdayWake;
            if (settings.weekendSleep) document.getElementById('weekend-sleep').innerText = settings.weekendSleep;
            if (settings.weekendWake) document.getElementById('weekend-wake').innerText = settings.weekendWake;
            // 兴趣爱好
            if (settings.hobbies) {
                settings.hobbies.forEach(function(h) { selectTagByData('hobby-tags', h); });
            }
            if (settings.games) {
                settings.games.forEach(function(g) { selectSubTag(g); });
                if (settings.games.length > 0) document.getElementById('game-sub-tags').classList.add('show');
            }
            // 体育运动
            if (settings.sports) {
                settings.sports.forEach(function(s) { selectTagByData('sport-tags', s); });
            }
        }

        function selectTagByData(containerId, tagText) {
            var container = document.getElementById(containerId);
            var tags = container.querySelectorAll('.tag');
            tags.forEach(function(t) {
                if (t.dataset.tag === tagText) t.classList.add('selected');
            });
        }

        function selectSubTag(tagText) {
            var tags = document.querySelectorAll('#game-sub-tags .sub-tag');
            tags.forEach(function(t) {
                if (t.dataset.tag === tagText) t.classList.add('selected');
            });
        }

        function saveSettings() {
            var settings = {
                weekdaySleep: document.getElementById('weekday-sleep').innerText,
                weekdayWake: document.getElementById('weekday-wake').innerText,
                weekendSleep: document.getElementById('weekend-sleep').innerText,
                weekendWake: document.getElementById('weekend-wake').innerText,
                hobbies: getSelectedTags('hobby-tags'),
                games: getSelectedSubTags('game-sub-tags'),
                sports: getSelectedTags('sport-tags')
            };
            localStorage.setItem('daily_profile', JSON.stringify(settings));
        }

        function getSelectedTags(containerId) {
            var result = [];
            var tags = document.querySelectorAll('#' + containerId + ' .tag.selected');
            tags.forEach(function(t) { result.push(t.dataset.tag); });
            return result;
        }

        function getSelectedSubTags(containerId) {
            var result = [];
            var tags = document.querySelectorAll('#' + containerId + ' .sub-tag.selected');
            tags.forEach(function(t) { result.push(t.dataset.tag); });
            return result;
        }

        function toggleTag(el) {
            el.classList.toggle('selected');
            saveSettings();
        }

        function toggleGameSub(el) {
            el.classList.toggle('selected');
            var subGrid = document.getElementById('game-sub-tags');
            if (el.classList.contains('selected')) {
                subGrid.classList.add('show');
            } else {
                subGrid.classList.remove('show');
                document.querySelectorAll('#game-sub-tags .sub-tag').forEach(function(t) { t.classList.remove('selected'); });
            }
            saveSettings();
        }

        function toggleSubTag(el) {
            el.classList.toggle('selected');
            saveSettings();
        }

        // 时间选择器
        function openTimePicker(key) {
            currentTimeKey = key;
            var currentVal = document.getElementById(key).innerText;
            document.getElementById('time-input').value = currentVal;
            document.getElementById('time-modal-title').innerText = key.indexOf('sleep') !== -1 ? '睡觉时间' : '起床时间';
            document.getElementById('time-modal').classList.add('active');
        }

        function closeTimeModal() {
            document.getElementById('time-modal').classList.remove('active');
        }

        function saveTime() {
            var val = document.getElementById('time-input').value;
            document.getElementById(currentTimeKey).innerText = val;
            closeTimeModal();
            saveSettings();
        }

        document.getElementById('time-modal').addEventListener('click', function(e) {
            if (e.target === this) closeTimeModal();
        });
    </script>
</body>
</html>

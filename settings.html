<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>设置</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* 1. 强制网页大背景为深色，使手机壳居中显现 */
        body {
            background: #1a1a1a !important;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden; 
        }

        /* 2. 固定手机外壳尺寸 */
        #phone-shell {
            width: 393px !important;  
            height: 852px !important; 
            background: #f2f2f7; /* 浅灰色背景 */
            border-radius: 47px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;         
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
            flex-shrink: 0;
        }

        /* 3. 内容滚动区域 */
        #viewport {
            flex: 1;
            overflow-y: auto;         
            background: #f2f2f7; /* 浅灰色背景 */
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }
        #viewport::-webkit-scrollbar { display: none; }

        /* 灵动岛装饰 */
        #phone-shell::before {
            content: "";
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 1001;
        }

        /* 底部 Home 条装饰 */
        #phone-shell::after {
            content: "";
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 100px;
            z-index: 1001;
        }

        /* 标题栏 */
        .header-title { 
            background: #f2f2f7;
            padding: 60px 15px 15px;
            font-weight: bold; 
            font-size: 17px; 
            text-align: center;
            color: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .back-btn {
            position: absolute;
            left: 15px;
            color: #007aff;
            cursor: pointer;
            font-weight: normal;
        }

        /* ===== 白色玻璃拟态卡片样式 ===== */
        .glass-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            margin: 10px 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        /* 个人账户卡片 */
        .account-section { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            margin: 10px 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        
        .account-avatar { 
            width: 60px; 
            height: 60px; 
            background: #e0e0e0;
            border-radius: 50%; 
            overflow: hidden; 
            margin-right: 15px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .account-avatar img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .account-info {
            flex: 1;
        }
        
        .account-info b {
            color: #000;
            font-size: 17px;
        }
        
        .account-info p {
            color: #888;
            font-size: 13px;
            margin: 3px 0 0;
        }

        /* 设置列表项 */
        .glass-item { 
            display: flex; 
            align-items: center; 
            padding: 14px 16px; 
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
            cursor: pointer;
            color: #000;
            font-size: 16px;
            transition: background 0.2s ease;
        }
        
        .glass-item:last-child {
            border-bottom: none;
        }
        
        .glass-item:active {
            background: rgba(0, 0, 0, 0.03);
        }
        
        .glass-item span:first-child {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .arrow-r { 
            margin-left: auto; 
            color: #c7c7cc;
            font-size: 18px;
        }

        /* 退出登录按钮 */
        .logout-btn {
            display: block;
            margin: 20px 15px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            color: #ff3b30;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease;
        }
        
        .logout-btn:active {
            background: rgba(0, 0, 0, 0.05);
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="header-title">
                <span class="back-btn" onclick="window.location.href='index.html?from=settings'">〈 返回</span>
                <span>设置</span>
            </div>

            <!-- 个人账户卡片 -->
            <div class="account-section" id="account-btn" onclick="handleAccountClick()">
                <div class="account-avatar" id="avatar-container">
                    <span id="default-icon" style="font-size: 30px;">👤</span>
                </div>
                <div class="account-info">
                    <b id="user-display-name">请登录</b>
                    <p id="user-display-desc">Apple 账户、iCloud 等</p>
                </div>
                <span class="arrow-r">〉</span>
            </div>

            <!-- 设置列表组1 -->
            <div class="glass-container">
                <div class="glass-item" onclick="window.location.href='api-settings.html'">
                    <span>📶 无线局域网</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('通用设置')">
                    <span>⚙️ 通用</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('通知设置')">
                    <span>🔔 通知</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('声音设置')">
                    <span>🔊 声音与触感</span>
                    <span class="arrow-r">〉</span>
                </div>
            </div>
            
            <!-- 设置列表组2 -->
            <div class="glass-container">
                <div class="glass-item" onclick="window.location.href='font-settings.html'">
    <span>🔤 字体样式</span>
    <span class="arrow-r">〉</span>
</div>
                <div class="glass-item" onclick="alert('隐私设置')">
                    <span>🔒 隐私与安全性</span>
                    <span class="arrow-r">〉</span>
                </div>
            </div>

            <!-- 退出登录按钮 -->
            <div class="logout-btn" onclick="handleLogout()">
                退出登录
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const currentUser = localStorage.getItem('currentUser');
            const savedAvatar = localStorage.getItem('savedAvatar');
            
            if (isLoggedIn === 'true' && currentUser) {
                document.getElementById('user-display-name').innerText = currentUser;
                document.getElementById('user-display-desc').innerText = "Apple 账户、iCloud、App Store";
                if (savedAvatar) {
                    const container = document.getElementById('avatar-container');
                    container.innerHTML = `<img src="${savedAvatar}" alt="avatar">`;
                }
            }
        });

        function handleAccountClick() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            window.location.href = (isLoggedIn === 'true') ? 'profile.html' : 'login.html';
        }
        
        function handleLogout() {
            if (confirm("确定要退出登录吗？")) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('savedAvatar');
                window.location.reload();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #phone-shell {
            width: 100vw;
            max-width: 430px;
            height: 100dvh;
            max-height: 932px;
            background: #f2f2f7;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
        }

        #viewport {
            flex: 1;
            overflow-y: auto;
            background: #f2f2f7;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }
        #viewport::-webkit-scrollbar { display: none; }

        .header-bar {
            background: #f2f2f7;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            color: #007aff;
            cursor: pointer;
            font-size: 16px;
        }

        .header-title {
            font-weight: bold;
            font-size: 17px;
            color: #000;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            margin: 10px 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .account-section { 
            display: flex; align-items: center; padding: 15px; cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px; margin: 10px 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        
        .account-avatar { 
            width: 60px; height: 60px; background: #e0e0e0;
            border-radius: 50%; overflow: hidden; margin-right: 15px;
            display: flex; align-items: center; justify-content: center;
        }
        .account-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .account-info { flex: 1; }
        .account-info b { color: #000; font-size: 17px; }
        .account-info p { color: #888; font-size: 13px; margin: 3px 0 0; }

        .glass-item { 
            display: flex; align-items: center; padding: 14px 16px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.08);
            cursor: pointer; color: #000; font-size: 16px;
        }
        .glass-item:last-child { border-bottom: none; }
        .glass-item:active { background: rgba(0,0,0,0.03); }
        .glass-item span:first-child { display: flex; align-items: center; gap: 10px; }
        
        .arrow-r { margin-left: auto; color: #c7c7cc; font-size: 18px; }

        .logout-btn {
            display: block; margin: 20px 15px; padding: 14px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8); border-radius: 16px;
            color: #ff3b30; font-size: 17px; font-weight: 600;
            text-align: center; cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .logout-btn:active { background: rgba(0,0,0,0.05); transform: scale(0.98); }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="header-bar">
                <span class="back-btn" onclick="window.location.href='index.html?from=settings'">〈 返回</span>
                <span class="header-title">设置</span>
            </div>

            <div class="account-section" id="account-btn" onclick="handleAccountClick()">
                <div class="account-avatar" id="avatar-container">
                    <span id="default-icon" style="font-size:30px;">👤</span>
                </div>
                <div class="account-info">
                    <b id="user-display-name">请登录</b>
                    <p id="user-display-desc">Apple 账户、iCloud 等</p>
                </div>
                <span class="arrow-r">〉</span>
            </div>

            <div class="glass-container">
                <div class="glass-item" onclick="window.location.href='api-settings.html'">
                    <span>📶 无线局域网</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('通用设置')">
                    <span>⚙️ 通用</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('通知设置')">
                    <span>🔔 通知</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('声音设置')">
                    <span>🔊 声音与触感</span>
                    <span class="arrow-r">〉</span>
                </div>
            </div>
            
            <div class="glass-container">
                <div class="glass-item" onclick="window.location.href='font-settings.html'">
                    <span>🔤 字体样式</span>
                    <span class="arrow-r">〉</span>
                </div>
                <div class="glass-item" onclick="alert('隐私设置')">
                    <span>🔒 隐私与安全性</span>
                    <span class="arrow-r">〉</span>
                </div>
            </div>

            <div class="logout-btn" onclick="handleLogout()">退出登录</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var isLoggedIn = localStorage.getItem('isLoggedIn');
            var currentUser = localStorage.getItem('currentUser');
            var savedAvatar = localStorage.getItem('savedAvatar');
            
            if (isLoggedIn === 'true' && currentUser) {
                document.getElementById('user-display-name').innerText = currentUser;
                document.getElementById('user-display-desc').innerText = "Apple 账户、iCloud、App Store";
                if (savedAvatar) {
                    var container = document.getElementById('avatar-container');
                    container.innerHTML = '<img src="' + savedAvatar + '" alt="avatar">';
                }
            }
        });

        function handleAccountClick() {
            var isLoggedIn = localStorage.getItem('isLoggedIn');
            window.location.href = (isLoggedIn === 'true') ? 'profile.html' : 'login.html';
        }
        
        function handleLogout() {
            if (confirm("确定要退出登录吗？")) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('savedAvatar');
                window.location.reload();
            }
        }
    </script>
</body>
</html>

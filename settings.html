<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>设置</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* 1. 强制网页大背景为深色，使手机壳居中显现 */
        body {
            background: #1a1a1a !important; /* 确保与图片中的深色背景一致 */
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            margin: 0;
            overflow: hidden; 
        }

        /* 2. 固定手机外壳尺寸 */
        #phone-shell {
            width: 393px !important;  
            height: 852px !important; 
            background: #f2f2f7;      
            border-radius: 47px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;         
            /* 这里的阴影效果会让手机壳更有立体感 */
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
            flex-shrink: 0;
        }

        /* 3. 内容滚动区域：确保背景色是 iOS 设置页的灰色 */
        #viewport {
            flex: 1;
            overflow-y: auto;         
            background: #f2f2f7; /* 手机内部的浅灰色背景 */
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* 灵动岛装饰 (如果 style.css 里没写，这里必须补上) */
        #phone-shell::before {
            content: "";
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 1001;
        }

        /* 底部 Home 条装饰 */
        #phone-shell::after {
            content: "";
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 100px;
            z-index: 1001;
        }

        /* 3. 内容滚动区域：这是解决手机变形的关键 */
        #viewport {
            flex: 1;
            overflow-y: auto;         
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }
        #viewport::-webkit-scrollbar { display: none; }

        /* 内部特定组件样式 */
        .header-title { 
            background: #f2f2f7; 
            padding: 60px 15px 10px; /* 顶部留出灵动岛的空间 */
            font-weight: bold; 
            font-size: 17px; 
            text-align: center;
            position: sticky; /* 让标题在滚动时顶住 */
            top: 0;
            z-index: 100;
        }

        .account-section { 
            display: flex; align-items: center; padding: 15px; 
            background: #fff; margin: 10px 15px; border-radius: 10px; 
            cursor: pointer;
        }
        .account-avatar { 
            width: 60px; height: 60px; background: #c7c7cc; 
            border-radius: 50%; overflow: hidden; margin-right: 15px;
            display: flex; align-items: center; justify-content: center;
        }
        .account-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .ios-list { background: #fff; margin: 10px 15px 20px; border-radius: 10px; }
        .ios-item { 
            display: flex; align-items: center; padding: 12px 15px; 
            border-bottom: 0.5px solid #e5e5ea; cursor: pointer;
        }
        .arrow-r { margin-left: auto; color: #c7c7cc; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="header-title">
                <span style="position:absolute; left:15px; color:#007aff; cursor:pointer" onclick="window.location.href='index.html?from=settings'">〈 返回</span>
                <span>设置</span>
            </div>

            <div class="account-section" id="account-btn" onclick="handleAccountClick()">
                <div class="account-avatar" id="avatar-container">
                    <span id="default-icon">👤</span>
                </div>
                <div class="account-info">
                    <b id="user-display-name">请登录</b>
                    <p id="user-display-desc">Apple 账户、iCloud 等</p>
                </div>
                <span class="arrow-r">〉</span>
            </div>

            <div class="ios-list">
                <div class="ios-item"><span>✈️ 飞行模式</span><span class="arrow-r">〉</span></div>
                <div class="ios-item"><span>📶 无线局域网</span><span class="arrow-r">〉</span></div>
                <div class="ios-item"><span>⚙️ 通用</span><span class="arrow-r">〉</span></div>
                <div class="ios-item"><span>🔔 通知</span><span class="arrow-r">〉</span></div>
                <div class="ios-item"><span>🔊 声音与触感</span><span class="arrow-r">〉</span></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const currentUser = localStorage.getItem('currentUser');
            const savedAvatar = localStorage.getItem('savedAvatar');
            
            if (isLoggedIn === 'true' && currentUser) {
                document.getElementById('user-display-name').innerText = currentUser;
                document.getElementById('user-display-desc').innerText = "Apple 账户、iCloud、App Store";
                if (savedAvatar) {
                    const container = document.getElementById('avatar-container');
                    container.innerHTML = `<img src="${savedAvatar}" alt="avatar">`;
                }
            }
        });

        function handleAccountClick() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            window.location.href = (isLoggedIn === 'true') ? 'profile.html' : 'login.html';
        }
    </script>
</body>
</html>

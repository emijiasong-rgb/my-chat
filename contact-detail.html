<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>详细资料</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: rgba(255,255,255,0.8);
            --text: #1c1c1e;
            --text-secondary: #636366;
            --text-tertiary: #8e8e93;
            --accent: #5b6abf;
            --separator: rgba(0,0,0,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:'Noto Sans SC',-apple-system,sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:#f2f2f7; border-radius:0; display:flex; flex-direction:column; overflow:hidden;
            position:relative;
        }

        /* 状态栏 */
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 24px; font-size:12px; font-weight:600; color:#000;
            background:transparent;
        }
        .status-icons { display:flex; align-items:center; gap:6px; }
        #battery-container { display:flex; align-items:center; gap:3px; }

        #viewport { flex:1; overflow-y:auto; }
        #viewport::-webkit-scrollbar { display:none; }

        /* 导航栏 */
        .nav-bar {
            display:flex; align-items:center; padding:8px 16px;
            background:transparent; position:sticky; top:0; z-index:10;
        }
        .nav-back {
            width:36px; height:36px; border-radius:50%;
            background:rgba(255,255,255,0.8); backdrop-filter:blur(20px);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; font-size:18px; color:var(--text);
        }
        .nav-title { flex:1; text-align:center; font-size:17px; font-weight:600; margin-right:36px; }

        /* 头像区 - 大卡片 */
        .hero-card {
            background:var(--card-bg); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
            border:1px solid rgba(255,255,255,0.6); border-radius:24px;
            margin:12px 16px; padding:32px 20px 24px;
            text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.06);
        }
        .hero-avatar {
            width:88px; height:88px; border-radius:50%; object-fit:cover;
            background:#e8e8ed; margin-bottom:14px;
            box-shadow:0 4px 16px rgba(0,0,0,0.08);
        }
        .hero-name-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:4px; }
        .hero-name { font-size:24px; font-weight:700; color:var(--text); }
        .hero-gender { font-size:18px; }
        .hero-subtitle { font-size:13px; color:var(--text-tertiary); }
        .hero-divider {
            width:40px; height:2px; background:var(--separator);
            margin:16px auto 12px; border-radius:2px;
        }
        .hero-id { font-size:12px; color:var(--text-tertiary); }

        /* 信息卡片 */
        .info-card {
            background:var(--card-bg); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
            border:1px solid rgba(255,255,255,0.6); border-radius:20px;
            margin:0 16px 10px; padding:4px 0;
            box-shadow:0 4px 20px rgba(0,0,0,0.04);
        }
        .info-row {
            display:flex; align-items:center; padding:13px 18px;
            border-bottom:0.5px solid rgba(0,0,0,0.04);
        }
        .info-row:last-child { border-bottom:none; }
        .info-icon { width:28px; font-size:16px; text-align:center; margin-right:12px; flex-shrink:0; }
        .info-label { font-size:14px; color:var(--text-secondary); width:60px; flex-shrink:0; }
        .info-value { flex:1; font-size:14px; color:var(--text); text-align:right; font-weight:500; }

        /* 操作卡片 */
        .action-card {
            background:var(--card-bg); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
            border:1px solid rgba(255,255,255,0.6); border-radius:20px;
            margin:0 16px 10px; padding:4px 0;
            box-shadow:0 4px 20px rgba(0,0,0,0.04);
        }
        .action-row {
            display:flex; align-items:center; padding:14px 18px;
            border-bottom:0.5px solid rgba(0,0,0,0.04); cursor:pointer;
            transition:background 0.15s;
        }
        .action-row:last-child { border-bottom:none; }
        .action-row:active { background:rgba(0,0,0,0.02); }
        .action-icon-box {
            width:32px; height:32px; border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            font-size:16px; margin-right:12px; flex-shrink:0;
        }
        .action-icon-remark { background:#e8f5e9; }
        .action-icon-edit { background:#e3f2fd; }
        .action-icon-moments { background:#fce4ec; }
        .action-label { font-size:15px; color:var(--text); flex:1; }
        .action-sub { font-size:13px; color:var(--text-tertiary); margin-right:6px; }
        .action-arrow { color:#c7c7cc; font-size:15px; }

        /* 按钮 */
        .btn-container { padding:20px 16px 30px; }
        .chat-btn {
            width:100%; padding:14px; background:var(--accent); color:#fff;
            border:none; border-radius:14px; font-size:17px; font-weight:600;
            cursor:pointer; box-shadow:0 4px 16px rgba(91,106,191,0.3);
            transition:all 0.2s;
        }
        .chat-btn:active { transform:scale(0.97); opacity:0.9; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span id="network-icon">
                    <svg width="16" height="11" viewBox="0 0 18 12" fill="currentColor">
                        <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                        <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                        <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                        <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                    </svg>
                </span>
                <span id="battery-container">
                    <svg id="battery-icon" width="22" height="11" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div id="viewport">
            <!-- 导航栏 -->
            <div class="nav-bar">
                <div class="nav-back" onclick="goBackToChat()">〈</div>
                <span class="nav-title">详细资料</span>
            </div>

            <!-- 头像卡片 -->
            <div class="hero-card">
                <img class="hero-avatar" id="detail-avatar" src="" alt="">
                <div class="hero-name-row">
                    <span class="hero-name" id="detail-name"></span>
                    <span class="hero-gender" id="detail-gender"></span>
                </div>
                <div class="hero-subtitle" id="detail-region"></div>
                <div class="hero-divider"></div>
                <div class="hero-id" id="detail-relation"></div>
            </div>

            <!-- 信息卡片 -->
            <div class="info-card">
                <div class="info-row">
                    <span class="info-icon">📍</span>
                    <span class="info-label">地区</span>
                    <span class="info-value" id="detail-location">-</span>
                </div>
                <div class="info-row">
                    <span class="info-icon">📱</span>
                    <span class="info-label">手机</span>
                    <span class="info-value" id="detail-phone">-</span>
                </div>
                <div class="info-row">
                    <span class="info-icon">💬</span>
                    <span class="info-label">微信号</span>
                    <span class="info-value" id="detail-wechat">-</span>
                </div>
            </div>

            <!-- 操作卡片 -->
            <div class="action-card">
                <div class="action-row" onclick="window.location.href='contact-remark.html?id=' + currentRoleId">
                    <div class="action-icon-box action-icon-remark">📝</div>
                    <span class="action-label">设置备注</span>
                    <span class="action-sub" id="remark-value">未设置</span>
                    <span class="action-arrow">〉</span>
                </div>
                <div class="action-row" onclick="window.location.href='contact-edit.html?id=' + currentRoleId">
                    <div class="action-icon-box action-icon-edit">✏️</div>
                    <span class="action-label">编辑资料</span>
                    <span class="action-arrow">〉</span>
                </div>
                <div class="action-row" onclick="window.location.href='contact-moments.html?id=' + currentRoleId">
                    <div class="action-icon-box action-icon-moments">🟢</div>
                    <span class="action-label">朋友圈</span>
                    <span class="action-arrow">〉</span>
                </div>
            </div>

            <!-- 发消息按钮 -->
            <div class="btn-container">
                <button class="chat-btn" onclick="goBackToChat()">💬 发消息</button>
            </div>
        </div>
    </div>

    <script>
        var currentRoleId = null;

        // 更新时间
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var clockEl = document.getElementById('clock');
            if (clockEl) clockEl.innerText = h + ':' + m;
        }
        setInterval(updateClock, 1000);

        // 更新电池
        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    var level = Math.round(battery.level * 100);
                    var percentEl = document.getElementById('battery-percent');
                    var levelEl = document.getElementById('battery-level');
                    if (percentEl) percentEl.textContent = level + '%';
                    if (levelEl) {
                        levelEl.setAttribute('width', Math.round((level / 100) * 18));
                        levelEl.setAttribute('fill', level <= 20 ? '#ff3b30' : 'currentColor');
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            updateBattery();

            var params = new URLSearchParams(window.location.search);
            currentRoleId = parseInt(params.get('id'));
            if (!currentRoleId) { window.location.href = 'chat.html'; return; }
            loadRoleDetail();
        });

        function loadRoleDetail() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var role = null;
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === currentRoleId) { role = roles[i]; break; }
            }
            if (!role) { window.location.href = 'chat.html'; return; }

            document.getElementById('detail-avatar').src = role.avatar || '';
            document.getElementById('detail-name').innerText = role.remark || role.name || '未设置';
            document.getElementById('detail-gender').innerText = role.gender || '';
            
            var regionText = (role.userLocation || '') + (role.userName ? ' · ' + role.userName : '');
            document.getElementById('detail-region').innerText = regionText || '';
            document.getElementById('detail-relation').innerText = role.relation || '';

            document.getElementById('detail-location').innerText = role.userLocation || '未设置';
            document.getElementById('detail-phone').innerText = role.phone || '未设置';
            document.getElementById('detail-wechat').innerText = role.wechatId || '未设置';

            var remarkEl = document.getElementById('remark-value');
            if (role.remark) {
                remarkEl.innerText = role.remark;
                remarkEl.style.color = '#000';
            }
        }

        function goBackToChat() {
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>联系人详情</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --text: #1c1c1e;
            --text-secondary: #636366;
            --text-tertiary: #8e8e93;
            --accent: #576b95;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:#f2f2f7; border-radius:0; display:flex; flex-direction:column; overflow:hidden;
        }
        #viewport { flex:1; overflow-y:auto; background:#f2f2f7; }
        #viewport::-webkit-scrollbar { display:none; }

        .nav-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 16px; background:rgba(255,255,255,0.9);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border-bottom:0.5px solid #e5e5ea; position:sticky; top:0; z-index:10;
        }
        .nav-back { color:#000; font-size:17px; cursor:pointer; }
        .nav-title { font-size:17px; font-weight:600; }

        /* 头像区 */
        .profile-header {
            background:#fff; padding:30px 20px 25px; text-align:center;
            margin-bottom:10px;
        }
        .profile-avatar {
            width:80px; height:80px; border-radius:50%; object-fit:cover;
            margin-bottom:12px; background:#e0e0e0;
        }
        .profile-name-row { display:flex; align-items:center; justify-content:center; gap:6px; }
        .profile-name { font-size:22px; font-weight:600; }
        .profile-gender { font-size:16px; }
        .profile-region { font-size:13px; color:var(--text-secondary); margin-top:4px; }

        /* 信息区 */
        .info-section {
            background:#fff; margin-bottom:10px;
            border-top:0.5px solid #e5e5ea; border-bottom:0.5px solid #e5e5ea;
        }
        .info-row {
            display:flex; align-items:center; padding:14px 16px;
            border-bottom:0.5px solid #f0f0f0;
        }
        .info-row:last-child { border-bottom:none; }
        .info-label { width:80px; font-size:15px; color:var(--text-secondary); flex-shrink:0; }
        .info-value { flex:1; font-size:15px; color:var(--text); text-align:right; }

        /* 操作区 */
        .action-section {
            background:#fff; margin-bottom:10px;
            border-top:0.5px solid #e5e5ea; border-bottom:0.5px solid #e5e5ea;
        }
        .action-row {
            display:flex; align-items:center; padding:14px 16px;
            border-bottom:0.5px solid #f0f0f0; cursor:pointer;
            font-size:15px; color:var(--text);
        }
        .action-row:last-child { border-bottom:none; }
        .action-row:active { background:#f5f5f5; }
        .action-icon { margin-right:12px; font-size:18px; width:24px; text-align:center; }
        .action-value { flex:1; text-align:right; color:var(--text-tertiary); font-size:14px; margin-right:4px; }
        .action-arrow { color:#c7c7cc; font-size:16px; }

        /* 发消息按钮 */
        .msg-btn-container { padding:20px 16px; }
        .msg-btn {
            width:100%; padding:12px; background:#07c160; color:#fff;
            border:none; border-radius:8px; font-size:17px; font-weight:500; cursor:pointer;
        }
        .msg-btn:active { background:#06b056; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="nav-bar">
                <span class="nav-back" onclick="goBackToChat()">〈</span>
                <span class="nav-title">详细资料</span>
                <span style="width:30px;"></span>
            </div>

            <div class="profile-header">
                <img class="profile-avatar" id="detail-avatar" src="" alt="">
                <div class="profile-name-row">
                    <span class="profile-name" id="detail-name"></span>
                    <span class="profile-gender" id="detail-gender"></span>
                </div>
                <div class="profile-region" id="detail-region"></div>
            </div>

            <div class="info-section">
                <div class="info-row">
                    <span class="info-label">地区</span>
                    <span class="info-value" id="detail-location">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">手机号</span>
                    <span class="info-value" id="detail-phone">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">微信号</span>
                    <span class="info-value" id="detail-wechat">-</span>
                </div>
            </div>

            <div class="action-section">
                <div class="action-row" onclick="window.location.href='contact-remark.html?id=' + currentRoleId">
                    <span class="action-icon">📝</span>
                    <span>设置备注</span>
                    <span class="action-value" id="remark-value"></span>
                    <span class="action-arrow">〉</span>
                </div>
                <div class="action-row" onclick="window.location.href='contact-edit.html?id=' + currentRoleId">
                    <span class="action-icon">✏️</span>
                    <span>编辑资料</span>
                    <span class="action-arrow">〉</span>
                </div>
                <div class="action-row" onclick="window.location.href='contact-moments.html?id=' + currentRoleId">
                    <span class="action-icon">🟢</span>
                    <span>朋友圈</span>
                    <span class="action-arrow">〉</span>
                </div>
            </div>

            <div class="msg-btn-container">
                <button class="msg-btn" onclick="goBackToChat()">发消息</button>
            </div>
        </div>
    </div>

    <script>
        var currentRoleId = null;

        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            currentRoleId = parseInt(params.get('id'));
            if (!currentRoleId) { window.location.href = 'chat.html'; return; }
            loadRoleDetail();
        });

        function loadRoleDetail() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            var role = null;
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === currentRoleId) { role = roles[i]; break; }
            }
            if (!role) { window.location.href = 'chat.html'; return; }

            // 头像
            document.getElementById('detail-avatar').src = role.avatar || '';
            
            // 名字（优先显示备注）
            var displayName = role.remark || role.name || '未设置';
            document.getElementById('detail-name').innerText = displayName;
            
            // 性别
            document.getElementById('detail-gender').innerText = role.gender || '';
            
            // 地区和你的名字
            var regionText = '';
            if (role.userLocation) regionText += role.userLocation;
            if (role.userName) regionText += (regionText ? ' · ' : '') + role.userName;
            document.getElementById('detail-region').innerText = regionText || '';

            // 信息区
            document.getElementById('detail-location').innerText = role.userLocation || '未设置';
            document.getElementById('detail-phone').innerText = role.phone || '未设置';
            document.getElementById('detail-wechat').innerText = role.wechatId || '未设置';

            // 备注显示
            var remarkEl = document.getElementById('remark-value');
            if (role.remark) {
                remarkEl.innerText = role.remark;
                remarkEl.style.color = '#000';
            } else {
                remarkEl.innerText = '未设置';
                remarkEl.style.color = '#8e8e93';
            }

            if (role.tags && role.tags.length > 0) {
                remarkEl.innerText = role.remark || role.tags.join('、');
            }
        }

        function goBackToChat() {
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>

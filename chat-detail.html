<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天</title>
    <style>
        :root {
            --bg: #ededed;
            --white: #fff;
            --text: #191919;
            --text-secondary: #888;
            --bubble-user: #95ec69;
            --bubble-ai: #fff;
            --green: #07c160;
            --separator: #d9d9d9;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,'Inter','Noto Sans SC',sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }

        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:#000;
            background:var(--bg);
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        #battery-container { display:flex; align-items:center; gap:2px; }
        #battery-percent { font-size:12px; }

        .chat-nav {
            display:flex; align-items:center; padding:8px 12px;
            background:var(--bg); border-bottom:0.5px solid var(--separator);
            gap:8px;
        }
        .back-btn { font-size:16px; color:#000; cursor:pointer; text-decoration:none; padding:6px 2px; }
        .chat-nav-name { font-size:17px; font-weight:600; color:#000; flex:1; text-align:center; margin-right:24px; transition:color 0.3s; }
        .chat-nav-name.typing { color:#888; }
        .more-btn {
            width:28px; height:28px; border:none; background:none;
            font-size:18px; cursor:pointer; opacity:0.6; padding:0; letter-spacing:1px;
        }

        .messages-container {
            flex:1; overflow-y:auto; padding:12px 12px;
            display:flex; flex-direction:column; gap:2px;
        }
        .messages-container::-webkit-scrollbar { display:none; }

        .msg-wrapper {
            display:flex; gap:8px; max-width:75%; margin-bottom:16px;
            animation:msgIn 0.3s ease;
        }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .msg-wrapper.user { align-self:flex-end; flex-direction:row-reverse; }
        .msg-wrapper.ai { align-self:flex-start; }

        .msg-avatar { width:36px; height:36px; border-radius:4px; object-fit:cover; flex-shrink:0; }
        .msg-bubble {
            padding:9px 12px; border-radius:6px; font-size:15px;
            line-height:1.45; word-break:break-word;
        }
        .msg-wrapper.ai .msg-bubble { background:var(--bubble-ai); border:0.5px solid #e0e0e0; color:#000; }
        .msg-wrapper.user .msg-bubble { background:var(--bubble-user); color:#000; }

        /* 三个点跳动 */
        .typing-dots { display:inline-flex; gap:3px; padding:3px 0; }
        .typing-dots span { width:6px; height:6px; background:#b0b0b0; border-radius:50%; animation:bounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.3; } 30% { transform:translateY(-5px); opacity:1; } }

        .input-area {
            display:flex; gap:8px; padding:8px 10px 12px; align-items:center;
            border-top:0.5px solid var(--separator); background:var(--bg);
        }
        .input-area input {
            flex:1; padding:10px 12px;
            background:#fff; border:0.5px solid #ddd; border-radius:6px;
            font-size:15px; outline:none; color:#000;
        }
        .input-area input:focus { border-color:var(--green); }
        .input-area input::placeholder { color:#b0b0b0; }
        .send-btn {
            padding:8px 16px; background:var(--green); color:#fff;
            border:none; border-radius:6px; font-size:14px; cursor:pointer; font-weight:500;
        }
        .send-btn:active { background:#06b056; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="15" height="10" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="20" height="10" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div class="chat-nav">
            <a href="chat.html" class="back-btn">〈</a>
            <span class="chat-nav-name" id="chat-nav-name">测试</span>
            <button class="more-btn" onclick="editCurrentRole()">⋯</button>
        </div>

        <div class="messages-container" id="messages-container"></div>
        <div class="input-area">
            <input type="text" id="chat-input" placeholder="" onkeydown="if(event.key==='Enter')sendMsg()">
            <button class="send-btn" onclick="sendMsg()">发送</button>
        </div>
    </div>

    <script>
        var currentChatRole = null;
        var currentApi = null;
        var roleId = null;
        var messages = [];

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000);

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    var pel = document.getElementById('battery-percent');
                    var lel = document.getElementById('battery-level');
                    if (pel) pel.textContent = lvl + '%';
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }

        function getActiveApi() { var apis = JSON.parse(localStorage.getItem('saved_apis') || '[]'); return apis.length > 0 ? apis[apis.length - 1] : null; }

        document.addEventListener('DOMContentLoaded', function() {
            updateClock(); updateBattery();
            var params = new URLSearchParams(window.location.search);
            roleId = parseInt(params.get('id'));
            if (roleId) { loadRole(); } else { loadDemoMessages(); }
        });

        function loadRole() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === roleId) { currentChatRole = roles[i]; break; } }
            if (!currentChatRole) { loadDemoMessages(); return; }
            currentChatRole.unread = 0; updateRoleMessages();
            currentApi = getActiveApi();
            document.getElementById('chat-nav-name').innerText = currentChatRole.remark || currentChatRole.name;
            messages = currentChatRole.messages || [];
            renderMessages();
        }

        function editCurrentRole() { if (currentChatRole) window.location.href = 'contact-detail.html?id=' + currentChatRole.id; }

        function loadDemoMessages() {
            messages = [
                { type: 'ai', text: '送你一张亲属卡\n额度5200.00元，已领取', time: Date.now() - 500000 },
                { type: 'user', text: '绑定好了。', time: Date.now() - 400000 },
                { type: 'ai', text: '炸鸡麻辣烫螺蛳粉，想吃就直接用这个买。', time: Date.now() - 300000 },
                { type: 'user', text: '你领取了测试的亲属卡', time: Date.now() - 100000 },
                { type: 'ai', text: '想和你建立情侣关系\n和我成为情侣，让我们记录每日点滴 ✨', time: Date.now() }
            ];
            renderMessages();
        }

        function renderMessages() {
            var container = document.getElementById('messages-container');
            if (!messages || messages.length === 0) { container.innerHTML = ''; return; }
            var html = '';
            for (var i = 0; i < messages.length; i++) {
                var msg = messages[i];
                var avatar = msg.type === 'ai' ? (currentChatRole ? currentChatRole.avatar : '') : '';
                var isTyping = msg.text.indexOf('typing-dots') !== -1;
                var content = isTyping ? msg.text : escapeHtml(msg.text);
                html += '<div class="msg-wrapper ' + msg.type + '">' + (msg.type === 'ai' ? '<img class="msg-avatar" src="' + (avatar || '') + '" alt="">' : '') + '<div class="msg-bubble">' + content + '</div>' + (msg.type === 'user' ? '<img class="msg-avatar" src="默认头像.jpg" alt="">' : '') + '</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendMsg() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text) return;

            // 演示模式
            if (!currentChatRole) {
                messages.push({ type: 'user', text: text, time: Date.now() });
                input.value = ''; renderMessages();
                showTypingDemo();
                messages.push({ type: 'ai', text: '<span class="typing-dots"><span></span><span></span><span></span></span>', time: Date.now() });
                renderMessages();
                setTimeout(function() {
                    messages.pop();
                    messages.push({ type: 'ai', text: generateLocalReply(), time: Date.now() });
                    renderMessages();
                    hideTypingDemo();
                }, 1500);
                return;
            }

            // 角色模式
            currentChatRole.messages = messages;
            currentChatRole.messages.push({ type: 'user', text: text, time: Date.now() });
            messages = currentChatRole.messages;
            input.value = ''; updateRoleMessages(); renderMessages();
            callApiForReply(text);
        }

        function showTypingDemo() {
            var el = document.getElementById('chat-nav-name');
            if (el) { el.innerText = '对方正在输入...'; el.classList.add('typing'); }
        }
        function hideTypingDemo() {
            var el = document.getElementById('chat-nav-name');
            if (el) { el.innerText = '测试'; el.classList.remove('typing'); }
        }

        function callApiForReply(userMsg) {
            // 显示"正在输入中..."
            showTyping();
            messages.push({ type: 'ai', text: '<span class="typing-dots"><span></span><span></span><span></span></span>', time: Date.now() });
            currentChatRole.messages = messages;
            updateRoleMessages(); renderMessages();

            if (!currentApi) {
                setTimeout(function() {
                    messages.pop();
                    var reply = generateLocalReply();
                    messages.push({ type: 'ai', text: reply, time: Date.now() });
                    currentChatRole.messages = messages;
                    currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                    updateRoleMessages(); renderMessages();
                    hideTyping();
                }, 1500);
                return;
            }

            var apiMessages = [{ role: 'system', content: buildPrompt() }];
            var start = Math.max(0, messages.length - 12);
            for (var i = start; i < messages.length; i++) {
                var m = messages[i];
                if (m.text.indexOf('typing-dots') === -1) apiMessages.push({ role: m.type === 'user' ? 'user' : 'assistant', content: m.text });
            }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', currentApi.url + '/v1/chat/completions', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('Authorization', 'Bearer ' + currentApi.key);
            xhr.onload = function() {
                messages.pop();
                var reply = '...';
                if (xhr.status >= 200 && xhr.status < 300) {
                    var data = JSON.parse(xhr.responseText);
                    reply = data.choices && data.choices[0] ? data.choices[0].message.content : '...';
                } else { reply = '错误 ' + xhr.status; }
                messages.push({ type: 'ai', text: reply, time: Date.now() });
                currentChatRole.messages = messages;
                currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                updateRoleMessages(); renderMessages();
                hideTyping();
            };
            xhr.onerror = function() {
                messages.pop();
                messages.push({ type: 'ai', text: '网络错误', time: Date.now() });
                currentChatRole.messages = messages;
                currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                updateRoleMessages(); renderMessages();
                hideTyping();
            };
            xhr.send(JSON.stringify({ model: currentApi.model, messages: apiMessages, temperature: 0.8, max_tokens: 500 }));
        }

        function showTyping() {
            var el = document.getElementById('chat-nav-name');
            if (el && currentChatRole) {
                el.innerText = (currentChatRole.remark || currentChatRole.name) + ' · 正在输入中...';
                el.classList.add('typing');
            }
        }
        function hideTyping() {
            var el = document.getElementById('chat-nav-name');
            if (el && currentChatRole) {
                el.innerText = currentChatRole.remark || currentChatRole.name;
                el.classList.remove('typing');
            }
        }

        function buildPrompt() {
            var r = currentChatRole;
            var nick = r.userNickname || r.userName || '你';
            return '扮演角色：\n【名字】' + r.name + '\n【性格】' + (r.personality||'') + '\n【背景】' + (r.background||'') + '\n【口头禅】' + (r.catchphrase||'') + '\n【关系】' + r.relation + '\n【称呼】' + nick + '\n要求：保持角色、自然、称呼用户"' + nick + '"';
        }

        function generateLocalReply() {
            var replies = ['🍗 炸鸡安排上！', '🌶️ 麻辣烫加辣！', '🍜 螺蛳粉加酸笋！', '💳 亲属卡随便刷~', '😋 还想吃啥？'];
            return replies[Math.floor(Math.random() * replies.length)];
        }

        function updateRoleMessages() {
            if (!currentChatRole) return;
            currentChatRole.messages = messages;
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === currentChatRole.id) { roles[i] = currentChatRole; break; } }
            localStorage.setItem('chat_roles', JSON.stringify(roles));
        }

        function escapeHtml(text) { var d = document.createElement('div'); d.innerText = text || ''; return d.innerHTML; }
    </script>
</body>
</html>

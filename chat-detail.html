<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天</title>
    <style>
        :root {
            --bg: #fff;
            --bubble-user: #95ec69;
            --bubble-ai: #fff;
            --green: #07c160;
            --separator: #e5e5e5;
            --text: #191919;
            --time-grey: #b0b0b0;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:#000; background:var(--bg);
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        #battery-container { display:flex; align-items:center; gap:2px; }
        #battery-percent { font-size:12px; }
        .chat-nav {
            display:flex; align-items:center; padding:8px 12px;
            background:var(--bg); border-bottom:0.5px solid var(--separator);
            position:relative; height:44px;
        }
        .back-arrow {
            font-size:18px; color:#000; cursor:pointer; text-decoration:none;
            padding:6px 4px; font-weight:400; z-index:1;
        }
        .chat-nav-name {
            font-size:17px; font-weight:600; color:#000;
            position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap;
        }
        .three-dots {
            width:28px; height:28px; border:none; background:none;
            font-size:18px; cursor:pointer; opacity:0.6; padding:0;
            letter-spacing:2px; color:#000; margin-left:auto; z-index:1;
        }
        .messages-container {
            flex:1; overflow-y:auto; padding:12px 12px;
            display:flex; flex-direction:column; gap:2px; background:var(--bg);
        }
        .messages-container::-webkit-scrollbar { display:none; }
        .msg-row-ai {
            display:flex; flex-direction:row; gap:8px; max-width:75%;
            margin-bottom:4px; animation:msgIn 0.3s ease;
        }
        .msg-row-user {
            display:flex; flex-direction:row-reverse; gap:8px; max-width:75%;
            margin-bottom:4px; animation:msgIn 0.3s ease;
            align-self:flex-end;
        }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .msg-avatar {
            width:36px; height:36px; border-radius:50%; object-fit:cover;
            flex-shrink:0; background:#e0e0e0;
        }
        .msg-content { display:flex; flex-direction:column; }
        .msg-content.ai { align-items:flex-start; }
        .msg-content.user { align-items:flex-end; }
        .msg-bubble {
            padding:9px 14px; border-radius:18px; font-size:15px;
            line-height:1.45; word-break:break-word;
        }
        .msg-content.ai .msg-bubble {
            background:var(--bubble-ai); border:0.5px solid #e0e0e0; color:#000;
            border-top-left-radius:4px;
        }
        .msg-content.user .msg-bubble {
            background:var(--bubble-user); color:#000;
            border-top-right-radius:4px;
        }
        .msg-content.user.blocked .msg-bubble {
            position:relative;
        }
        .msg-content.user.blocked .msg-bubble::after {
            content:"!"; position:absolute; right:-8px; top:-8px;
            width:18px; height:18px; background:#ff3b30; color:#fff;
            border-radius:50%; font-size:11px; font-weight:700;
            display:flex; align-items:center; justify-content:center;
        }
        .blocked-notice {
            font-size:11px; color:#ff3b30; text-align:right; margin-top:2px;
        }
        .msg-translation {
            font-size:12px; color:#888; margin-top:4px; padding:6px 10px;
            background:rgba(0,0,0,0.03); border-radius:8px; font-style:italic;
        }
        .msg-time { font-size:11px; color:var(--time-grey); margin-top:2px; padding:0 4px; }
        .typing-dots { display:inline-flex; gap:3px; padding:3px 0; }
        .typing-dots span {
            width:6px; height:6px; background:#b0b0b0; border-radius:50%;
            animation:bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce {
            0%,60%,100% { transform:translateY(0); opacity:0.3; }
            30% { transform:translateY(-5px); opacity:1; }
        }
        .input-area {
            display:flex; gap:8px; padding:8px 10px 12px; align-items:center;
            border-top:0.5px solid var(--separator); background:var(--bg);
        }
        .voice-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .voice-icon svg { width:22px; height:22px; stroke:#000; fill:none; }
        .input-area input {
            flex:1; padding:10px 12px;
            background:#f7f7f8; border:0.5px solid #e0e0e0; border-radius:20px;
            font-size:15px; outline:none; color:#000;
        }
        .input-area input:focus { border-color:var(--green); }
        .input-area input::placeholder { color:#b0b0b0; }
        .plus-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; color:#000; opacity:0.6; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="15" height="10" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="20" height="10" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div class="chat-nav">
            <a href="chat.html" class="back-arrow" id="back-link">←</a>
            <span class="chat-nav-name" id="chat-nav-name"></span>
            <button class="three-dots" onclick="openMore()">···</button>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="input-area">
            <div class="voice-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                    <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </div>
            <input type="text" id="chat-input" placeholder="" onkeydown="if(event.key==='Enter')sendMsg()">
            <div class="plus-icon">+</div>
        </div>
    </div>

    <script>
        var currentChatRole = null;
        var currentApi = null;
        var roleId = null;
        var isOnChatPage = false;

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000);

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    document.getElementById('battery-percent').textContent = lvl + '%';
                    var lel = document.getElementById('battery-level');
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }

        function getActiveApi() {
            var apis = JSON.parse(localStorage.getItem('saved_apis') || '[]');
            return apis.length > 0 ? apis[apis.length - 1] : null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateClock(); updateBattery();
            var params = new URLSearchParams(window.location.search);
            roleId = parseInt(params.get('id'));
            if (!roleId) { window.location.href = 'chat.html'; return; }
            loadRole();
            isOnChatPage = true;

            document.getElementById('back-link').addEventListener('click', function(e) {
                e.preventDefault();
                isOnChatPage = false;
                if (currentChatRole) { currentChatRole.unread = 0; saveRoleToStorage(); }
                window.location.href = 'chat.html';
            });
        });

        function loadRole() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === roleId) { currentChatRole = roles[i]; break; }
            }
            if (!currentChatRole) { window.location.href = 'chat.html'; return; }
            currentChatRole.unread = 0;
            saveRoleToStorage();
            currentApi = getActiveApi();
            document.getElementById('chat-nav-name').innerText = currentChatRole.remark || currentChatRole.name;
            renderMessages();
        }

        function openMore() {
            if (currentChatRole) {
                window.location.href = 'chat-settings.html?id=' + currentChatRole.id;
            }
        }

        function formatTime(ts) {
            var d = new Date(ts);
            return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        }

        function renderMessages() {
            var container = document.getElementById('messages-container');
            var msgs = currentChatRole.messages || [];
            if (msgs.length === 0) { container.innerHTML = ''; return; }
            var html = '';
            var isBlocked = currentChatRole.blocked;
            var lang = currentChatRole.language || '中文';
            var translate = currentChatRole.translate;

            for (var i = 0; i < msgs.length; i++) {
                var msg = msgs[i];
                var isTyping = msg.text.indexOf('typing-dots') !== -1;
                var text = isTyping ? msg.text : escapeHtml(msg.text);
                var timeStr = msg.time ? formatTime(msg.time) : '';

                if (msg.type === 'ai') {
                    var roleImg = currentChatRole.avatar || '';
                    html += '<div class="msg-row-ai">';
                    html += '<img class="msg-avatar" src="' + roleImg + '" alt="">';
                    html += '<div class="msg-content ai">';
                    html += '<div class="msg-bubble">' + text + '</div>';
                    // 翻译
                    if (lang !== '中文' && translate && !isTyping && msg.originalText) {
                        html += '<div class="msg-translation">' + escapeHtml(msg.originalText) + '</div>';
                    }
                    if (timeStr && !isTyping) html += '<div class="msg-time">' + timeStr + '</div>';
                    html += '</div></div>';
                } else {
                    var userImg = localStorage.getItem('savedAvatar') || '默认头像.jpg';
                    var blockedClass = isBlocked ? ' blocked' : '';
                    html += '<div class="msg-row-user">';
                    html += '<img class="msg-avatar" src="' + userImg + '" alt="">';
                    html += '<div class="msg-content user' + blockedClass + '">';
                    html += '<div class="msg-bubble">' + text + '</div>';
                    if (isBlocked) {
                        html += '<div class="blocked-notice">已被对方拉黑，无法发送消息</div>';
                    }
                    if (timeStr && !isTyping) html += '<div class="msg-time">' + timeStr + '</div>';
                    html += '</div></div>';
                }
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendMsg() {
            if (currentChatRole.blocked) {
                alert('你已被对方拉黑，无法发送消息');
                return;
            }
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text) return;
            currentChatRole.messages.push({ type: 'user', text: text, time: Date.now() });
            input.value = '';
            saveRoleToStorage();
            renderMessages();
            callApiForReply(text);
        }

        function callApiForReply(userMsg) {
            showTyping();
            currentChatRole.messages.push({ type: 'ai', text: '<span class="typing-dots"><span></span><span></span><span></span></span>', time: Date.now() });
            saveRoleToStorage();
            renderMessages();
            if (!currentApi) {
                setTimeout(function() {
                    currentChatRole.messages.pop();
                    var reply = generateLocalReply();
                    currentChatRole.messages.push({ type: 'ai', text: reply, time: Date.now() });
                    if (!isOnChatPage && !currentChatRole.muted) {
                        currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                    }
                    saveRoleToStorage(); renderMessages(); hideTyping();
                }, 1500);
                return;
            }

            var apiUrl = currentApi.url + '/v1/chat/completions';
            var apiMessages = [{ role: 'system', content: buildPrompt() }];
            var start = Math.max(0, currentChatRole.messages.length - 12);
            for (var i = start; i < currentChatRole.messages.length; i++) {
                var m = currentChatRole.messages[i];
                if (m.text.indexOf('typing-dots') === -1) apiMessages.push({ role: m.type === 'user' ? 'user' : 'assistant', content: m.text });
            }
            tryRequest(apiUrl, apiMessages, 0);
        }

        function tryRequest(url, messages, retryCount) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('Authorization', 'Bearer ' + currentApi.key);
            xhr.onload = function() {
                currentChatRole.messages.pop();
                if (xhr.status >= 200 && xhr.status < 300) {
                    var data = JSON.parse(xhr.responseText);
                    var reply = data.choices && data.choices[0] ? data.choices[0].message.content : '无回复';
                    // 翻译处理
                    var lang = currentChatRole.language || '中文';
                    if (lang !== '中文' && currentChatRole.translate) {
                        currentChatRole.messages.push({ type: 'ai', text: reply, originalText: reply, time: Date.now() });
                    } else {
                        currentChatRole.messages.push({ type: 'ai', text: reply, time: Date.now() });
                    }
                } else if (retryCount === 0) {
                    tryRequest(currentApi.url + '/chat/completions', messages, 1);
                    return;
                } else {
                    currentChatRole.messages.push({ type: 'ai', text: '错误 ' + xhr.status, time: Date.now() });
                }
                if (!isOnChatPage && !currentChatRole.muted) {
                    currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                    showNotification();
                }
                saveRoleToStorage(); renderMessages(); hideTyping();
            };
            xhr.onerror = function() {
                if (retryCount === 0) { tryRequest(currentApi.url + '/chat/completions', messages, 1); return; }
                currentChatRole.messages.pop();
                currentChatRole.messages.push({ type: 'ai', text: '网络错误', time: Date.now() });
                if (!isOnChatPage && !currentChatRole.muted) {
                    currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                }
                saveRoleToStorage(); renderMessages(); hideTyping();
            };
            xhr.send(JSON.stringify({ model: currentApi.model, messages: messages, temperature: 0.8, max_tokens: 500 }));
        }

        function showNotification() {
            if (!currentChatRole || currentChatRole.muted) return;
            if ('Notification' in window && Notification.permission === 'granted') {
                var lastMsg = currentChatRole.messages[currentChatRole.messages.length - 1];
                new Notification(currentChatRole.remark || currentChatRole.name, {
                    body: lastMsg.text,
                    icon: currentChatRole.avatar || ''
                });
            }
        }

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        function showTyping() { var el = document.getElementById('chat-nav-name'); if (el) el.innerText = '正在输入中...'; }
        function hideTyping() { var el = document.getElementById('chat-nav-name'); if (el && currentChatRole) el.innerText = currentChatRole.remark || currentChatRole.name; }

        function buildPrompt() {
            var r = currentChatRole;
            var nick = r.userNickname || r.userName || '你';
            var lang = r.language || '中文';
            var p = '你是一个角色：\n【名字】' + r.name + '\n【性格】' + (r.personality||'无') + '\n【背景】' + (r.background||'无') + '\n【口头禅】' + (r.catchphrase||'无') + '\n【关系】' + r.relation + '\n【称呼】' + nick + '\n';
            if (r.userPreference) p += '【偏好】' + r.userPreference + '\n';
            if (lang !== '中文') p += '【回复语言】请用' + lang + '回复\n';
            p += '要求：保持角色、称呼用户"' + nick + '"';
            return p;
        }

        function generateLocalReply() { var r = currentChatRole; var nick = r.userNickname || r.userName || '你'; var replies = ['嗯嗯～', '哈哈', r.catchphrase || '嗯', nick + '！']; return replies[Math.floor(Math.random() * replies.length)]; }

        function saveRoleToStorage() {
            if (!currentChatRole) return;
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === currentChatRole.id) { roles[i] = currentChatRole; break; } }
            localStorage.setItem('chat_roles', JSON.stringify(roles));
        }

        function escapeHtml(text) { var d = document.createElement('div'); d.innerText = text || ''; return d.innerHTML; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天</title>
    <style>
        :root {
            --bg: #fff;
            --separator: #e5e5e5;
            --text: #191919;
            --time-grey: #b0b0b0;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:#000; background:var(--bg);
        }
        .status-icons { display:flex; align-items:center; gap:5px; }
        #battery-container { display:flex; align-items:center; gap:2px; }
        #battery-percent { font-size:12px; }

        .top-nav {
            display:flex; align-items:center; justify-content:center;
            padding:10px 16px; background:var(--bg); position:relative;
            border-bottom:0.5px solid var(--separator);
        }
        .top-nav .back-arrow {
            position:absolute; left:16px; font-size:18px; color:#000;
            cursor:pointer; text-decoration:none; padding:4px; z-index:1;
        }
        .nav-center { display:flex; align-items:center; gap:6px; }
        .nav-title { font-size:17px; font-weight:700; color:#000; }
        .nav-feeling {
            width:22px; height:22px; cursor:pointer; display:flex;
            align-items:center; justify-content:center;
        }
        .nav-feeling svg { width:18px; height:18px; }
        .three-dots {
            position:absolute; right:16px; width:28px; height:28px;
            border:none; background:none; font-size:18px; cursor:pointer;
            opacity:0.6; padding:4px; letter-spacing:2px; color:#000; z-index:1;
        }

        .blocked-banner {
            background:#fff3f3; padding:8px 16px; font-size:12px;
            color:#ff3b30; text-align:center; border-bottom:0.5px solid #ffcccc;
            display:none;
        }
        .blocked-banner.show { display:block; }

        .messages-container {
            flex:1; overflow-y:auto; padding:12px 12px;
            display:flex; flex-direction:column; gap:2px;
            background-size:cover; background-position:center;
            background-repeat:no-repeat;
        }
        .messages-container::-webkit-scrollbar { display:none; }
        .msg-row-ai {
            display:flex; flex-direction:row; gap:8px; max-width:78%;
            margin-bottom:4px; animation:msgIn 0.3s ease;
        }
        .msg-row-user {
            display:flex; flex-direction:row-reverse; gap:8px; max-width:78%;
            margin-bottom:4px; animation:msgIn 0.3s ease;
            align-self:flex-end;
        }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .msg-avatar {
            width:36px; height:36px; border-radius:50%; object-fit:cover;
            flex-shrink:0; background:#e0e0e0;
        }
        .msg-content { display:flex; flex-direction:column; }
        .msg-content.ai { align-items:flex-start; }
        .msg-content.user { align-items:flex-end; }
        .msg-bubble {
            padding:9px 14px; font-size:15px;
            line-height:1.45; word-break:break-word;
        }
        .msg-content.ai .msg-bubble {
            background:#fff; border:0.5px solid #e0e0e0; color:#000;
            border-radius:18px; border-top-left-radius:4px;
        }
        .msg-content.user .msg-bubble {
            background:#95ec69; color:#000;
            border-radius:18px; border-top-right-radius:4px;
        }
        .bubble-shape-round { border-radius:18px !important; }
        .bubble-shape-square { border-radius:4px !important; }
        .bubble-shape-soft { border-radius:12px 18px 12px 18px !important; }
        .bubble-shape-leaf { border-radius:50% 4px 50% 4px !important; }
        .bubble-shape-cloud { border-radius:20px 8px 20px 8px !important; }
        .bubble-shape-pill { border-radius:24px !important; }

        .translation-bubble {
            background:#F0F0F0; border-radius:16px; padding:4px 14px;
            font-size:11px; color:#888; margin-top:3px;
            cursor:pointer; max-width:100%; word-break:break-word;
            display:inline-block;
        }
        .translation-bubble.hidden { display:none; }

        .msg-time { font-size:11px; color:var(--time-grey); margin-top:2px; padding:0 4px; }
        .typing-dots { display:inline-flex; gap:3px; padding:3px 0; }
        .typing-dots span { width:6px; height:6px; background:#b0b0b0; border-radius:50%; animation:bounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.3; } 30% { transform:translateY(-5px); opacity:1; } }

        .blocked-exclamation {
            display:inline-flex; align-items:center; justify-content:center;
            width:18px; height:18px; border-radius:50%; background:#ff3b30;
            color:#fff; font-size:10px; font-weight:700; margin-left:6px;
            cursor:pointer; flex-shrink:0;
        }
        .msg-content.user .msg-bubble-wrap { display:flex; align-items:center; gap:4px; }

        .input-area { display:flex; gap:8px; padding:8px 10px 12px; align-items:center; border-top:0.5px solid var(--separator); background:var(--bg); }
        .voice-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .voice-icon svg { width:22px; height:22px; stroke:#000; fill:none; }
        .input-area input { flex:1; padding:10px 12px; background:#f7f7f8; border:0.5px solid #e0e0e0; border-radius:20px; font-size:15px; outline:none; color:#000; }
        .input-area input:focus { border-color:#07c160; }
        .input-area input::placeholder { color:#b0b0b0; }
        .plus-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; color:#000; opacity:0.6; }
        .input-area input.blocked-input { background:#f0f0f0; color:#999; }

        .unblock-request {
            display:none; padding:8px 16px; text-align:center;
            background:#fff; border-top:0.5px solid var(--separator);
        }
        .unblock-request.show { display:block; }
        .unblock-request button {
            padding:8px 20px; border-radius:16px; border:1px solid #ff3b30;
            background:#fff; color:#ff3b30; font-size:13px; cursor:pointer;
        }

        /* 心声弹窗 */
        .feeling-modal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.4); z-index:2000; justify-content:center; align-items:center;
        }
        .feeling-modal.active { display:flex; animation:fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .feeling-card {
            background:#fff; border-radius:24px; padding:28px 24px;
            width:85%; max-width:320px; text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,0.12);
        }
        .feeling-card .heart-deco { width:40px; height:40px; margin:0 auto 10px; }
        .feeling-card .heart-deco svg { width:40px; height:40px; }
        .feeling-card h3 { font-size:14px; color:#888; margin-bottom:4px; font-weight:500; }
        .feeling-card .fav-number { font-size:28px; font-weight:700; color:#3A3A3A; margin-bottom:6px; }
        .feeling-bar-wrap {
            width:70%; height:6px; background:#f0f0f0; border-radius:3px;
            margin:0 auto 12px; overflow:hidden;
        }
        .feeling-bar-fill { height:100%; border-radius:3px; transition:width 0.5s; }
        .feeling-thought {
            font-size:13px; color:#5B4A7A; line-height:1.6;
            padding:12px; background:#FDF8F2; border-radius:14px;
            margin-bottom:6px; text-align:left;
        }
        .feeling-trigger {
            font-size:11px; color:#aaa; margin-bottom:12px;
            padding:4px 10px; background:#f9f9f9; border-radius:10px;
            display:inline-block;
        }
        .feeling-close {
            padding:8px 24px; border:none; border-radius:20px;
            background:#f0f0f0; color:#888; font-size:14px; cursor:pointer;
        }

        /* 申请卡片 */
        .request-card {
            background:#E0D4F5; border-radius:16px; padding:14px;
            max-width:220px;
        }
        .request-card .request-text { font-size:13px; color:#5B4A7A; margin-bottom:10px; }
        .request-card .request-btns { display:flex; gap:8px; }
        .request-card .request-btns button {
            flex:1; padding:8px; border:none; border-radius:10px;
            font-size:12px; cursor:pointer; font-weight:600;
        }
        .request-card .btn-accept { background:#7CB87C; color:#fff; }
        .request-card .btn-reject { background:#f0f0f0; color:#888; }
        .request-result { font-size:12px; color:#888; margin-top:6px; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <svg width="15" height="10" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.3"/>
                    <rect x="5" y="5" width="3" height="7" rx="0.5" opacity="0.3"/>
                    <rect x="10" y="2" width="3" height="10" rx="0.5" opacity="0.3"/>
                    <rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/>
                </svg>
                <span id="battery-container">
                    <svg width="20" height="10" viewBox="0 0 25 12">
                        <rect x="0" y="0" width="22" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="22" y="3" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect id="battery-level" x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                    </svg>
                    <span id="battery-percent">--%</span>
                </span>
            </div>
        </div>

        <div class="top-nav">
            <a href="chat.html" class="back-arrow" id="back-link">←</a>
            <div class="nav-center">
                <span class="nav-title" id="chat-nav-name"></span>
                <div class="nav-feeling" id="nav-feeling" onclick="showFeelingModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#F7A1C4" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                </div>
            </div>
            <button class="three-dots" onclick="openMore()">···</button>
        </div>

        <div class="blocked-banner" id="blocked-banner">已拉黑该角色，对方无法给你发消息</div>

        <div class="messages-container" id="messages-container"></div>

        <div class="unblock-request" id="unblock-request">
            <button onclick="requestUnblock()">申请解除拉黑</button>
        </div>

        <div class="input-area" id="input-area">
            <div class="voice-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                    <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </div>
            <input type="text" id="chat-input" placeholder="" onkeydown="if(event.key==='Enter')sendMsg()">
            <div class="plus-icon">+</div>
        </div>
    </div>

    <!-- 心声弹窗 -->
    <div class="feeling-modal" id="feeling-modal" onclick="if(event.target===this)closeFeelingModal()">
        <div class="feeling-card">
            <div class="heart-deco">
                <svg viewBox="0 0 24 24" fill="#F7A1C4" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            </div>
            <h3 id="feeling-title">好感度</h3>
            <div class="fav-number" id="fav-number">0%</div>
            <div class="feeling-bar-wrap"><div class="feeling-bar-fill" id="feeling-bar-fill"></div></div>
            <div class="feeling-thought" id="feeling-thought">暂无记录</div>
            <div class="feeling-trigger" id="feeling-trigger" style="display:none;"></div>
            <button class="feeling-close" onclick="closeFeelingModal()">关闭</button>
        </div>
    </div>

    <script>
        var currentChatRole = null;
        var currentApi = null;
        var roleId = null;
        var isOnChatPage = false;

        var MOOD_CONFIG = {
            happy: { prob: 1.0, delay: 800, replyStyle: '热情活泼，多用感叹号和emoji' },
            calm: { prob: 0.95, delay: 1500, replyStyle: '正常礼貌，中性自然' },
            sad: { prob: 0.7, delay: 2500, replyStyle: '冷淡简短，少言寡语' },
            angry: { prob: 0.5, delay: 4000, replyStyle: '暴躁带刺，直接怼人' },
            tired: { prob: 0.4, delay: 5500, replyStyle: '敷衍，说累了困了不想聊' }
        };

        var FEELING_TEXTS = {
            high80: ['和你聊天总是让我很开心✨','最喜欢你了❤️','今天也好想你~','你是我最重要的人','好想一直和你在一起'],
            high60: ['你还挺有趣的，继续聊呀~','和你在一起很舒服','感觉我们很合得来','今天也很开心见到你','你总是能让我笑'],
            mid40: ['嗯...还行吧','今天心情还不错','就这样吧','你最近话变少了','还行，不讨厌'],
            low20: ['最近有点不太想理你...','你是不是在敷衍我？','没什么好说的','你变了','感觉你不太在乎我'],
            low0: ['不是很开心呢...','你最近好冷淡','算了','无所谓了','反正你也不在乎'],
            neg30: ['有点讨厌你了','不想和你说话','你真的很烦','离我远点好吗','看到你就烦'],
            neg50: ['我现在很生气','别来烦我','你让我很失望','已经不想理你了','都是你的错'],
            neg100: ['我讨厌你','已经不想再看到你了','我们到此为止吧','永远不要再见了','你伤害了我'],
            morning: ['早安~今天也要开开心心☀️','早上好呀，昨晚睡得好吗','又是美好的一天'],
            noon: ['中午了，记得吃饭哦🍚','好饿啊，你吃了吗'],
            evening: ['晚上好呀🌙','今天有发生什么好玩的事吗'],
            night: ['这么晚了还不睡？😴','晚安，早点休息','熬夜对身体不好哦'],
            moodHappy: ['今天心情超好~','好想和你分享开心的事✨','因为你，我今天很开心'],
            moodSad: ['有点难过...','你能陪陪我吗','心里空落落的'],
            moodAngry: ['好生气😤','不想理任何人','别惹我'],
            moodTired: ['好累啊...','想睡觉了💤','今天太累了'],
            blockedByUser: ['你拉黑我了...我做错什么了吗😢','对不起...我是不是惹你生气了'],
            unblockedByUser: ['你终于理我了...我好开心❤️','我还以为再也见不到你了'],
            blockedUser: ['我不想再和你说话了','就这样吧，再见'],
            favUp: ['你对我真好❤️','我又更喜欢你了怎么办','好开心！今天是最棒的一天'],
            favDown: ['你伤害了我...','好难过...你为什么要这样','我对你太失望了']
        };

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000);

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    var lvl = Math.round(b.level * 100);
                    document.getElementById('battery-percent').textContent = lvl + '%';
                    var lel = document.getElementById('battery-level');
                    if (lel) { lel.setAttribute('width', Math.round((lvl/100)*18)); lel.setAttribute('fill', lvl <= 20 ? '#ff3b30' : 'currentColor'); }
                });
            }
        }

        function getActiveApi() {
            var apis = JSON.parse(localStorage.getItem('saved_apis') || '[]');
            return apis.length > 0 ? apis[apis.length - 1] : null;
        }

        function initRoleData(role) {
            if (role.favorability === undefined) role.favorability = 0;
            if (!role.mood) role.mood = 'calm';
            if (!role.moodReason) role.moodReason = '';
            if (role.isBlockedByUser === undefined) role.isBlockedByUser = false;
            if (role.hasBlockedUser === undefined) role.hasBlockedUser = false;
            if (role.doNotDisturb === undefined) role.doNotDisturb = false;
            if (!role.messageQueue) role.messageQueue = [];
            if (role.isReplying === undefined) role.isReplying = false;
            if (!role.language) role.language = '中文';
            if (!role.translate) role.translate = false;
            if (!role.innerThoughts) role.innerThoughts = [];
            if (role.dailyPermissionRequested === undefined) role.dailyPermissionRequested = false;
            return role;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateClock(); updateBattery();
            var params = new URLSearchParams(window.location.search);
            roleId = parseInt(params.get('id'));
            if (!roleId) { window.location.href = 'chat.html'; return; }
            loadRole();
            isOnChatPage = true;
            document.getElementById('back-link').addEventListener('click', function(e) {
                e.preventDefault();
                isOnChatPage = false;
                if (currentChatRole) { currentChatRole.unread = 0; saveRoleToStorage(); }
                window.location.href = 'chat.html';
            });

            // 处理来自Daily的申请
            var action = params.get('action');
            if (action === 'dailyRequest') {
                setTimeout(function() {
                    if (!currentChatRole || !currentChatRole.messages) return;
                    currentChatRole.messages.push({
                        type: 'user',
                        text: '我想查看你的日常行程',
                        time: Date.now(),
                        isDailyRequest: true
                    });
                    saveRoleToStorage();
                    renderMessages();
                    setTimeout(function() {
                        var fav = currentChatRole.favorability || 0;
                        if (fav >= 50) {
                            currentChatRole.dailyPermissionGranted = true;
                            currentChatRole.messages.push({ type: 'ai', text: '好呀，你可以查看我的日常~', time: Date.now() });
                        } else if (fav >= 20) {
                            currentChatRole.messages.push({ type: 'ai', text: '嗯...我们还不够熟，再等等吧', time: Date.now() });
                        } else {
                            currentChatRole.messages.push({ type: 'ai', text: '不行，我拒绝', time: Date.now() });
                        }
                        saveRoleToStorage();
                        renderMessages();
                    }, 1500);
                }, 500);
            }
        });

        function applyChatSettings() {
            var container = document.getElementById('messages-container');
            if (currentChatRole && currentChatRole.chatBackground) {
                container.style.backgroundImage = 'url(' + currentChatRole.chatBackground + ')';
            } else { container.style.backgroundImage = ''; }
        }

        function getBubbleShapeClass() {
            return 'bubble-shape-' + (currentChatRole ? (currentChatRole.bubbleShape || 'round') : 'round');
        }

        function needsTranslation() {
            return currentChatRole && currentChatRole.language !== '中文' && currentChatRole.translate;
        }

        function updateBlockedUI() {
            var input = document.getElementById('chat-input');
            var banner = document.getElementById('blocked-banner');
            var unblockBtn = document.getElementById('unblock-request');
            if (!currentChatRole) return;
            if (currentChatRole.isBlockedByUser) { banner.classList.add('show'); banner.innerText = '已拉黑该角色，对方无法给你发消息'; }
            else { banner.classList.remove('show'); }
            if (currentChatRole.hasBlockedUser) {
                input.classList.add('blocked-input');
                input.placeholder = '你已被 ' + (currentChatRole.remark || currentChatRole.name) + ' 拉黑，无法发送消息';
                input.disabled = true; unblockBtn.classList.add('show');
            } else {
                input.classList.remove('blocked-input'); input.placeholder = '';
                input.disabled = false; unblockBtn.classList.remove('show');
            }
        }

        function requestUnblock() {
            if (!currentChatRole) return;
            currentChatRole.favorability = Math.max((currentChatRole.favorability || -50), -40);
            currentChatRole.hasBlockedUser = false;
            updateMood(); saveRoleToStorage(); updateBlockedUI(); updateFeelingHeart(); renderMessages();
            alert((currentChatRole.remark || currentChatRole.name) + ' 已解除拉黑');
        }

        function loadRole() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === roleId) { currentChatRole = roles[i]; break; } }
            if (!currentChatRole) { window.location.href = 'chat.html'; return; }
            currentChatRole = initRoleData(currentChatRole);
            currentChatRole.unread = 0; currentChatRole.lastInteraction = Date.now();
            saveRoleToStorage(); currentApi = getActiveApi();
            document.getElementById('chat-nav-name').innerText = currentChatRole.remark || currentChatRole.name;
            updateBlockedUI(); updateFeelingHeart(); applyChatSettings(); renderMessages();
        }

        function openMore() { if (currentChatRole) window.location.href = 'chat-settings.html?id=' + currentChatRole.id; }

        function formatTime(ts) { var d = new Date(ts); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

        function renderMessages() {
            var container = document.getElementById('messages-container');
            applyChatSettings();
            var msgs = currentChatRole ? (currentChatRole.messages || []) : [];
            if (msgs.length === 0) { container.innerHTML = ''; return; }
            var userBubbleColor = currentChatRole.userBubbleColor || '#95ec69';
            var roleBubbleColor = currentChatRole.roleBubbleColor || '#ffffff';
            var shapeClass = getBubbleShapeClass();
            var showTranslation = needsTranslation();
            var html = '';
            for (var i = 0; i < msgs.length; i++) {
                var msg = msgs[i];
                var isTyping = msg.isTyping || msg.text.indexOf('typing-dots') !== -1;
                var text = isTyping ? msg.text : escapeHtml(msg.text);
                var timeStr = msg.time ? formatTime(msg.time) : '';
                if (msg.type === 'ai') {
                    var roleImg = currentChatRole.avatar || '';
                    if (msg.isRequest) {
                        html += '<div class="msg-row-ai"><img class="msg-avatar" src="' + roleImg + '" alt=""><div class="msg-content ai">';
                        html += '<div class="request-card"><div class="request-text">' + escapeHtml(msg.text) + '</div>';
                        html += '<div class="request-btns"><button class="btn-accept" onclick="handleDailyRequest(\'accept\')">同意</button>';
                        html += '<button class="btn-reject" onclick="handleDailyRequest(\'reject\')">拒绝</button></div></div>';
                        if (timeStr && !isTyping) html += '<div class="msg-time">' + timeStr + '</div>';
                        html += '</div></div>';
                    } else if (msg.requestResult) {
                        html += '<div class="msg-row-ai"><img class="msg-avatar" src="' + roleImg + '" alt=""><div class="msg-content ai">';
                        html += '<div class="request-card"><div class="request-text">' + escapeHtml(msg.requestText || '') + '</div>';
                        html += '<div class="request-result">' + escapeHtml(msg.requestResult) + '</div></div>';
                        if (timeStr && !isTyping) html += '<div class="msg-time">' + timeStr + '</div>';
                        html += '</div></div>';
                    } else {
                        var isWhite = roleBubbleColor.toLowerCase() === '#ffffff' || roleBubbleColor.toLowerCase() === '#fff';
                        var bs = 'style="background:' + roleBubbleColor + ';' + (isWhite ? 'border:0.5px solid #e0e0e0;' : '') + '"';
                        html += '<div class="msg-row-ai"><img class="msg-avatar" src="' + roleImg + '" alt=""><div class="msg-content ai"><div class="msg-bubble ' + shapeClass + '" ' + bs + '>' + text + '</div>';
                        if (!isTyping && showTranslation && msg.translation && msg.translation !== '翻译中...') html += '<div class="translation-bubble" onclick="this.classList.toggle(\'hidden\')">' + escapeHtml(msg.translation) + '</div>';
                        else if (!isTyping && showTranslation && msg.translation === '翻译中...') html += '<div class="translation-bubble" style="color:#bbb;">翻译中...</div>';
                        if (timeStr && !isTyping) html += '<div class="msg-time">' + timeStr + '</div>';
                        html += '</div></div>';
                    }
                } else {
                    var userImg = localStorage.getItem('savedAvatar') || '默认头像.jpg';
                    var ubs = 'style="background:' + userBubbleColor + ';"';
                    var isBlockedMsg = currentChatRole.hasBlockedUser && i === msgs.length - 1;
                    html += '<div class="msg-row-user"><img class="msg-avatar" src="' + userImg + '" alt=""><div class="msg-content user"><div class="msg-bubble-wrap"><div class="msg-bubble ' + shapeClass + '" ' + ubs + '>' + text + '</div>';
                    if (isBlockedMsg) html += '<span class="blocked-exclamation" onclick="alert(\'对方已拉黑你，消息未送达\')">!</span>';
                    html += '</div>';
                    if (timeStr && !isTyping) html += '<div class="msg-time">' + timeStr + '</div>';
                    html += '</div></div>';
                }
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingMessage() {
            if (!currentChatRole || !currentChatRole.messages) return;
            for (var i = currentChatRole.messages.length - 1; i >= 0; i--) {
                if (currentChatRole.messages[i].isTyping || currentChatRole.messages[i].text.indexOf('typing-dots') !== -1) {
                    currentChatRole.messages.splice(i, 1); break;
                }
            }
        }

        function sendMsg() {
            if (!currentChatRole || currentChatRole.hasBlockedUser) return;
            currentChatRole = initRoleData(currentChatRole);
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text) return;
            if (!currentChatRole.messages) currentChatRole.messages = [];
            currentChatRole.lastInteraction = Date.now();
            currentChatRole.messageQueue.push(text);
            currentChatRole.messages.push({ type: 'user', text: text, time: Date.now() });
            generateInnerThought(text);
            input.value = ''; saveRoleToStorage(); renderMessages();
            updateFavorabilityAndMood(text);
            updateFeelingHeart();
            if (currentChatRole.isBlockedByUser) return;
            if (!currentChatRole.isReplying) processMessageQueue();
        }

        function processMessageQueue() {
            if (!currentChatRole || currentChatRole.messageQueue.length === 0) {
                currentChatRole.isReplying = false; saveRoleToStorage(); return;
            }
            currentChatRole.isReplying = true;
            var mood = currentChatRole.mood || 'calm';
            var config = MOOD_CONFIG[mood] || MOOD_CONFIG.calm;
            var fav = currentChatRole.favorability || 0;
            var prob = config.prob;
            if (fav < -30) prob -= 0.2; if (fav > 80) prob += 0.05;
            prob = Math.min(Math.max(prob, 0), 1);
            if (Math.random() > prob) { currentChatRole.messageQueue = []; currentChatRole.isReplying = false; saveRoleToStorage(); return; }
            var delay = config.delay + Math.floor(Math.random() * 1000);
            var allMsgs = currentChatRole.messageQueue.join('；');
            setTimeout(function() {
                if (!currentChatRole || currentChatRole.messageQueue.length === 0) { currentChatRole.isReplying = false; saveRoleToStorage(); return; }
                currentChatRole.messageQueue = []; showTyping(); callApiForReply(allMsgs);
            }, delay);
        }

        function updateFavorabilityAndMood(userMsg) {
            var msg = userMsg.toLowerCase();
            var oldFav = currentChatRole.favorability || 0;
            var change = 0;
            var pw = ['可爱','聪明','帅','漂亮','厉害','棒','喜欢','爱','好','谢谢','开心','想你','温柔','善良','对不起','抱歉'];
            var nw = ['讨厌','烦','滚','恶心','笨','傻','丑','垃圾','废物','恨','滚开','别烦我'];
            for (var i = 0; i < pw.length; i++) { if (msg.indexOf(pw[i]) !== -1) { change += 5; break; } }
            for (var j = 0; j < nw.length; j++) { if (msg.indexOf(nw[j]) !== -1) { change -= 10; break; } }
            if (change !== 0) {
                currentChatRole.favorability = Math.min(Math.max(oldFav + change, -100), 100);
                updateMood();
                if (currentChatRole.favorability < -50 && !currentChatRole.hasBlockedUser) currentChatRole.hasBlockedUser = true;
                if (currentChatRole.favorability >= -40 && currentChatRole.hasBlockedUser) currentChatRole.hasBlockedUser = false;
                updateBlockedUI();
                // 好感度首次超过50，角色自动发申请
                if (oldFav <= 50 && currentChatRole.favorability > 50 && !currentChatRole.dailyPermissionRequested) {
                    currentChatRole.dailyPermissionRequested = true;
                    var requests = JSON.parse(localStorage.getItem('daily_requests') || '[]');
                    requests.push({ from: currentChatRole.name, fromId: currentChatRole.id, to: 'user', time: Date.now(), status: 'pending', autoTriggered: true });
                    localStorage.setItem('daily_requests', JSON.stringify(requests));
                    saveRoleToStorage();
                    setTimeout(function() {
                        if (!currentChatRole.messages) currentChatRole.messages = [];
                        currentChatRole.messages.push({ type: 'ai', text: '我想查看你的日常行程~可以吗？', time: Date.now(), isRequest: true });
                        if (!isOnChatPage && !currentChatRole.doNotDisturb) currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                        saveRoleToStorage(); renderMessages();
                    }, 2000);
                }
            }
            var hour = new Date().getHours();
            if (hour >= 23 || hour < 6) { currentChatRole.mood = 'tired'; currentChatRole.moodReason = '已经很晚了，有点困'; }
            saveRoleToStorage();
        }

        function updateMood() {
            var fav = currentChatRole.favorability || 0;
            if (fav > 60) { currentChatRole.mood = 'happy'; currentChatRole.moodReason = '和你聊天很开心'; }
            else if (fav < -30) { currentChatRole.mood = 'angry'; currentChatRole.moodReason = '不想理你'; }
            else if (fav < 20) { currentChatRole.mood = 'sad'; currentChatRole.moodReason = '有点不开心'; }
            else { currentChatRole.mood = 'calm'; currentChatRole.moodReason = ''; }
        }

        function generateInnerThought(userMsg) {
            if (!currentChatRole) return;
            if (!currentChatRole.innerThoughts) currentChatRole.innerThoughts = [];
            var fav = currentChatRole.favorability || 0;
            var thoughts = [];
            var msg = userMsg.toLowerCase();
            if (msg.indexOf('在干嘛') !== -1 || msg.indexOf('在做什么') !== -1) thoughts.push('她在关心我，想知道我在做什么');
            if (msg.indexOf('想你') !== -1 || msg.indexOf('想你了') !== -1) thoughts.push('她也想我了，我好开心');
            if (msg.indexOf('喜欢') !== -1 || msg.indexOf('爱') !== -1) thoughts.push('她说喜欢我...我心跳加速了');
            if (msg.indexOf('晚安') !== -1) thoughts.push('她跟我说晚安了，今晚应该能做个好梦');
            if (msg.indexOf('早安') !== -1 || msg.indexOf('早上好') !== -1) thoughts.push('一醒来就收到她的消息，今天一定会很美好');
            if (msg.indexOf('对不起') !== -1 || msg.indexOf('抱歉') !== -1) thoughts.push('她跟我道歉了...其实我也有不对的地方');
            if (msg.indexOf('谢谢') !== -1) thoughts.push('她对我这么客气，我也要对她更好');
            if (msg.indexOf('哈哈') !== -1 || msg.indexOf('笑') !== -1) thoughts.push('她笑了，看来我的回复让她开心了');
            if (msg.indexOf('生气') !== -1 || msg.indexOf('讨厌') !== -1) thoughts.push('她好像生气了...我是不是做错了什么');
            if (msg.indexOf('吃') !== -1 || msg.indexOf('饭') !== -1) thoughts.push('她在关心我的饮食，好贴心');
            if (thoughts.length === 0) {
                if (fav > 80) thoughts.push('她主动来找我聊天，我好幸福');
                else if (fav > 60) thoughts.push('和她聊天总是很开心');
                else if (fav > 40) thoughts.push('嗯...她又发消息来了');
                else if (fav > 20) thoughts.push('不知道该回复什么好');
                else if (fav >= 0) thoughts.push('她好像不太想理我...');
                else if (fav > -30) thoughts.push('有点烦，不太想回');
                else if (fav > -50) thoughts.push('她又来了，真烦人');
                else thoughts.push('不想看到她');
            }
            var thought = thoughts[Math.floor(Math.random() * thoughts.length)];
            currentChatRole.innerThoughts.push({ trigger: userMsg, thought: thought, time: Date.now() });
            if (currentChatRole.innerThoughts.length > 20) currentChatRole.innerThoughts.shift();
            saveRoleToStorage();
        }

        function updateFeelingHeart() {
            if (!currentChatRole) return;
            var fav = currentChatRole.favorability || 0;
            var heart = document.getElementById('nav-feeling');
            var color = fav > 60 ? '#F7A1C4' : fav > 20 ? '#E0B0C0' : fav > 0 ? '#D0D0D0' : '#B0B0B0';
            var fillPercent = Math.max(0, Math.min(100, fav + 50)) / 100;
            var fillColor = fav > 60 ? '#F7A1C4' : fav > 20 ? '#E0B0C0' : fav > 0 ? '#D0D0D0' : '#B0B0B0';
            heart.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2"><defs><clipPath id="hc2"><rect y="' + ((1-fillPercent)*24) + '" width="24" height="' + (fillPercent*24) + '"/></clipPath></defs><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" fill="' + fillColor + '" fill-opacity="' + fillPercent + '"/></svg>';
        }

        function showFeelingModal() {
            if (!currentChatRole) return;
            var fav = currentChatRole.favorability || 0;
            var percent = Math.round(fav);
            var color = fav > 60 ? '#F7A1C4' : fav > 20 ? '#E0B0C0' : fav > 0 ? '#C0C0C0' : '#B0B0B0';
            document.getElementById('fav-number').innerText = percent + '%';
            document.getElementById('feeling-bar-fill').style.width = Math.max(0, Math.min(100, fav + 50)) + '%';
            document.getElementById('feeling-bar-fill').style.background = color;
            var thoughts = currentChatRole.innerThoughts || [];
            if (thoughts.length > 0) {
                var latest = thoughts[thoughts.length - 1];
                document.getElementById('feeling-thought').innerText = '💭 ' + latest.thought;
                document.getElementById('feeling-trigger').style.display = 'inline-block';
                document.getElementById('feeling-trigger').innerText = '触发：「' + latest.trigger + '」';
            } else {
                document.getElementById('feeling-thought').innerText = '暂无记录';
                document.getElementById('feeling-trigger').style.display = 'none';
            }
            document.getElementById('feeling-modal').classList.add('active');
        }

        function closeFeelingModal() { document.getElementById('feeling-modal').classList.remove('active'); }

        function handleDailyRequest(action) {
            if (!currentChatRole) return;
            var requests = JSON.parse(localStorage.getItem('daily_requests') || '[]');
            for (var i = requests.length - 1; i >= 0; i--) {
                if (requests[i].from === currentChatRole.name && requests[i].status === 'pending') {
                    requests[i].status = action === 'accept' ? 'accepted' : 'rejected'; break;
                }
            }
            localStorage.setItem('daily_requests', JSON.stringify(requests));
            if (action === 'accept') {
                currentChatRole.dailyPermissionGranted = true;
                saveRoleToStorage();
                if (!currentChatRole.messages) currentChatRole.messages = [];
                currentChatRole.messages.push({ type: 'ai', text: '太好了！现在你可以查看我的日常啦~', time: Date.now() });
            } else {
                if (!currentChatRole.messages) currentChatRole.messages = [];
                currentChatRole.messages.push({ type: 'ai', text: '好吧...那算了', time: Date.now() });
            }
            saveRoleToStorage(); renderMessages();
        }

        function callApiForReply(userMsg) {
            if (!currentChatRole.messages) currentChatRole.messages = [];
            var typingMsg = { type: 'ai', text: '<span class="typing-dots"><span></span><span></span><span></span></span>', time: Date.now(), isTyping: true };
            currentChatRole.messages.push(typingMsg); saveRoleToStorage(); renderMessages();
            if (!currentApi) {
                setTimeout(function() {
                    removeTypingMessage();
                    var localReply = generateLocalReply();
                    var translation = needsTranslation() ? translateText(localReply, currentChatRole.language) : '';
                    currentChatRole.messages.push({ type: 'ai', text: localReply, time: Date.now(), translation: translation });
                    if (!isOnChatPage && !currentChatRole.doNotDisturb) currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                    currentChatRole.isReplying = false; saveRoleToStorage(); renderMessages(); hideTyping();
                }, 1500);
                return;
            }
            var apiMessages = [{ role: 'system', content: buildPrompt() }];
            var start = Math.max(0, currentChatRole.messages.length - 12);
            for (var i = start; i < currentChatRole.messages.length; i++) {
                var m = currentChatRole.messages[i];
                if (!m.isTyping && m.text.indexOf('typing-dots') === -1) apiMessages.push({ role: m.type === 'user' ? 'user' : 'assistant', content: m.text });
            }
            tryRequest(currentApi.url + '/v1/chat/completions', apiMessages, 0);
        }

        function tryRequest(url, messages, retryCount) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('Authorization', 'Bearer ' + currentApi.key);
            xhr.onload = function() {
                if (!currentChatRole) return;
                removeTypingMessage();
                if (xhr.status >= 200 && xhr.status < 300) {
                    var data = JSON.parse(xhr.responseText);
                    var reply = data.choices && data.choices[0] ? data.choices[0].message.content : '';
                    if (reply.match(/^(message received|received|ok|got it|收到|好的收到|了解).*/i)) reply = generateLocalReply();
                    var translation = needsTranslation() ? translateText(reply, currentChatRole.language) : '';
                    currentChatRole.messages.push({ type: 'ai', text: reply, time: Date.now(), translation: translation });
                } else if (retryCount === 0) { tryRequest(currentApi.url + '/chat/completions', messages, 1); return; }
                else { currentChatRole.messages.push({ type: 'ai', text: '错误 ' + xhr.status, time: Date.now() }); }
                if (!isOnChatPage && !currentChatRole.doNotDisturb) currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                currentChatRole.isReplying = false; saveRoleToStorage(); renderMessages(); hideTyping();
            };
            xhr.onerror = function() {
                if (!currentChatRole) return;
                removeTypingMessage();
                if (retryCount === 0) { tryRequest(currentApi.url + '/chat/completions', messages, 1); return; }
                currentChatRole.messages.push({ type: 'ai', text: '网络错误', time: Date.now() });
                if (!isOnChatPage && !currentChatRole.doNotDisturb) currentChatRole.unread = (currentChatRole.unread || 0) + 1;
                currentChatRole.isReplying = false; saveRoleToStorage(); renderMessages(); hideTyping();
            };
            xhr.send(JSON.stringify({ model: currentApi.model, messages: messages, temperature: 0.8, max_tokens: 500 }));
        }

        function showTyping() { var el = document.getElementById('chat-nav-name'); if (el) el.innerText = '正在输入中...'; }
        function hideTyping() { var el = document.getElementById('chat-nav-name'); if (el && currentChatRole) el.innerText = currentChatRole.remark || currentChatRole.name; }

        function buildPrompt() {
            var r = currentChatRole;
            var nick = r.userNickname || r.userName || '你';
            var mood = r.mood || 'calm';
            var fav = r.favorability || 0;
            var lang = r.language || '中文';
            var config = MOOD_CONFIG[mood] || MOOD_CONFIG.calm;
            var p = '你是一个角色扮演AI，你的设定如下：\n【名字】' + r.name + '\n【性格】' + (r.personality||'无') + '\n【背景】' + (r.background||'无') + '\n';
            p += '【口头禅】' + (r.catchphrase||'无') + '\n【与用户关系】' + (r.relation||'朋友') + '\n';
            if (r.userPreference) p += '【用户偏好】' + r.userPreference + '\n';
            p += '【当前心情】' + config.replyStyle + '\n【好感度】' + fav + '%\n';
            if (lang !== '中文') p += '【回复语言】你必须用' + lang + '回复\n';
            if (fav > 60) p += '好感度高，请热情亲切地回复\n';
            if (fav < 20 && fav >= -30) p += '好感度低，请冷淡简短回复\n';
            if (fav < -30) p += '好感度很低，请带着不耐烦或生气的语气回复\n';
            p += '【规则】以角色身份直接说话，不要确认语句，回复1-3句话\n';
            return p;
        }

        function generateLocalReply() {
            var r = currentChatRole;
            var mood = r.mood || 'calm';
            var lang = r.language || '中文';
            var replies = {
                '中文': { happy: ['好呀！','当然可以~','超开心！'], calm: ['嗯嗯','好的','明白了'], sad: ['...','哦','好吧'], angry: ['哼','随便你','别烦我'], tired: ['累了...','明天再说吧','好困'] },
                'English': { happy: ['Great!','Awesome~'], calm: ['Okay','Got it'], sad: ['...','Oh'], angry: ['Hmph','Whatever'], tired: ['Tired...','Maybe tomorrow'] },
                '日本語': { happy: ['いいね！','最高！'], calm: ['うん','わかった'], sad: ['...','そう'], angry: ['ふん','勝手に'], tired: ['疲れた...','また明日'] },
                '한국어': { happy: ['좋아!','최고야~'], calm: ['응','알겠어'], sad: ['...','그래'], angry: ['흥','맘대로'], tired: ['피곤해...','내일'] }
            };
            var lr = replies[lang] || replies['中文'];
            var list = lr[mood] || lr.calm;
            return list[Math.floor(Math.random() * list.length)];
        }

        function translateText(text, lang) {
            if (!text || lang === '中文') return '';
            var map = {
                'Great!':'太好了！','Awesome~':'太棒了~','Okay':'好的','Got it':'明白了','Oh':'哦','Alright':'好吧','Fine':'行吧',
                'Hmph':'哼','Whatever':'随便','So tired...':'好累...','Maybe tomorrow':'也许明天吧',
                'いいね！':'真好！','最高！':'最棒！','うん':'嗯','わかった':'知道了','そう':'这样啊','ふん':'哼','勝手に':'随你','疲れた...':'累了...','また明日':'明天见',
                '좋아!':'好！','최고야~':'最棒~','응':'嗯','알겠어':'知道了','그래':'好吧','흥':'哼','맘대로':'随便','피곤해...':'累了...','내일':'明天'
            };
            if (map[text]) return map[text];
            var lm = { 'English':'en','日本語':'ja','한국어':'ko' };
            translateViaApi(text, lm[lang]||'en');
            return '翻译中...';
        }

        function translateViaApi(text, sl) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=zh&dt=t&q=' + encodeURIComponent(text), true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try { var d = JSON.parse(xhr.responseText); var t = ''; for (var i = 0; i < d[0].length; i++) t += d[0][i][0]; updateTranslation(text, t); }
                    catch(e) { updateTranslation(text, '(翻译失败)'); }
                } else { updateTranslation(text, '(翻译失败)'); }
            };
            xhr.onerror = function() { updateTranslation(text, '(翻译失败)'); };
            xhr.send();
        }

        function updateTranslation(orig, trans) {
            if (!currentChatRole || !currentChatRole.messages) return;
            for (var i = currentChatRole.messages.length - 1; i >= 0; i--) {
                if (currentChatRole.messages[i].type === 'ai' && currentChatRole.messages[i].text === orig) {
                    currentChatRole.messages[i].translation = trans; saveRoleToStorage(); renderMessages(); break;
                }
            }
        }

        function saveRoleToStorage() {
            if (!currentChatRole) return;
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) { if (roles[i].id === currentChatRole.id) { roles[i] = currentChatRole; break; } }
            localStorage.setItem('chat_roles', JSON.stringify(roles));
        }

        function escapeHtml(text) { var d = document.createElement('div'); d.innerText = text || ''; return d.innerHTML; }
    </script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>朋友圈</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:#fff; border-radius:0; display:flex; flex-direction:column; overflow:hidden;
        }
        #viewport { flex:1; overflow-y:auto; }
        #viewport::-webkit-scrollbar { display:none; }

        .nav-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 16px; background:#fff; border-bottom:0.5px solid #e5e5ea;
            position:sticky; top:0; z-index:10;
        }
        .nav-back { color:#000; font-size:17px; cursor:pointer; }
        .nav-title { font-size:17px; font-weight:600; }

        .moments-header {
            padding:30px 20px; text-align:center; background:#fff;
            border-bottom:0.5px solid #e5e5ea;
        }
        .moments-avatar { width:70px; height:70px; border-radius:50%; margin-bottom:10px; }
        .moments-name { font-size:20px; font-weight:600; }
        .moments-bg {
            height:200px; background:linear-gradient(180deg,#e8e8ed 0%,#f2f2f7 100%);
            display:flex; align-items:center; justify-content:center;
        }
        .empty-text { color:#c7c7cc; font-size:15px; text-align:center; padding:40px; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div id="viewport">
            <div class="nav-bar">
                <span class="nav-back" onclick="history.back()">〈</span>
                <span class="nav-title">朋友圈</span>
                <span style="width:30px;"></span>
            </div>

            <div class="moments-header">
                <img class="moments-avatar" id="moments-avatar" src="" alt="">
                <div class="moments-name" id="moments-name"></div>
            </div>

            <div class="moments-bg">
                <div class="empty-text">
                    <p style="font-size:40px;margin-bottom:10px;">📭</p>
                    <p>还没有发布朋友圈</p>
                    <p style="font-size:13px;color:#c7c7cc;">内容即将上线，敬请期待</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var roleId = parseInt(params.get('id'));
            if (!roleId) return;

            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === roleId) {
                    document.getElementById('moments-avatar').src = roles[i].avatar || '';
                    document.getElementById('moments-name').innerText = roles[i].name || '';
                    break;
                }
            }
        });
    </script>
</body>
</html>

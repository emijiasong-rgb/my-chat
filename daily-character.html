<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>角色详情</title>
    <style>
        :root {
            --bg: #FDF8F2;
            --card-bg: #fff;
            --text: #3A3A3A;
            --green: #7CB87C;
            --purple: #E0D4F5;
            --pink: #F7A1C4;
            --grey: #B0B0B0;
            --separator: #f0ede8;
            --red: #F5D4D4;
            --light-green: #D4F0D4;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background:#1a1a1a; height:100dvh; width:100vw;
            display:flex; justify-content:center; align-items:center;
            font-family:-apple-system,sans-serif; overflow:hidden;
        }
        #phone-shell {
            width:100vw; max-width:430px; height:100dvh; max-height:932px;
            background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
            position:relative;
        }
        .status-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px 6px; font-size:13px; font-weight:600; color:var(--text);
            background:var(--bg); position:relative; z-index:2;
        }
        .nav-bar {
            display:flex; align-items:center; padding:10px 16px;
            background:var(--bg); border-bottom:0.5px solid var(--separator);
            position:relative; z-index:2;
        }
        .nav-back { font-size:17px; color:#007aff; cursor:pointer; text-decoration:none; }
        .nav-title { font-size:17px; font-weight:600; position:absolute; left:50%; transform:translateX(-50%); color:var(--text); }

        #viewport { flex:1; overflow-y:auto; position:relative; z-index:2; }
        #viewport::-webkit-scrollbar { display:none; }

        /* 模糊覆盖层 */
        .blur-overlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            background:rgba(255,255,255,0.3); z-index:10;
            display:flex; flex-direction:column; align-items:center;
            justify-content:center;
        }
        .blur-overlay.hidden { display:none; }

        .lock-icon {
            width:60px; height:60px; display:flex; align-items:center;
            justify-content:center; margin-bottom:12px;
        }
        .lock-icon svg { width:48px; height:48px; stroke:var(--purple); stroke-width:1.5; }
        .lock-text { font-size:16px; color:var(--text); font-weight:600; margin-bottom:20px; }
        .lock-btn {
            padding:12px 28px; border-radius:20px; border:none;
            background:var(--purple); color:#5B4A7A; font-size:14px;
            font-weight:600; cursor:pointer;
        }
        .lock-btn:active { opacity:0.7; }

        .card {
            background:var(--card-bg); border-radius:20px; padding:18px;
            margin:10px 14px; box-shadow:0 2px 12px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px;
        }

        /* 好感度条 */
        .fav-bar {
            height:10px; border-radius:5px; background:#eee;
            overflow:hidden; margin-bottom:6px;
        }
        .fav-fill {
            height:100%; border-radius:5px; transition:width 0.5s;
        }
        .fav-label { font-size:12px; color:var(--grey); }

        .info-row {
            display:flex; justify-content:space-between; padding:8px 0;
            border-bottom:0.5px solid #f5f5f5; font-size:14px;
        }
        .info-row:last-child { border-bottom:none; }
        .info-label { color:var(--grey); }
        .info-value { color:var(--text); font-weight:500; }

        .tag-row {
            display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;
        }
        .tag-small {
            padding:5px 10px; border-radius:14px; font-size:12px;
            background:#f5f5f5; color:var(--text);
        }

        .common-card {
            background:linear-gradient(135deg, #FFF5F9, #F5F0FF);
            border-radius:16px; padding:14px; margin-top:8px;
        }
        .common-card .match-icon { font-size:16px; margin-right:4px; }

        /* 日历小窗 */
        .mini-calendar {
            display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
            text-align:center; font-size:12px; margin-top:8px;
        }
        .mini-calendar .day { padding:6px 2px; border-radius:8px; }
        .mini-calendar .day.today { border:2px solid var(--pink); font-weight:700; }
        .mini-calendar .day.period { background:var(--purple); }
        .mini-calendar .day.important { background:var(--red); }
        .mini-calendar .day.reminder { background:var(--light-green); }
        .mini-calendar .day-label { color:var(--grey); font-size:10px; }

        /* 申请弹窗 */
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.4); z-index:2000; justify-content:center; align-items:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-card {
            background:var(--purple); border-radius:20px; padding:24px 20px;
            width:85%; max-width:340px; text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,0.15);
        }
        .modal-card h3 { font-size:18px; color:#5B4A7A; margin-bottom:8px; }
        .modal-card p { font-size:13px; color:#7B6B9A; margin-bottom:16px; }
        .modal-btn {
            width:100%; padding:12px; border:none; border-radius:12px;
            font-size:15px; font-weight:600; cursor:pointer; margin-top:6px;
        }
        .modal-btn.send { background:#fff; color:#5B4A7A; }
        .modal-btn.cancel { background:transparent; color:#7B6B9A; }
    </style>
</head>
<body>
    <div id="phone-shell">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span id="battery-percent">--%</span>
            </div>
        </div>
        <div class="nav-bar">
            <a href="daily.html" class="nav-back">← 返回</a>
            <span class="nav-title" id="char-name">角色详情</span>
        </div>

        <div id="viewport" style="position:relative;">
            <!-- 内容区 -->
            <div id="content-area" style="padding-bottom:20px;"></div>

            <!-- 模糊锁覆盖层 -->
            <div class="blur-overlay" id="blur-overlay">
                <div class="lock-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/>
                    </svg>
                </div>
                <div class="lock-text">行程已锁定</div>
                <button class="lock-btn" id="lock-btn" onclick="showRequestModal()">向 角色 申请查看</button>
            </div>
        </div>
    </div>

    <!-- 申请弹窗 -->
    <div class="modal-overlay" id="request-modal">
        <div class="modal-card">
            <h3>申请查看 <span id="req-name"></span> 的日常行程</h3>
            <p>对方同意后，你可查看TA的作息、兴趣爱好和日程</p>
            <button class="modal-btn send" onclick="sendRequest()">发送申请</button>
            <button class="modal-btn cancel" onclick="closeRequestModal()">取消</button>
        </div>
    </div>

    <script>
        var currentRole = null;
        var roleId = null;

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        setInterval(updateClock, 1000); updateClock();

        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            roleId = parseInt(params.get('id'));
            if (!roleId) { window.location.href = 'daily.html'; return; }
            loadRole();
        });

        function loadRole() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === roleId) { currentRole = roles[i]; break; }
            }
            if (!currentRole) { window.location.href = 'daily.html'; return; }

            document.getElementById('char-name').innerText = currentRole.remark || currentRole.name;
            document.getElementById('lock-btn').innerText = '向 ' + (currentRole.remark || currentRole.name) + ' 申请查看';
            document.getElementById('req-name').innerText = currentRole.remark || currentRole.name;

            // 检查权限
            checkPermission();
            renderContent();
        }

        function checkPermission() {
            var granted = currentRole.dailyPermissionGranted || false;
            // 检查是否被拉黑
            if (currentRole.hasBlockedUser) {
                currentRole.dailyPermissionGranted = false;
                saveRole();
            }
            // 检查好感度
            if ((currentRole.favorability || 0) < -50) {
                currentRole.dailyPermissionGranted = false;
                saveRole();
            }

            if (currentRole.dailyPermissionGranted) {
                document.getElementById('blur-overlay').classList.add('hidden');
            } else {
                document.getElementById('blur-overlay').classList.remove('hidden');
            }
        }

        function renderContent() {
            var area = document.getElementById('content-area');
            var r = currentRole;
            var fav = r.favorability || 0;
            var favColor = fav > 50 ? '#F7A1C4' : fav > 0 ? '#D4A0B0' : '#B0B0B0';

            var presetData = getPresetData(r.name);
            var sleep = r.dailySleep || presetData.sleep || { weekdaySleep: '23:00', weekdayWake: '08:30', weekendSleep: '23:00', weekendWake: '08:30' };
            var hobbies = r.dailyHobbies || presetData.hobbies || [];
            var sports = r.dailySports || presetData.sports || [];

            var html = '';
            // 好感度
            html += '<div class="card"><div class="card-title">好感度</div>';
            html += '<div class="fav-bar"><div class="fav-fill" style="width:' + Math.max(0, fav) + '%;background:' + favColor + ';"></div></div>';
            html += '<div class="fav-label">' + fav + '%</div></div>';

            // 作息
            html += '<div class="card"><div class="card-title">作息时间</div>';
            html += '<div class="info-row"><span class="info-label">工作日睡觉</span><span class="info-value">' + sleep.weekdaySleep + '</span></div>';
            html += '<div class="info-row"><span class="info-label">工作日起床</span><span class="info-value">' + sleep.weekdayWake + '</span></div>';
            html += '<div class="info-row"><span class="info-label">周末睡觉</span><span class="info-value">' + sleep.weekendSleep + '</span></div>';
            html += '<div class="info-row"><span class="info-label">周末起床</span><span class="info-value">' + sleep.weekendWake + '</span></div></div>';

            // 兴趣爱好
            html += '<div class="card"><div class="card-title">兴趣爱好</div><div class="tag-row">';
            hobbies.forEach(function(h) { html += '<span class="tag-small">' + h + '</span>'; });
            html += '</div></div>';

            // 体育运动
            html += '<div class="card"><div class="card-title">体育运动</div><div class="tag-row">';
            sports.forEach(function(s) { html += '<span class="tag-small">' + s + '</span>'; });
            html += '</div></div>';

            // 共同点
            var myProfile = JSON.parse(localStorage.getItem('daily_profile') || '{}');
            var myHobbies = myProfile.hobbies || [];
            var common = [];
            hobbies.forEach(function(h) { if (myHobbies.indexOf(h) !== -1) common.push(h); });
            if (common.length > 0) {
                html += '<div class="card"><div class="card-title">你们俩的共同点</div>';
                html += '<div class="common-card">';
                common.forEach(function(c) { html += '<div><span class="match-icon">✨</span> 都喜欢 ' + c + '</div>'; });
                html += '</div></div>';
            }

            // 迷你日历
            html += '<div class="card"><div class="card-title" style="cursor:pointer;" onclick="window.location.href=\'daily-calendar.html?id=' + r.id + '\'">日程 ›</div>';
            html += renderMiniCalendar();
            html += '</div>';

            area.innerHTML = html;
        }

        function renderMiniCalendar() {
            var now = new Date();
            var year = now.getFullYear();
            var month = now.getMonth();
            var today = now.getDate();
            var daysInMonth = new Date(year, month + 1, 0).getDate();
            var firstDay = new Date(year, month, 1).getDay();
            var events = currentRole.dailyEvents || [];

            var html = '<div class="mini-calendar">';
            var labels = ['日','一','二','三','四','五','六'];
            labels.forEach(function(l) { html += '<div class="day-label">' + l + '</div>'; });
            for (var i = 0; i < firstDay; i++) { html += '<div class="day"></div>'; }
            for (var d = 1; d <= daysInMonth; d++) {
                var cls = 'day';
                if (d === today) cls += ' today';
                var event = findEvent(events, year, month + 1, d);
                if (event) cls += ' ' + event.type;
                html += '<div class="' + cls + '">' + d + '</div>';
            }
            html += '</div>';
            return html;
        }

        function findEvent(events, year, month, day) {
            for (var i = 0; i < events.length; i++) {
                var e = events[i];
                if (e.year === year && e.month === month && e.day === day) return e;
            }
            return null;
        }

        function getPresetData(name) {
            var presets = {
                '小星': { sleep: { weekdaySleep:'23:00', weekdayWake:'08:30', weekendSleep:'23:00', weekendWake:'08:30' }, hobbies: ['二次元','打游戏','王者荣耀'], sports: [] },
                '绵绵': { sleep: { weekdaySleep:'22:00', weekdayWake:'07:00', weekendSleep:'22:00', weekendWake:'07:00' }, hobbies: ['看电影','看书'], sports: [] },
                '森屿': { sleep: { weekdaySleep:'22:30', weekdayWake:'07:30', weekendSleep:'22:30', weekendWake:'07:30' }, hobbies: [], sports: ['打羽毛球','跑步'] },
                '云野': { sleep: { weekdaySleep:'01:00', weekdayWake:'09:00', weekendSleep:'01:00', weekendWake:'09:00' }, hobbies: ['追剧','Cosplay'], sports: [] }
            };
            return presets[name] || {};
        }

        function showRequestModal() {
            document.getElementById('request-modal').classList.add('active');
        }

        function closeRequestModal() {
            document.getElementById('request-modal').classList.remove('active');
        }

        function sendRequest() {
            var requests = JSON.parse(localStorage.getItem('daily_requests') || '[]');
            requests.push({
                from: 'user',
                to: currentRole.name,
                toId: currentRole.id,
                time: Date.now(),
                status: 'pending'
            });
            localStorage.setItem('daily_requests', JSON.stringify(requests));
            closeRequestModal();
            alert('已发送申请，等待 ' + (currentRole.remark || currentRole.name) + ' 同意');
        }

        function saveRole() {
            var roles = JSON.parse(localStorage.getItem('chat_roles') || '[]');
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].id === roleId) { roles[i] = currentRole; break; }
            }
            localStorage.setItem('chat_roles', JSON.stringify(roles));
        }

        document.getElementById('request-modal').addEventListener('click', function(e) {
            if (e.target === this) closeRequestModal();
        });
    </script>
</body>
</html>
